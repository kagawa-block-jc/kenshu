<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>会員研修委員会 出欠状況</title>
<link rel="preconnect" href="https://script.google.com">
<link rel="preconnect" href="https://script.googleusercontent.com">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --blue:#0a5aa8; --blue-deep:#063b73; --blue-soft:#e8f0fa; --ink:#111318; --muted:#6b7280; --line:#e6e8ec; --bg:#fff;
    --ok:#0f7b52; --ok-bg:#e4f3ea;
    --absent:#d92d20; --absent-bg:#fde8e6;
    --pending:#1a66c8; --pending-bg:#e4eefb;
    --noreply:#c98a12; --noreply-bg:#fff4d6;
    --display:"Anton","Impact","Arial Narrow",sans-serif;
    --sans:"Noto Sans JP","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased;padding-bottom:84px}


  /* ヒーロー */
  .hero{padding:26px 20px 18px;position:relative;overflow:hidden}
  .hero .en{font-family:var(--display);font-size:56px;line-height:.92;letter-spacing:.01em;color:var(--ink);text-transform:uppercase}
  .hero .en b{color:var(--blue);font-weight:400}
  .hero .org{font-size:12px;font-weight:700;margin-top:14px;color:#333}
  .hero .ttl{font-size:24px;font-weight:900;letter-spacing:.02em;line-height:1.3;margin:2px 0 12px}
  .meta{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:500}
  .meta div{display:flex;align-items:center;gap:10px}
  .meta svg{width:20px;height:20px;flex:0 0 20px;stroke:var(--blue);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .rule{height:3px;background:var(--blue-deep);margin:0}

  /* 会議切替 */
  .selbar{padding:12px 20px 0;position:relative}
  .selbar .copylink{display:block;margin:2px 0 0;min-height:40px;background:none;border:0;color:var(--blue);font:inherit;font-size:12.5px;font-weight:700;text-decoration:underline;cursor:pointer;padding:0}
  .selbar select{width:100%;appearance:none;-webkit-appearance:none;padding:10px 40px 10px 12px;border:1.5px solid var(--line);border-radius:8px;background:#fff;font:inherit;font-weight:700;font-size:14px;color:var(--ink)}
  .selbar:after{content:"";position:absolute;right:34px;top:50%;width:7px;height:7px;border-right:2px solid var(--blue);border-bottom:2px solid var(--blue);transform:translateY(-20%) rotate(45deg);pointer-events:none}

  /* セクション */
  section{padding:26px 20px 8px}
  .h{margin-bottom:14px}
  .h .jp{font-size:26px;font-weight:900;letter-spacing:.25em;color:var(--blue);line-height:1}
  .h .en{font-family:var(--display);font-size:12px;letter-spacing:.3em;color:var(--blue);margin-top:4px}

  /* 集計 */
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
  @media(min-width:560px){.stats{grid-template-columns:repeat(6,1fr)}}
  .stat{border-radius:10px;padding:10px 6px 9px;text-align:center;background:var(--blue-soft);border-bottom:3px solid var(--blue)}
  .stat b{display:block;font-family:var(--display);font-size:34px;line-height:1;color:var(--blue)}
  .stat span{display:block;font-size:11px;font-weight:700;margin-top:4px;color:#3a3f47}
  .stat .plus{display:block;font-style:normal;font-size:11px;font-weight:900;color:#7c5cbf;margin-top:3px;background:#f1edfb;border-radius:4px;padding:1px 4px}
  .stat.ok{background:var(--ok-bg);border-color:var(--ok)}.stat.ok b{color:var(--ok)}
  .stat.absent{background:var(--absent-bg);border-color:var(--absent)}.stat.absent b{color:var(--absent)}
  .stat.pending{background:var(--pending-bg);border-color:var(--pending)}.stat.pending b{color:var(--pending)}
  .stat.noreply{background:var(--noreply-bg);border-color:var(--noreply)}.stat.noreply b{color:var(--noreply)}
  .legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:11px;font-weight:700;color:#3a3f47;margin:0 2px 8px}
  .legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}

  /* 名簿 */
  .grp{display:flex;align-items:baseline;gap:8px;margin:18px 0 8px}
  .grp .n{font-family:var(--display);font-size:22px;color:var(--blue);letter-spacing:.02em}
  .grp .t{font-size:14px;font-weight:900}
  .grp .c{font-size:12px;color:var(--muted);margin-left:auto}
  .row{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:11px 12px 11px 14px;border-left:4px solid #e6e8ec;border-bottom:1px solid var(--line)}
  .row .who b{display:block;font-size:15px;font-weight:700}
  .row .who small{display:block;font-size:12px;color:var(--muted)}
  .tag.chg{box-shadow:0 0 0 2.5px #f2c94c}   /* 回答を変えた項目：黄色い枠 */
  .row .who small.memo{margin-top:3px;color:#8a6100;background:#fff3d6;padding:2px 8px;border-radius:5px;display:inline-block;white-space:normal;line-height:1.4}
  .row.absent{background:#fff6f5;border-left-color:var(--absent)}
  .row.pending{background:#f3f7fd;border-left-color:var(--pending)}
  .row.noreply{background:#fffaed;border-left-color:var(--noreply)}
  .row.in{border-left-color:var(--ok)}
  .row.obs{background:#f7f5ff;border-left-color:#7c5cbf}
  .row.obs.in{border-left-color:var(--ok)}
  .tag{display:inline-block;min-width:3.4em;text-align:center;padding:3px 8px;border-radius:4px;font-size:12px;font-weight:900;letter-spacing:.04em;white-space:nowrap}
  .tag.attend,.tag.late{background:var(--blue-soft);color:var(--blue)}
  .tag.zoom{background:var(--ok-bg);color:var(--ok)}
  .tag.proxy{background:#f6ecd3;color:#7a5a15}
  .tag.absent{background:var(--absent);color:#fff}
  .tag.pending{background:var(--pending);color:#fff}
  .tag.noreply{background:var(--noreply);color:#fff}
  .tag.none{background:transparent;color:#c0c5cc;font-weight:400}
  .col{display:flex;flex-direction:column;align-items:center;gap:2px}
  .col em{font-style:normal;font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.1em}
  .in-mark{font-size:11px;font-weight:900;color:var(--ok)}
  .updated{font-size:11px;color:var(--muted);text-align:right;margin-top:12px;letter-spacing:.06em}

  /* 会場・懇親会 */
  .kv{display:grid;grid-template-columns:5.5em 1fr;row-gap:12px;column-gap:12px;font-size:15px}
  .kv dt{font-size:11px;font-weight:900;letter-spacing:.14em;color:var(--blue);padding-top:3px}
  .kv dd{margin:0;font-weight:500}
  .kv dd b{font-size:17px;font-weight:900}
  /* 会場の見出しカード：日時と会場を一番大きく。服装などは普通の太さ */
  .vhero{border:1.5px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:14px;background:#fff}
  .vhero .when{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
  .vhero .date{font-family:var(--display);font-size:34px;line-height:1;color:var(--blue);letter-spacing:.02em}
  .vhero .date small{font-family:var(--sans);font-size:14px;font-weight:900;color:var(--ink);margin-left:4px}
  .vhero .time{font-family:var(--display);font-size:30px;line-height:1;color:var(--ink)}
  .vhero .time small{font-family:var(--sans);font-size:12px;font-weight:700;color:var(--muted);margin-left:4px}
  .vhero .gather{margin-top:8px;display:inline-block;background:#fff4e5;color:#7a4b00;border:1px solid #f5c98a;border-radius:8px;padding:5px 10px;font-size:13.5px;line-height:1.4}
  .vhero .gather b{font-size:15px}
  .vhero .where{display:flex;gap:8px;align-items:flex-start;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}
  .vhero .where .pin{flex:0 0 auto;font-size:11px;font-weight:900;letter-spacing:.14em;color:var(--blue);padding-top:5px}
  .vhero .where b{font-size:19px;font-weight:900;line-height:1.35;word-break:break-word}
  .kv dd.plain{font-weight:500;color:var(--ink)}
  .pname{font-size:18px;font-weight:900;line-height:1.35}
  /* 懇親会：店名カード＋会費・人数の2枚 */
  .topics{border:1.5px solid var(--line);border-radius:12px;padding:12px 16px 12px;margin:-4px 0 14px;background:#fff}
  .topics .tl{font-size:11px;font-weight:900;letter-spacing:.14em;color:var(--blue);margin-bottom:4px}
  .topics ol{margin:0;padding-left:24px;font-size:15px;font-weight:700;line-height:1.55}
  .topics li{padding:2px 0}
  .topics li::marker{color:var(--blue);font-weight:900}
  .phero{border:1.5px solid var(--line);border-radius:12px;padding:14px 16px;background:#fff}
  .phero .pin{font-size:11px;font-weight:900;letter-spacing:.14em;color:var(--blue)}
  .phero .nm{font-size:21px;font-weight:900;line-height:1.3;margin-top:2px;word-break:break-word}
  .phero .ad{font-size:13px;color:var(--muted);margin-top:4px;line-height:1.5}
  .phero .btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  .pstats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
  .pstat{border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;background:#fff}
  .pstat .l{font-size:11px;font-weight:900;letter-spacing:.14em;color:var(--blue)}
  .pstat .v{font-family:var(--display);font-size:30px;line-height:1.1;color:var(--ink);margin-top:4px}
  .pstat .v.fee{color:var(--blue)}
  .pstat .s{font-size:11px;color:var(--muted);margin-top:2px}
  .fee{display:inline-block;font-family:var(--display);font-size:24px;color:var(--blue);line-height:1}
  .fee small{font-family:var(--sans);font-size:11px;font-weight:700;color:var(--muted);margin-left:6px}
  .online{display:inline-block;background:var(--blue);color:#fff;text-decoration:none;font-weight:900;padding:10px 18px;border-radius:8px;font-size:14px}
  .online.agenda{background:#fff;color:var(--blue);border:2px solid var(--blue)}
  .doclinks{display:flex;flex-wrap:wrap;gap:6px}
  .online.doc{padding:7px 12px;font-size:13px;border-width:1.5px}
  #s-docs .arow{display:flex;gap:12px;align-items:flex-start;padding:10px 4px;border-bottom:1px dashed var(--line)}
  #s-docs .arow:last-child{border-bottom:0}
  #s-docs .d{min-width:58px;text-align:center;line-height:1.1}
  #s-docs .d b{display:block;font-size:19px;font-family:var(--display, inherit)}
  #s-docs .d small{font-size:11px;color:var(--muted)}
  #s-docs .t{flex:1;min-width:0}
  #s-docs .t>b{display:block;font-size:14.5px;margin-bottom:6px}
  #s-docs .arcmore{margin-top:6px}
  #s-docs .arcmore summary{cursor:pointer;color:var(--blue);font-weight:700;font-size:13px;padding:8px 4px}
  .empty{color:var(--muted);font-size:14px}

  /* 下タブ */
  .tabbar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);display:flex;z-index:20;padding-bottom:env(safe-area-inset-bottom)}
  .tabbar a{flex:1;text-align:center;padding:10px 4px 8px;text-decoration:none;color:#6b7280;font-size:12px;font-weight:900;position:relative;border-right:1px solid var(--line)}
  .tabbar a:last-child{border-right:0}
  .tabbar svg{display:block;margin:0 auto 3px;width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .tabbar a.on{color:var(--blue)}
  .tabbar a.on:after{content:"";position:absolute;left:24%;right:24%;bottom:4px;height:3px;background:var(--blue);border-radius:2px}
  .msg{padding:80px 16px;text-align:center;color:var(--muted);font-size:17px;font-weight:700}
  .msg.load::before{content:"";display:block;width:36px;height:36px;margin:0 auto 14px;border:4px solid #dfe5ee;border-top-color:var(--blue);border-radius:50%;animation:spin .9s linear infinite}
  .msg.load small{display:block;font-weight:400;font-size:13px;margin-top:6px}
  @keyframes spin{to{transform:rotate(360deg)}}
  /* 回答（埋め込み）セクション */
  #s-answer{padding:22px 20px 10px}
  #s-answer .ansbtn{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;background:var(--blue);color:#fff;border:0;border-radius:12px;padding:16px 18px;font:inherit;font-weight:900;font-size:17px;cursor:pointer;text-align:left}
  #s-answer .ansbtn small{display:block;font-weight:500;font-size:12.5px;opacity:.9;margin-top:3px}
  #s-answer .ansbtn .arrow{font-size:20px;flex-shrink:0}
  #s-answer.closed .ansbtn{background:#fff;color:var(--blue);border:2px solid var(--blue)}
  #s-answer .ansnote{font-size:12.5px;color:var(--muted);margin:8px 2px 0}
  #s-answer .frame{display:none;margin-top:12px;border:1.5px solid var(--line);border-radius:12px;overflow:hidden;background:#fff;position:relative}
  #s-answer .frame .ld{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--muted);font-weight:700;font-size:15px;background:#fff;z-index:1}
  #s-answer .frame .ld::before{content:"";width:32px;height:32px;border:4px solid #dfe5ee;border-top-color:var(--blue);border-radius:50%;animation:spin .9s linear infinite}
  #s-answer .frame.ready .ld{display:none}
  #s-answer.open .frame{display:block}
  #s-answer iframe{display:block;width:100%;border:0;min-height:320px;height:900px}
  #s-answer .mlist{margin-top:10px;border:1.5px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}
  #s-answer .mlist .mrow{display:flex;gap:12px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);cursor:pointer}
  #s-answer .mlist .mrow:last-child{border-bottom:0}
  #s-answer .mlist .mrow.on{background:#eef3fc;box-shadow:inset 4px 0 0 var(--blue)}
  #s-answer .mlist .d{min-width:54px;text-align:center;line-height:1.1}
  #s-answer .mlist .d b{display:block;font-size:18px;font-family:var(--display, inherit)}
  #s-answer .mlist .d small{font-size:11px;color:var(--muted)}
  #s-answer .mlist .t{flex:1;min-width:0}
  #s-answer .mlist .t b{display:block;font-size:14.5px}
  #s-answer .mlist .t small{font-size:12px;color:var(--muted)}
  #s-answer .mlist .st{font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap}
  #s-answer .mlist .st.ok{background:#e3f3e8;color:var(--ok)}
  #s-answer .mlist .st.ng{background:#fff3dc;color:#b8860b}
  #s-answer .mlist .st.na{background:#eef1f5;color:var(--muted)}
  #s-answer .mlist .late{color:#b8860b;font-weight:700}
  #s-answer .who{font-size:12px;color:var(--muted);margin:8px 2px 0}
  #s-answer .who button{background:none;border:0;color:var(--blue);font:inherit;font-size:12px;text-decoration:underline;cursor:pointer;padding:0 0 0 6px}
  /* 管理ページへ */
  #s-admin{padding:18px 20px 28px}
  #s-admin .adminbtn{display:block;text-align:center;border:2px solid var(--blue);border-radius:12px;padding:14px 16px;color:var(--blue);background:#fff;text-decoration:none;font-weight:900;font-size:16px}
  #s-admin .adminbtn small{display:block;font-weight:500;font-size:12px;margin-top:3px;color:var(--muted)}
  #s-admin .adminbtn:hover{background:var(--blue);color:#fff}
  #s-admin .adminbtn:hover small{color:#fff}
  /* 今後の予定 */
  #s-sched .row{display:flex;gap:12px;align-items:center;padding:10px 4px;border-bottom:1px dashed var(--line);cursor:pointer}
  #s-sched .row:last-child{border-bottom:0}
  #s-sched .d{min-width:58px;text-align:center;line-height:1.1}
  #s-sched .d b{display:block;font-size:19px;font-family:var(--display, inherit)}
  #s-sched .d small{font-size:11px;color:var(--muted)}
  #s-sched .t{flex:1;min-width:0}
  #s-sched .t b{display:block;font-size:14.5px}
  #s-sched .t small{font-size:12px;color:var(--muted)}
  #s-sched .t small.tp{display:block;margin-top:2px;color:var(--ink);opacity:.8;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #s-sched .tag{font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:#eef1f5;color:var(--muted);white-space:nowrap}
  #s-sched .tag.now{background:var(--blue);color:#fff}
  #s-sched .tag.acc{background:#e3f3e8;color:var(--ok)}
  #s-sched .row.cur{background:#f4f7fd;border-radius:8px}


  /* ---------- 日程調整 ---------- */
  #s-poll .row{display:flex;gap:10px;align-items:center;padding:10px 4px;border-bottom:1px dashed var(--line);cursor:pointer;border-left:0}
  #s-poll .row .t{flex:1;min-width:0}
  #s-poll .row .t b{display:block;font-size:14.5px}
  #s-poll .row .t small{display:block;font-size:12px;color:var(--muted);margin-top:2px}
  #s-poll .row .st{font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap}
  #s-poll .row .st.ok{background:#e3f3e8;color:var(--ok)}
  #s-poll .row .st.ng{background:#fff3dc;color:#b8860b}
  #s-poll .row .tag{font-size:11px;padding:3px 8px;border-radius:999px;background:#eef1f5;color:var(--muted);white-space:nowrap}
  #s-poll .row .tag.acc{background:#e3f3e8;color:var(--ok)}
  #s-poll .row .tag.now{background:var(--blue-soft);color:var(--blue)}
  #s-poll .pollnote{font-size:12px;color:var(--muted);margin-top:8px}
  #app.pollview{display:block;max-width:820px;margin:0 auto;background:#fff}
  .pollview .hero .ttl{font-size:22px}
  .pollview .pfixed{margin-top:10px;background:var(--blue-soft);color:var(--blue);border-radius:10px;padding:10px 14px;font-size:14px;font-weight:700}
  .pollview .pfixed.off{background:#f1f1f3;color:var(--muted)}
  .pollview section{padding:22px 20px 8px}
  .pollview .pf{margin:12px 0}
  .pollview .pf label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:4px}
  .pollview .pf select,.pollview .pf input{width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:10px;font:inherit;font-size:15px;background:#fff}
  .pollview .pmine{font-size:12px;color:var(--muted);margin-top:6px}
  .pollview .pcands{border:1.5px solid var(--line);border-radius:12px;overflow:hidden}
  .pollview .pc{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line)}
  .pollview .pc:last-child{border-bottom:0}
  .pollview .pcl{flex:1;min-width:0}
  .pollview .pcl b{font-size:16px}
  .pollview .pcl small{margin-left:8px;font-size:13px;color:var(--muted);font-weight:700}
  .pollview .pcl .pcn{display:block;width:100%;margin-top:5px;padding:5px 8px;border:1px dashed #cfd5de;border-radius:8px;font:inherit;font-size:12.5px;background:#fafbfc}
  .pollview .pcl .pcn:focus{border-style:solid;border-color:var(--blue);outline:0;background:#fff}
  .pollview .pc{align-items:flex-start}
  .pollview .prw i{font-style:normal;color:#b8860b}
  .pollview .pcb{display:flex;gap:6px}
  .pollview .pm{width:46px;height:42px;border:1.5px solid var(--line);border-radius:10px;background:#fff;font:inherit;font-size:20px;font-weight:900;color:#9aa3af;cursor:pointer}
  .pollview .pm.on.mo{background:var(--ok);border-color:var(--ok);color:#fff}
  .pollview .pm.on.md{background:#e6a700;border-color:#e6a700;color:#fff}
  .pollview .pm.on.mx{background:var(--absent);border-color:var(--absent);color:#fff}
  .pollview .pquick{display:flex;gap:6px;margin-top:8px}
  .pollview .pq{flex:1;padding:8px;border:1.5px solid var(--line);border-radius:999px;background:#fff;font:inherit;font-size:12.5px;font-weight:700;color:var(--muted);cursor:pointer}
  .pollview .psend{width:100%;margin-top:6px;padding:15px;border:0;border-radius:12px;background:var(--blue);color:#fff;font:inherit;font-size:16px;font-weight:900;cursor:pointer}
  .pollview .psend:disabled{opacity:.6}
  .pollview .perr{color:var(--absent);font-size:13px;font-weight:700;margin-top:8px;min-height:1em}
  .pollview #s-psum .h{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px}

      h += '<div class="row ' + rowClass(p) + '"' + (p.chg ? ' title="' + esc(p.chg.when) + ' に回答を変更（' + esc([p.chg.attend ? '会議 ' + p.chg.attend : '', p.chg.party ? '懇親会 ' + p.chg.party : ''].filter(Boolean).join('／')) + '）"' : '') + '>' +

  // オブザーバー（別枠）
  if(d.observers && d.observers.length){
    h += '<div class="grp"><span class="n">' + ('0' + (groups.length+1)).slice(-2) + '</span><span class="t">オブザーバー</span><span class="c">' + d.observers.length + '名</span></div>';
    d.observers.forEach(function(o){
      h += '<div class="row obs' + (o.checkedIn ? ' in' : '') + '">' +
           '<div class="who"><b>' + esc(o.name) + '</b><small>' + (o.role ? esc(o.role) + '　／　' : '') + '同行：' + esc(o.host) + (o.checkedIn ? '　<span class="in-mark">✔ 出席済</span>' : '') + '</small></div>' +
           '<div class="col"><em>会議</em><span class="tag attend">出席</span></div>' +
           (hasParty ? '<div class="col"><em>懇親会</em>' + (o.party ? '<span class="tag attend">出席</span>' : '<span class="tag absent">欠席</span>') + '</div>' : '<div></div>') +
           '</div>';
    });
  }
  h += '<div class="updated">' + esc(d.updated) + ' 時点</div></section>';

  // 会場
  // 日付は「10/22（木）」のように短く大きく、年は小さく添える
  var dm = String(m.date || '').match(/(\d{4})年(\d{1,2})月(\d{1,2})日\s*\(?([日月火水木金土])?\)?/);
  var dateBig = dm ? (dm[2] + '/' + dm[3] + (dm[4] ? '<small>（' + dm[4] + '）</small>' : '') + '<small style="color:var(--muted);font-weight:700">' + dm[1] + '年</small>') : esc(m.date);
  h += '<section id="s-venue" class="dots"><div class="h"><div class="jp">会 場</div><div class="en">VENUE</div></div>' +
       '<div class="vhero"><div class="when"><span class="date">' + dateBig + '</span>' + (m.time ? '<span class="time">' + esc(m.time) + '<small>開始</small></span>' : '') + '</div>' +
       (m.gather ? '<div class="gather">🕒 <b>' + esc(m.gather.time) + ' ' + esc(m.gather.label || '集合') + '</b>' + (m.gather.why ? '　' + esc(m.gather.why) : '') + '</div>' : '') +
       '<div class="where"><span class="pin">会場</span><b>' + (m.place ? esc(m.place) : '<span style="color:var(--muted);font-weight:500">追ってご案内</span>') + '</b></div></div>' +
       (m.topics && m.topics.length ? '<div class="topics"><div class="tl">議題</div><ol>' + m.topics.map(function(t){ return '<li>' + esc(t) + '</li>'; }).join('') + '</ol></div>' : '') +
       '<dl class="kv">' +
       (m.dress ? '<dt>服装</dt><dd class="plain">' + esc(m.dress) + '</dd>' : '') +
       (m.online ? '<dt>オンライン</dt><dd><a class="online" href="' + esc(m.online) + '" target="_blank" rel="noopener">Zoomで参加する</a></dd>' : '') +
       (m.agenda ? '<dt>アジェンダ</dt><dd><a class="online agenda ag" href="' + esc(m.agenda) + '" target="_blank" rel="noopener">アジェンダを見る</a></dd>' : '') +
       ((m.docs || []).length ? '<dt>資料</dt><dd class="doclinks">' + m.docs.map(function(d){ return '<a class="online agenda doc" href="' + esc(d.url) + '" target="_blank" rel="noopener">' + esc(d.name) + '</a>'; }).join('') + '</dd>' : '') +
       (ORG.cal ? '<dt>カレンダー</dt><dd><a class="online agenda" href="' + esc(ORG.cal + encodeURIComponent(id)) + '" target="_blank" rel="noopener">カレンダーに登録する</a><div style="font-size:11px;color:var(--muted);margin-top:4px">任意。Google／iPhone のカレンダーに予定を入れる</div></dd>' : '') +
       (m.feeMeeting > 0 ? '<dt>会議費</dt><dd><span class="fee">' + yen(m.feeMeeting) + '<small>当日集金</small></span></dd>' : '') +
       (m.note ? '<dt>備考</dt><dd>' + esc(m.note).replace(/\n/g, '<br>') + '</dd>' : '') +
       '</dl></section>';

  // 懇親会
  h += '<section id="s-party" class="dots"><div class="h"><div class="jp">' + esc(m.partyName || '懇親会') + '</div><div class="en">RECEPTION</div></div>' + (hasParty && m.partyTime ? '<div style="margin:-4px 0 10px;font-weight:900;font-size:16px">🕒 ' + esc(m.partyTime) + '</div>' : '');
  if(hasParty){
    h += '<div class="phero"><div class="pin">会場</div>' +
           '<div class="nm">' + (m.partyPlace ? esc(m.partyPlace) : '<span style="color:var(--muted);font-weight:500;font-size:16px">追ってご案内</span>') + '</div>' +
           (m.partyVenue && (m.partyVenue.address || m.partyVenue.tel) ? '<div class="ad">' + (m.partyVenue.address ? esc(m.partyVenue.address) : '') + (m.partyVenue.address && m.partyVenue.tel ? '<br>' : '') + (m.partyVenue.tel ? 'TEL ' + esc(m.partyVenue.tel) : '') + '</div>' : '') +
           (m.partyVenue ? '<div class="btns"><a class="online" href="' + esc(m.partyVenue.map) + '" target="_blank" rel="noopener">Googleマップで開く</a>' + (m.partyVenue.url ? '<a class="online agenda" href="' + esc(m.partyVenue.url) + '" target="_blank" rel="noopener">お店のサイト</a>' : '') + '</div>' : '') +
         '</div>' +
         '<div class="pstats">' +
           (m.partyFee > 0 ? '<div class="pstat"><div class="l">会費</div><div class="v fee">' + yen(m.partyFee) + '</div><div class="s">当日集金</div></div>' : '<div class="pstat"><div class="l">会費</div><div class="v" style="font-size:20px;padding-top:6px">なし</div></div>') +
           '<div class="pstat"><div class="l">出席予定</div><div class="v">' + (c.partyComes + obsP) + '<span style="font-family:var(--sans);font-size:14px;font-weight:900;margin-left:3px">名</span></div>' + (obsP ? '<div class="s">うちオブザーバー ' + obsP + '名</div>' : '<div class="s">回答ベース</div>') + '</div>' +
         '</div>' +
         (m.cancel ? '<div style="font-size:12px;color:var(--muted);margin-top:8px;line-height:1.5">懇親会のキャンセルは <b style="color:var(--ink)">' + esc(m.cancel.text) + '</b> までにお願いします。それ以降はお店の都合により懇親会費' + (m.cancel.full ? '' : '（' + yen(m.cancel.amount) + '）') + 'をご負担いただく場合があります。</div>' : '');
  } else {
    h += '<div class="empty">今回は懇親会はありません。</div>';
  }
  h += '</section>';

  // 今後の予定（懇親会の下）：押すとその会議に切り替わる
  var today = new Date(); today.setHours(0,0,0,0);
  var ups = LIST.filter(function(x){ return x.date && new Date(x.date + 'T00:00:00') >= today; }).sort(function(a,b){ return a.date.localeCompare(b.date); });
  var schedGrouped = !!PROJECT || (PROJECTS.length && ups.some(function(x){ return pjOf(x); }));
  var schedRow = function(x){ var dm = x.date.split('-'); var dt = new Date(x.date + 'T00:00:00'); return '<div class="row' + (x.id === id ? ' cur' : '') + '" data-go="' + esc(x.id) + '"><div class="d"><b>' + (+dm[1]) + '/' + (+dm[2]) + '</b><small>' + '日月火水木金土'[dt.getDay()] + '</small></div><div class="t"><b>' + esc(x.name) + '</b><small>' + esc(x.type) + (x.project && !schedGrouped ? '　📁 ' + esc(x.project) : '') + (x.time ? '　' + esc(x.time) + '～' : '') + '</small>' + (x.topics && x.topics.length ? '<small class="tp">議題：' + esc(x.topics.slice(0, 3).join('／')) + (x.topics.length > 3 ? ' ほか' + (x.topics.length - 3) + '件' : '') + '</small>' : '') + '</div>' + (x.id === id ? '<span class="tag now">表示中</span>' : x.accepting ? '<span class="tag acc">回答受付中</span>' : '') + '</div>'; };
  if(ups.length || PROJECT){
    h += '<section id="s-sched" class="dots"><div class="h"><div class="jp">今後の予定</div><div class="en">SCHEDULE</div></div>';
    if(PROJECT){
      // 入口のプロジェクトの予定を先頭に。その下に全体（例会・委員会）を小さく
      var mine = ups.filter(function(x){ return pjOf(x) === PROJECT; }), rest = ups.filter(function(x){ return pjOf(x) !== PROJECT; });
      h += '<div class="sgh"><span class="pj">📁 ' + esc(PROJECT) + '</span></div>' + (mine.length ? mine.map(schedRow).join('') : '<div class="empty pj">このプロジェクトの予定はまだありません</div>');
      if(rest.length) h += '<div class="sgh"><span class="k">全体の予定</span></div>' + rest.map(schedRow).join('');
    } else if(PROJECTS.length && ups.some(function(x){ return pjOf(x); })){
      // 全体表示：例会・委員会 → プロジェクトごと に見出しで区切る
      var plain = ups.filter(function(x){ return !pjOf(x); });
      h += (plain.length ? plain.map(schedRow).join('') : '');
      var seen = []; ups.forEach(function(x){ var pj = pjOf(x); if(pj && seen.indexOf(pj) < 0) seen.push(pj); });
      seen.forEach(function(pj){ h += '<div class="sgh"><span class="pj">📁 ' + esc(pj) + '</span></div>' + ups.filter(function(x){ return pjOf(x) === pj; }).map(schedRow).join(''); });
    } else h += ups.map(schedRow).join('');
    h += '</section>';
  }

  // これまでの資料：終わった会議のアジェンダ・資料（出られなかった人があとから見られる）。最初は直近3件、押すと全部
  if(ARCHIVE.length){
    var arcRow = function(x){ var dm = x.date.split('-'); return '<div class="arow"><div class="d"><b>' + (+dm[1]) + '/' + (+dm[2]) + '</b><small>' + dm[0] + '</small></div><div class="t"><b>' + esc(x.name) + '</b><div class="doclinks">' + x.docs.map(function(d){ return '<a class="online agenda doc" href="' + esc(d.url) + '" target="_blank" rel="noopener">' + esc(d.name) + '</a>'; }).join('') + '</div></div></div>'; };
    h += '<section id="s-docs" class="dots"><div class="h"><div class="jp">これまでの資料</div><div class="en">DOCUMENTS</div></div>' + ARCHIVE.slice(0, 3).map(arcRow).join('') + (ARCHIVE.length > 3 ? '<details class="arcmore"><summary>もっと前の会議（' + (ARCHIVE.length - 3) + '件）</summary>' + ARCHIVE.slice(3).map(arcRow).join('') + '</details>' : '') + '</section>';
  }

  // 日程調整（候補日に○△×）：受付中のものを一覧。押すとその調整のページへ
  var canMake = String(ORG.poll || '') === 'メンバー';
  if(POLLS.length || canMake){
    // 区分（会議／委員会・小委員会／渉外／その他）→ プロジェクト名 でまとめる。会議の予定の列とは別物
    var groups = [];
    var POLLV = PROJECT ? POLLS.filter(function(p){ return String(p.project || '').trim() === PROJECT; }) : POLLS;
    POLLV.forEach(function(p){ var k = p.kind || '会議', pj = p.project || ''; var g = groups.filter(function(x){ return x.kind === k && x.project === pj; })[0]; if(!g){ g = { kind: k, project: pj, items: [] }; groups.push(g); } g.items.push(p); });
    var korder = ['会議','委員会・小委員会','渉外','その他'];
    groups.sort(function(a,b){ return (korder.indexOf(a.kind) - korder.indexOf(b.kind)) || a.project.localeCompare(b.project, 'ja'); });
    h += '<section id="s-poll" class="dots"><div class="h"><div class="jp">日程調整</div><div class="en">SCHEDULING</div></div>' +
      (POLLV.length ? groups.map(function(g){ return '<div class="pgrp"><div class="pgh"><span class="k">' + esc(g.kind) + '</span>' + (g.project ? '<span class="pj">📁 ' + esc(g.project) + '</span>' : '') + '</div>' +
        g.items.map(function(p){ var st = !me ? '' : (p.answered || []).indexOf(me) >= 0 ? '<span class="st ok">回答済</span>' : (p.open ? '<span class="st ng">未回答</span>' : ''); var tag = p.state === '確定' ? '<span class="tag now">確定 ' + esc(p.fixed) + '</span>' : p.open ? '<span class="tag acc">受付中</span>' : '<span class="tag">締切</span>'; return '<div class="row" data-poll="' + esc(p.id) + '"><div class="t"><b>' + esc(p.title) + '</b><small>候補 ' + p.n + '件' + (p.first ? '（' + esc(p.first) + (p.n > 1 ? ' 〜 ' + esc(p.last) : '') + '）' : '') + '</small><small>主催 ' + esc(p.owner || '') + (p.deadline ? '　回答締切 ' + esc(fmtJ(p.deadline)) : '') + '</small></div>' + st + tag + '</div>'; }).join('') + '</div>'; }).join('') : '<div class="empty">' + (PROJECT ? 'このプロジェクトの日程調整はいまありません' : 'いま受付中の日程調整はありません') + '</div>') +
      (canMake ? '<button type="button" class="pollmake" id="pollMake">＋ 日程調整を作る<small>委員会・小委員会・渉外などの日程を決める（名簿の人なら誰でも）</small></button>' : '') +
      '<div class="pollnote">候補日に ○△× で答えると、人数の多い日がその日程になります</div></section>';
  }

  if(!accepting) h += ansSec;

  // 管理ページへ（管理者・スタッフ用）：左列の最後／スマホは最下部
  if(base) h += '<section id="s-admin"><a class="adminbtn" href="' + esc(ORG.adminPage || (base + '?admin=1')) + '" target="_blank" rel="noopener">⚙ 管理ページを開く<small>管理者・スタッフ専用（ログインが必要です）</small></a></section>';

  // 下タブ（受付中は「回答」を先頭、締切後は末尾）
  var tabAns = ansSec ? '<a href="#s-answer" data-s="s-answer">' + ICON.list + '回答</a>' : '';
  h += '<nav class="tabbar">' + (accepting ? tabAns : '') +
       '<a href="#s-status" class="on" data-s="s-status">' + ICON.list + '出欠</a>' +
       '<a href="#s-venue" data-s="s-venue">' + ICON.pin + '会場</a>' +
       '<a href="#s-party" data-s="s-party">' + ICON.cup + '懇親会</a>' +
       (accepting ? '' : tabAns) +
       '</nav>';

  var el = document.getElementById('app');
  el.innerHTML = h; fitEn();
  var sel2 = document.getElementById('sel2');
  if(sel2) sel2.onchange = function(){ load(this.value); };
  // プロジェクトのチップ：URLを同じページのまま切り替え（再読み込みなし）。入口の予定があればその会議に切り替える
  Array.prototype.forEach.call(el.querySelectorAll('[data-pj]'), function(b){ b.onclick = function(){
    var pj = b.dataset.pj || ''; if(pj === PROJECT) return; PROJECT = pj;
    try { history.replaceState(null, '', projectUrl(pj) + (pj ? '' : '?id=' + encodeURIComponent(id))); } catch(e){}
    var first = pj ? LIST.filter(function(x){ return pjOf(x) === pj && !x.past; }).sort(function(a,b){ return a.date.localeCompare(b.date); })[0] : null;
    if(first && first.id !== id){ load(first.id); window.scrollTo(0, 0); } else render(d, id);
  }; });
  var pjc = document.getElementById('pjCopy'); if(pjc) pjc.onclick = function(){ copyToClip(projectUrl(PROJECT), pjc, 'この小委員会専用のURLをコピー'); };
  var cl = document.getElementById('copyLink');
  if(cl) cl.onclick = function(){ var u = SITE + '?id=' + encodeURIComponent(id); var done = function(){ cl.textContent = 'コピーしました：' + u; setTimeout(function(){ cl.textContent = 'この会議のリンクをコピー'; }, 2500); }; if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(u).then(done, function(){ window.prompt('このURLをコピーしてください', u); }); } else { window.prompt('このURLをコピーしてください', u); } };
  // 回答の開閉（締切後は開いたときに読み込む）
  // 回答フォームの枠：読み込み完了（または10秒経過）で「読み込んでいます」を消す。高さの連絡が来なければ既定の高さで表示
  var frEl = document.getElementById('ansFrame'), frWrap = document.getElementById('ansFrameWrap');
  if(frEl && frWrap){ var ready = function(){ frWrap.classList.add('ready'); }; frEl.addEventListener('load', function(){ setTimeout(ready, 400); }); setTimeout(ready, 10000); }
  var at = document.getElementById('ansToggle');
  if(at) at.onclick = function(){ var sec = document.getElementById('s-answer'), fr = document.getElementById('ansFrame'); var open = sec.classList.toggle('open'); sec.classList.toggle('closed', !open); at.querySelector('.arrow').textContent = open ? '▲' : '▼'; if(open && fr && !fr.src && fr.dataset.src) fr.src = fr.dataset.src; };
  // 回答パネルの会議一覧：押した会議のフォームに切り替え
  // 別の会議を押したら、フォームだけでなくページ全体をその会議に切り替える（出欠一覧と回答フォームの会議がズレないように）
  Array.prototype.forEach.call(el.querySelectorAll('#s-answer .mrow'), function(r){ r.onclick = function(){
    var sec = document.getElementById('s-answer'), fr = document.getElementById('ansFrame');
    if(r.dataset.ans !== id){
      if(fr) fr.src = 'about:blank';   // 前の会議のフォームが一瞬残らないように先に消す
      PANEL_OPEN = true; load(r.dataset.ans); window.scrollTo(0, 0); return;
    }
    if(sec && !sec.classList.contains('open')){ sec.classList.add('open'); sec.classList.remove('closed'); var ar = sec.querySelector('.arrow'); if(ar) ar.textContent = '▲'; if(fr && !fr.src && fr.dataset.src) fr.src = fr.dataset.src; }
  }; });
  if(PANEL_OPEN){ PANEL_OPEN = false; var sec0 = document.getElementById('s-answer'); if(sec0 && !sec0.classList.contains('open')){ sec0.classList.add('open'); sec0.classList.remove('closed'); var ar0 = sec0.querySelector('.arrow'); if(ar0) ar0.textContent = '▲'; if(frEl && !frEl.src && frEl.dataset.src) frEl.src = frEl.dataset.src; } }
  // 締切後（閉じた状態）でも、少し遅らせて裏で読み込んでおく（開いたときに待たせない）
  setTimeout(function(){ var fr = document.getElementById('ansFrame'); if(fr && !fr.src && fr.dataset.src) fr.src = fr.dataset.src; }, 2500);
  var mc = document.getElementById('meClear'); if(mc) mc.onclick = function(){ try { localStorage.removeItem('att_me'); } catch(e){} render(d, id); };
  // 今後の予定 → その会議へ
  Array.prototype.forEach.call(el.querySelectorAll('#s-sched .row'), function(r){ r.onclick = function(){ if(r.dataset.go !== id){ load(r.dataset.go); window.scrollTo(0, 0); } }; });
  Array.prototype.forEach.call(el.querySelectorAll('#s-poll .row'), function(r){ r.onclick = function(){ loadPoll(r.dataset.poll); }; });
  var pm = document.getElementById('pollMake'); if(pm) pm.onclick = function(){ renderPollForm(null); };
  var tabs = el.querySelectorAll('.tabbar a');
  Array.prototype.forEach.call(tabs, function(a){
    a.onclick = function(){ Array.prototype.forEach.call(tabs, function(x){ x.classList.toggle('on', x === a); }); };
  });
  // スクロール位置で下タブをハイライト
  var secs = ['s-answer','s-status','s-venue','s-party'].map(function(i){ return document.getElementById(i); }).filter(Boolean);
  window.onscroll = function(){
    var y = window.scrollY + 120, cur = 's-status';
    secs.forEach(function(s){ if(s && s.offsetTop <= y) cur = s.id; });
    Array.prototype.forEach.call(tabs, function(x){ x.classList.toggle('on', x.dataset.s === cur); });
  };
}

/* ---------- 日程調整ページ：候補日に ○△×、集計 ---------- */
var POLL = null, PA = {}, PN = {};   // PA＝いま付けている ○△×（候補key → 記号）、PN＝候補ごとの備考（例：遅参）
function loadPoll(id){
  document.getElementById('app').innerHTML = '<div class="msg load">日程調整を読み込んでいます…<small>Googleのサーバーが起動するまで数秒かかることがあります</small></div>';
  google.script.run.withSuccessHandler(renderPoll).withFailureHandler(function(e){ document.getElementById('app').innerHTML = '<div class="msg">読み込めません：' + esc(e.message) + '</div>'; }).pollData(id);
}
function renderPoll(d){
  POLL = d;
  var app = document.getElementById('app'); app.classList.add('pollview');
  var me = ''; try { me = localStorage.getItem('att_me') || ''; } catch(e){}
  if(me && !d.targets.some(function(t){ return t.name === me; })) me = '';
  var mine = me && d.answers[me] ? d.answers[me] : null;
  PA = mine ? JSON.parse(JSON.stringify(mine.answers)) : {}; PN = mine && mine.notes ? JSON.parse(JSON.stringify(mine.notes)) : {};
  var canAnswer = d.state !== '確定' && d.state !== '取消';
  var s = d.summary;
  var h = '';

  ARCHIVE = INIT.archive || []; POLLS = INIT.polls || []; PROJECTS = INIT.projects || [];
  if(PROJECT && !PROJECTS.some(function(p){ return p.name === PROJECT; })) PROJECTS.push({ name: PROJECT, leader: '' });
  if(!INIT.list || !INIT.list.length) return;
  LIST = INIT.list;
  var y = window.pageYOffset;
  if(INIT.data && INIT.id === CUR_ID){ render(INIT.data, CUR_ID); window.scrollTo(0, y); }
  else if(!CUR_ID) bootList(LIST);
  else if(LIST.some(function(m){ return m.id === CUR_ID; })) load(CUR_ID, function(){ window.scrollTo(0, y); });
  else bootList(LIST);
};

}
</script>
