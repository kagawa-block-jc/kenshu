<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>会員研修委員会 管理ページ</title>
<link rel="preconnect" href="https://script.google.com">
<link rel="preconnect" href="https://script.googleusercontent.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Noto+Sans+JP:wght@400;500;700;900&display=swap">
<style>
  :root{--blue:#1a56c4;--blue-dk:#123c8a;--blue-soft:#e6eefb;--ink:#1b2430;--sub:#5b6675;--line:#dfe5ee;--bg:#f4f6fa;--card:#fff;
    --ok:#188038;--ok-soft:#e3f3e8;--ng:#c62828;--ng-soft:#fde8e8;--warn:#b7791f;--warn-soft:#fff3d6}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink)}
  body{font-family:"Noto Sans JP",system-ui,sans-serif;font-size:14px;line-height:1.55;padding-bottom:130px}
  button,input,select,textarea{font-family:inherit;font-size:14px}
  button{cursor:pointer}
  a{color:var(--blue)}

  header{position:sticky;top:0;z-index:20;background:#fff;border-bottom:3px solid var(--blue)}
  .hd{max-width:1180px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
  .brand{font-family:Anton,Impact,sans-serif;line-height:.92}
  .brand .l1{font-size:20px}.brand .l2{font-size:20px;color:var(--blue)}
  .org{font-size:12px;color:var(--sub);flex:1;min-width:200px}
  .me{font-size:12px;color:var(--sub);text-align:right}
  .me b{display:inline-block;padding:2px 9px;border-radius:999px;background:var(--blue-soft);color:var(--blue);font-size:11.5px;margin-left:6px}
  .me b.staff{background:var(--ok-soft);color:var(--ok)}
  nav{max-width:1180px;margin:0 auto;padding:6px 16px 8px;display:flex;gap:8px;flex-wrap:wrap;align-items:flex-start}
  nav .grp{display:flex;flex-direction:column;border-radius:10px;padding:4px 6px 5px;background:var(--g-bg)}
  nav .grp .gl{font-size:10.5px;font-weight:700;color:var(--g-fg);letter-spacing:.04em;padding:0 6px 2px;opacity:.85}
  nav .grp .gb{display:flex;gap:2px;flex-wrap:wrap}
  nav button{border:0;background:none;padding:6px 11px;font-weight:700;color:var(--sub);border-radius:7px;white-space:nowrap;font-size:13.5px}
  nav button:hover{background:rgba(255,255,255,.7)}
  nav button.on{color:#fff;background:var(--g-fg)}
  nav .grp.run{--g-bg:#e8f0fd;--g-fg:#1a56db}      /* 会議の運営（毎回） */
  nav .grp.data{--g-bg:#e6f5ea;--g-fg:#1e7a3a}     /* 基礎データ（たまに） */
  nav .grp.money{--g-bg:#fdf1e0;--g-fg:#b4600c}    /* お金・記録 */
  nav .grp.sys{--g-bg:#efeff2;--g-fg:#55556b}      /* システム・ヘルプ */
  nav .grp.master{--g-bg:#f6e8f3;--g-fg:#8a2c6e}   /* マスター */

  .wrap{max-width:1180px;margin:0 auto;padding:16px}
  .tab{display:none}.tab.on{display:block}
  .bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
  .bar h2{margin:0;font-size:18px;font-weight:900;flex:1}
  .bar input[type=search]{padding:8px 12px;border:1.5px solid var(--line);border-radius:999px;min-width:220px}
  .btn{padding:8px 16px;border-radius:8px;border:1.5px solid var(--line);background:#fff;font-weight:700;color:var(--ink)}
  a.btn{display:inline-block;text-decoration:none;line-height:normal}
  .btn.p{background:var(--blue);border-color:var(--blue);color:#fff}
  .btn.d{border-color:var(--ng);color:var(--ng)}
  .btn.s{padding:5px 10px;font-size:12.5px}
  .btn:disabled{opacity:.45;cursor:default}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
  /* 横スクロールは原則なし：列は折り返す。年間の出席状況だけ .wide で横スクロール（氏名列は固定） */
  .tbl{overflow-x:visible}
  .tbl.wide{overflow-x:auto}
  .tbl.wide th:nth-child(1),.tbl.wide td:nth-child(1){position:sticky;left:0;background:var(--card);z-index:2;box-shadow:2px 0 0 var(--line)}
  .tbl.wide th:nth-child(1){z-index:3;background:var(--bg)}
  table{width:100%;border-collapse:collapse;font-size:13.5px}
  th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle;white-space:normal;overflow-wrap:anywhere}
  td .btn{white-space:nowrap}
  th{font-size:11.5px;color:var(--sub);letter-spacing:.04em;background:var(--bg);position:sticky;top:0}
  tr:hover td{background:#fafbfd}
  td.name{font-weight:700;font-size:14.5px}
  .tag{display:inline-block;padding:1px 8px;border-radius:4px;font-size:11.5px;font-weight:700}
  .tag.b{background:var(--blue-soft);color:var(--blue)}.tag.g{background:var(--ok-soft);color:var(--ok)}.tag.r{background:var(--ng-soft);color:var(--ng)}.tag.y{background:var(--warn-soft);color:var(--warn)}
  .muted{color:var(--sub)}
  .lock{color:var(--sub);font-size:12px}
  .empty{padding:40px;text-align:center;color:var(--sub)}
  .ro{opacity:.6}

  /* modal */
  .mask{position:fixed;inset:0;background:rgba(27,36,48,.45);display:none;z-index:50;align-items:flex-start;justify-content:center;padding:30px 12px;overflow:auto}
  .mask.on{display:flex}
  .modal{background:#fff;border-radius:14px;width:100%;max-width:760px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
  .modal .mh{display:flex;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--line)}
  .modal .mh h3{margin:0;font-size:17px;flex:1}
  .modal .mb{padding:16px 20px;display:grid;grid-template-columns:1fr 1fr;gap:12px 16px}
  .modal .mf{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
  .f{display:flex;flex-direction:column;gap:4px}
  .f.wide{grid-column:1/-1}
  .f label{font-size:12px;color:var(--sub);font-weight:700}
  .f input,.f select,.f textarea{padding:9px 11px;border:1.5px solid var(--line);border-radius:8px;width:100%}
  .f textarea{min-height:70px;resize:vertical}
  .f .hint{font-size:11.5px;color:var(--sub)}
  .chk{display:flex;flex-wrap:wrap;gap:8px 16px}
  .chk label{display:flex;gap:6px;align-items:center;font-size:13.5px;color:var(--ink);font-weight:500;white-space:nowrap}
  .err{background:var(--ng-soft);color:var(--ng);padding:10px 14px;border-radius:8px;margin:0 20px 10px;font-size:13px;display:none}
  .err.on{display:block}
  @media (max-width:640px){.modal .mb{grid-template-columns:1fr}}
  /* スマホ：表は1行＝1枚のカードに組み替える（見出しは各セルの左に小さく出す）。年間の出席状況(.wide)だけ横スクロールのまま */
  .navm{display:none}
  @media (max-width:700px){
    nav{display:none}
    .navm{display:block;padding:6px 12px 10px}
    /* スマホのメニュー：押せるボタンに見せる（「ほかのページへ」）。押すと下からページ一覧 */
    .navm #navBtn{width:100%;display:flex;align-items:center;gap:10px;padding:9px 12px;border:2px solid var(--blue);border-radius:10px;background:var(--blue);color:#fff;font:inherit;text-align:left;cursor:pointer}
    .navm #navBtn .ic{font-size:20px;line-height:1}
    .navm #navBtn .cur{flex:1;min-width:0;line-height:1.2}
    .navm #navBtn .cur small{display:block;font-size:10.5px;opacity:.85}
    .navm #navBtn .cur b{display:block;font-size:16px}
    .navm #navBtn .sw{font-size:12px;font-weight:700;background:#fff;color:var(--blue);padding:6px 9px;border-radius:999px;white-space:nowrap}
    .navsheet{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:60}
    .navsheet.on{display:block}
    .navsheet .nsin{position:absolute;left:0;right:0;bottom:0;max-height:88vh;overflow:auto;background:#fff;border-radius:16px 16px 0 0;padding:12px 14px 24px}
    .navsheet .nsh{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
    .navsheet .nsh b{font-size:16px}
    .navsheet .nsh button{font:inherit;font-size:13px;padding:6px 12px;border:1.5px solid var(--line);border-radius:999px;background:#fff}
    .navsheet .nsg{margin-top:10px;padding:8px 10px 10px;border-radius:10px}
    .navsheet .nsg .gl{font-size:11px;font-weight:700;margin-bottom:6px}
    .navsheet .nsg button{display:flex;justify-content:space-between;align-items:center;width:100%;padding:12px 14px;margin-bottom:6px;border:1.5px solid rgba(0,0,0,.08);border-radius:10px;background:#fff;font:inherit;font-size:15px;font-weight:700;text-align:left}
    .navsheet .nsg button.on{border-color:var(--blue);color:var(--blue);background:#eef3fc}
    .navsheet .nsg button small{font-size:11px;font-weight:700;color:var(--blue)}
    .navsheet .nsg.run{background:#eef3fc} .navsheet .nsg.data{background:#eaf6ee} .navsheet .nsg.money{background:#fff6e3} .navsheet .nsg.sys{background:#f1f1f3} .navsheet .nsg.master{background:#f6e9f7}
    .hd{padding:8px 12px;gap:8px}
    .brand .l1,.brand .l2{font-size:15px}
    .org{display:none}
    .me{flex:1;text-align:right}
    .wrap{padding:10px 10px}
    .bar{flex-wrap:wrap;gap:8px}
    .bar h2{font-size:17px}
    .card{border-radius:10px}
    .tbl:not(.wide) thead{display:none}
    .tbl:not(.wide) table,.tbl:not(.wide) tbody,.tbl:not(.wide) tr{display:block;width:100%}
    .tbl:not(.wide) tr{padding:8px 0;border-bottom:6px solid var(--bg)}
    .tbl:not(.wide) tr:last-child{border-bottom:0}
    .tbl:not(.wide) td{display:block;position:relative;border:0;padding:3px 14px 3px calc(5.5em + 22px);font-size:13.5px;line-height:1.55}
    .tbl:not(.wide) td[data-label]::before{content:attr(data-label);position:absolute;left:14px;top:5px;width:5.5em;color:var(--sub);font-size:11.5px}
    .tbl:not(.wide) td:not([data-label]){padding-left:14px}
    .tbl:not(.wide) td > *{margin-right:6px}
    .bar h2{flex:0 0 100%;margin-bottom:2px}
    .bar select,.bar input[type=search]{flex:1 1 200px;min-width:0}
    .tbl:not(.wide) td.name,.tbl:not(.wide) td:first-child b{font-size:15px}
    .tbl:not(.wide) td.empty-cell{display:none}
    /* 読み上げ名簿は1人1行のまま詰める */
    /* 読み上げ順どおり 1行目：No 役職 ／ 2行目：氏名（ふりがな）／ 3行目：LOM 回答 受付 */
    .tbl.compact tr{display:grid;grid-template-columns:26px auto 1fr auto;column-gap:8px;row-gap:2px;padding:8px 12px;align-items:baseline}
    .tbl.compact td{display:block;padding:0;font-size:13px;position:static}
    .tbl.compact td[data-label]::before{content:none;position:static}
    .tbl.compact td:nth-child(1){grid-column:1;grid-row:2;color:var(--sub);text-align:right}
    .tbl.compact td:nth-child(3){grid-column:2;grid-row:2;font-size:15.5px;font-weight:900;white-space:nowrap}
    .tbl.compact td:nth-child(4){grid-column:3 / 5;grid-row:2;font-size:11.5px;color:var(--sub)}
    .tbl.compact td:nth-child(4):not(:empty)::before{content:'（'}
    .tbl.compact td:nth-child(4):not(:empty)::after{content:'）'}
    .tbl.compact td:nth-child(2){grid-column:2 / 5;grid-row:1;color:var(--ink);font-size:12.5px}
    .tbl.compact td:nth-child(5){grid-column:2;grid-row:3;color:var(--sub)}
    .tbl.compact td:nth-child(6){grid-column:3;grid-row:3}
    .tbl.compact td:nth-child(6)::before{content:'回答：';color:var(--sub);font-size:11.5px}
    .tbl.compact td:nth-child(7){grid-column:4;grid-row:3}
    .tbl.compact td:nth-child(7):not(:empty)::before{content:'受付';color:var(--ok);font-size:11.5px;margin-right:2px}
    #types .row.hdr{display:none}
    #types .row{grid-template-columns:1fr 1fr;gap:6px;padding:10px;border:1px solid var(--line);border-radius:10px}
    #types .row .tn{grid-column:1 / 3;font-weight:700}
    #types .row .tr{grid-column:1 / 3}
    #types .row button{justify-self:end}
    .mcard > div{flex-wrap:wrap}
    .mcard > div > div:first-child{min-width:70px;align-self:flex-start;border-radius:12px 0 12px 0 !important;border-right:0 !important}
    .mcard > div > div:last-child{flex-direction:row !important;width:100%;padding:0 12px 12px !important;justify-content:flex-end}
  }

  .toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 18px;border-radius:999px;font-size:13px;display:none;z-index:60}
  .toast.on{display:block}
  .gate{max-width:520px;margin:60px auto;background:#fff;border:1px solid var(--line);border-radius:14px;padding:28px;text-align:center}
  .gate h2{margin:0 0 8px}
  .gate p{color:var(--sub);margin:0 0 6px}

  .types{display:grid;gap:8px}
  .types .row{display:grid;grid-template-columns:1fr 100px 1fr 130px 40px;gap:8px;align-items:center}
  .types .row input{padding:8px 10px;border:1.5px solid var(--line);border-radius:8px;width:100%}
  .types .row select{padding:8px 10px;border:1.5px solid var(--line);border-radius:8px}
  .types .hdr{font-size:11.5px;color:var(--sub);font-weight:700}

  /* 会議シナリオ：本文の編集行（PCは4列、スマホは縦積み） */
  .schead{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
  .schead b{flex:1}
  .schead .muted{flex-basis:100%;font-size:12px}
  .scrow{display:grid;grid-template-columns:150px 1fr 170px auto;gap:8px;align-items:start;padding:8px 0;border-top:1px solid var(--line)}
  .scrow .sct{font-weight:700}
  .scrow .scx{min-height:70px;line-height:1.6;font-size:13px}
  .scrow .scn{min-height:70px;font-size:12px}
  .scrow .scops{display:flex;flex-direction:column;gap:3px}
  .scrow .scops .btn{padding:2px 8px;white-space:nowrap}
  @media(max-width:700px){
    .scrow{grid-template-columns:1fr;gap:6px;padding:12px 0}
    .scrow .scx{min-height:110px}
    .scrow .scn{min-height:44px}
    .scrow .scops{flex-direction:row;justify-content:flex-end}
  }

  /* 日程調整の集計 */
  .plist .prow{display:grid;grid-template-columns:150px 1fr auto;grid-template-areas:"l bar n" "l who who" "l act act";gap:4px 12px;align-items:center;padding:9px 10px;border-top:1px solid var(--line)}
  .plist .prow.top{background:#f3f8f1}
  .plist .prow.fixed{background:#eef3fc}
  .plist .pl{grid-area:l;font-size:14px}
  .plist .pbar{grid-area:bar;height:12px;background:#eef1f5;border-radius:999px;overflow:hidden;display:flex}
  .plist .pbar .o{display:block;height:100%;background:var(--ok)}
  .plist .pbar .d{display:block;height:100%;background:#e6a700}
  .plist .pn{grid-area:n;display:flex;gap:10px;font-size:12.5px;font-weight:700;white-space:nowrap}
  .plist .pn .o{color:var(--ok)} .plist .pn .d{color:#b8860b} .plist .pn .x{color:var(--ng)}
  .plist .pw{grid-area:who;font-size:12px;color:var(--sub);display:flex;gap:14px;flex-wrap:wrap}
  .plist .pw em{font-style:normal;font-weight:700;margin-right:4px}
  .plist .pact{grid-area:act}
  @media(max-width:700px){
    .plist .prow{grid-template-columns:1fr;grid-template-areas:"l" "bar" "n" "who" "act";gap:5px}
  }

  /* 会議シナリオ「読む（表示のみ）」：画面全体に読みやすく表示。印刷時はこれだけ印刷 */
  #scOverlay{display:none}
  body.scview #scOverlay{display:block;position:fixed;inset:0;background:#fff;z-index:70;overflow:auto;-webkit-overflow-scrolling:touch}
  body.scview #app{display:none}
  .scv{max-width:820px;margin:0 auto;padding:0 0 60px}
  .scvbar{position:sticky;top:0;display:flex;gap:8px;align-items:center;justify-content:space-between;padding:10px 14px;background:#fff;border-bottom:1px solid var(--line);z-index:1}
  .scvdoc{padding:18px 16px;font-size:15px;line-height:1.8;color:#111}
  .scvdoc .org{font-size:12px;color:#555}
  .scvdoc h1{font-size:20px;margin:2px 0 4px;font-weight:900}
  .scvdoc .when{font-size:13px;color:#333;margin-bottom:14px}
  .scvdoc section{padding:12px 0;border-top:1px solid #ccc}
  .scvdoc h2{font-size:15px;margin:0 0 6px;font-weight:900;color:var(--blue)}
  .scvdoc .x{white-space:normal;word-break:break-all}
  .scvdoc .n{margin-top:6px;font-size:12.5px;color:#555;background:#f4f6f9;border-radius:6px;padding:6px 10px}
  .scvdoc .vote{background:#fff7e6}
  @media print{
    body.scview{background:#fff}
    body.scview header,body.scview .scvbar,body.scview #toast,body.scview #mask{display:none !important}
    body.scview #scOverlay{position:static;overflow:visible}
    .scvdoc{font-size:10.5pt;line-height:1.6;padding:0}
    .scvdoc section{page-break-inside:avoid}
  }

  /* 出席確認名簿／会議シナリオ の切り替え */
  .modesw{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 0 12px}
  .modesw button{padding:10px 12px;border:2px solid var(--line);border-radius:12px;background:#fff;font:inherit;font-size:15px;font-weight:900;color:var(--sub);text-align:left;cursor:pointer}
  .modesw button small{display:block;font-size:11.5px;font-weight:500;margin-top:2px}
  .modesw button.on{border-color:var(--blue);background:var(--blue);color:#fff}
  .modesw button.on small{color:#e3ecfa}

  .chips{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 10px}
  .chip{padding:6px 12px;border:1.5px solid var(--line);border-radius:999px;background:#fff;font:inherit;font-size:12.5px;font-weight:700;color:var(--sub);cursor:pointer}
  .chip.on{background:var(--blue);border-color:var(--blue);color:#fff}

  /* ガイド：検索・折りたたみ */
  .gsearch{padding:12px 14px;margin-bottom:12px}
  .gsin{display:flex;gap:8px;align-items:center}
  .gsin .ic{font-size:18px}
  .gsin input{flex:1;padding:11px 12px;border:2px solid var(--blue);border-radius:10px;font:inherit;font-size:15px}
  .gchips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
  .gsec{margin-bottom:8px;border:1px solid var(--line);border-radius:10px;background:#fff;overflow:hidden}
  .gsh{display:flex;align-items:center;gap:10px;width:100%;padding:12px 14px;border:0;background:#f4f7fd;font:inherit;font-size:15px;font-weight:900;color:var(--blue);text-align:left;cursor:pointer}
  .gsh small{font-size:12px;font-weight:700;color:var(--sub)}
  .gsh em{margin-left:auto;font-style:normal;font-size:12px}
  .gbody{padding:4px 14px 10px}
  .gitem{padding:10px 0;border-top:1px solid var(--line)}
  .gitem b{display:block;font-size:14.5px;margin-bottom:3px}
  .gitem .gb{font-size:13.5px;line-height:1.7;white-space:normal}
  .gitem .gc{font-size:12.5px;color:var(--sub);margin-top:4px;line-height:1.6}
  .gitem .gurl{font-size:12.5px;word-break:break-all;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .gnote{margin:8px 0;padding:8px 12px;border-radius:8px;background:var(--warn-soft);font-size:13px;line-height:1.6;white-space:normal}
  .gnote.ok{background:var(--ok-soft);color:var(--ok);font-weight:700}
  .gnote.ng{background:var(--ng-soft);color:var(--ng);font-weight:700}
  .gnote.plain{background:#f4f6f9;color:var(--sub)}
  mark{background:#fff1a8;padding:0 2px;border-radius:3px}
  details.evbox > summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:10px;min-height:40px;padding:0 12px;border:1.5px dashed var(--line);border-radius:8px;font-size:13px;font-weight:700;color:var(--blue);background:#fafbfd}
  details.evbox > summary::-webkit-details-marker{display:none}
  details.evbox[open] > summary{border-style:solid;margin-bottom:4px}
  details.evbox .evn{background:var(--blue);color:#fff;border-radius:999px;padding:1px 9px;font-size:11.5px}
  details.evbox .evn0{color:var(--sub);font-weight:400;font-size:12px}

<script>

          .then(function(r){ return r.json(); })
          .then(function(j){ if(!j || !j.ok) throw new Error((j && j.error) || '読み込めませんでした'); return j.r; })
          .then(function(r){ setTimeout(function(){ if(sok) sok(r); }, 0); },
                function(e){ var m = String(e && e.message || e); if(/Failed to fetch|NetworkError|Load failed/i.test(m)) m = '通信できませんでした。電波の状態を確かめて、もう一度お試しください'; setTimeout(function(){ if(sng) sng(new Error(m)); }, 0); });
      };
    } });

  }

<script>
var PAGE_VERSION = '2026-11-12-1';   // 版の印（管理ページ「ページURL」の「更新の確認」で照らし合わせる）
var D = null, TAB = 'meetings';
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function toast(m){ var t=document.getElementById('toast'); t.textContent=m; t.classList.add('on'); setTimeout(function(){t.classList.remove('on')},1800); }
function yen(n){ return '¥' + (Number(n)||0).toLocaleString('ja-JP'); }
function fmtD(s){ if(!s) return ''; var m=String(s).match(/^(\d{4})-(\d{2})-(\d{2})/); if(!m) return s; var d=new Date(+m[1],+m[2]-1,+m[3]); return (+m[2])+'/'+(+m[3])+'('+'日月火水木金土'[d.getDay()]+')'; }

var TOKEN = '';
try { TOKEN = localStorage.getItem(('adm_token:' + location.pathname.replace(/[^\/]*$/, ''))) || ''; } catch(e){}
function api(){ return google.script.run; }
function start(){ document.getElementById('app').innerHTML = '<div style="max-width:420px;margin:120px auto;text-align:center;color:var(--sub)"><div style="font-size:15px;font-weight:700;color:var(--ink)">管理ページを読み込んでいます…</div><div style="font-size:12.5px;margin-top:8px">Googleのサーバーが起動するまで数秒かかります</div></div>'; api().withSuccessHandler(boot).withFailureHandler(function(e){ gate('エラー', e.message); }).adminBoot(TOKEN); }
start();
/* 起動後に裏で読む：ガイド・懇親会場候補・過去の値・会議の進行状況 */
var EXTRAS = false;
function loadExtras(cb){
  api().withSuccessHandler(function(x){ EXTRAS = true; D.guide = x.guide; D.kb = x.kb || []; D.venues = x.venues; D.venueList = x.venueList; D.presets = x.presets; if(TAB === 'guide') rerender('guide', viewGuide); if(cb) cb(); }).withFailureHandler(function(){}).adminExtras(TOKEN);
  refreshMeetings();
}

function gate(title, msg){
  document.getElementById('app').innerHTML = '<div class="gate"><h2>' + esc(title) + '</h2><p>' + esc(msg) + '</p></div>';
}
function loginView(step, email, err){
  var h = '<div class="gate" style="text-align:left"><div class="brand" style="margin-bottom:10px"><div class="l1">ATTENDANCE</div><div class="l2">ADMIN</div></div>' +
    '<h2 style="font-size:17px">管理ページにログイン</h2>' +
    '<p>名簿に登録されたメールアドレスに6桁のコードを送ります。</p>' +
    (err ? '<div class="err on" style="margin:0 0 10px">' + esc(err) + '</div>' : '') +
    '<div class="f"><label>メールアドレス</label><input id="lg_mail" type="email" value="' + esc(email||'') + '" placeholder="a@example.com"' + (step===2?' readonly':'') + '></div>';
  if(step === 2) h += '<div class="f" style="margin-top:10px"><label>メールに届いた6桁コード</label><input id="lg_code" inputmode="numeric" maxlength="6" placeholder="123456" style="font-size:22px;letter-spacing:.2em"></div>';
  h += '<div style="display:flex;gap:8px;margin-top:14px;justify-content:flex-end">' +
    (step===2 ? '<button class="btn" id="lg_back">戻る</button><button class="btn p" id="lg_verify">ログイン</button>' : '<button class="btn p" id="lg_send">コードを送信</button>') + '</div>' +
    '<p style="font-size:12px;margin-top:14px">届かない場合：迷惑メールを確認。登録アドレスと違う場合は管理者に連絡。ログインは30日間保持されます。</p></div>';
  document.getElementById('app').innerHTML = h;
  var send = document.getElementById('lg_send'); if(send) send.onclick = function(){
    var m = document.getElementById('lg_mail').value.trim(); if(!m) return;
    send.disabled = true; send.textContent = '送信中…';
    api().withSuccessHandler(function(){ loginView(2, m); }).withFailureHandler(function(e){ loginView(1, m, e.message); }).adminRequestCode(m);
  };
  var ver = document.getElementById('lg_verify'); if(ver) ver.onclick = function(){
    var m = document.getElementById('lg_mail').value.trim(), c = document.getElementById('lg_code').value.trim();
    ver.disabled = true; ver.textContent = '確認中…';
    api().withSuccessHandler(function(r){ TOKEN = r.token; try{ localStorage.setItem(('adm_token:' + location.pathname.replace(/[^\/]*$/, '')), TOKEN); }catch(e){} start(); })
      .withFailureHandler(function(e){ loginView(2, m, e.message); }).adminVerifyCode(m, c);
  };
  var back = document.getElementById('lg_back'); if(back) back.onclick = function(){ loginView(1, email); };
  var mi = document.getElementById('lg_mail'); if(mi && step===1){ mi.focus(); mi.onkeydown = function(e){ if(e.key==='Enter') send.click(); }; }
  var ci = document.getElementById('lg_code'); if(ci){ ci.focus(); ci.onkeydown = function(e){ if(e.key==='Enter') ver.click(); }; }
}
function logout(){ document.body.classList.remove('owlopen'); api().adminLogout(TOKEN); TOKEN=''; try{ localStorage.removeItem(('adm_token:' + location.pathname.replace(/[^\/]*$/, ''))); }catch(e){} ['owlBtn','owlTip','owlPanel'].forEach(function(id){ var e = document.getElementById(id); if(e) e.parentNode.removeChild(e); }); loginView(1); }
function boot(d){
  if(!d.ok){
    if(d.reason === 'login') return loginView(1);
    return gate('権限がありません', d.email + ' は管理者・スタッフ・閲覧者として登録されていません。管理者に連絡してください。');
  }
  D = d; D.guide = D.guide || []; D.venues = D.venues || []; D.venueList = D.venueList || []; D.presets = D.presets || {}; render();
  setTimeout(loadExtras, 50);
}

function render(){
  var s = D.settings, u = D.user;
  var h = '';
  if(D.isAdmin && D.ver !== PAGE_VERSION) h += '<div class="verBar">更新がそろっていません（このページ：' + esc(PAGE_VERSION) + '／動いているコード：' + esc(D.ver || '古い版') + '）。「ページURL」のいちばん下「更新の確認」で、どれが古いか確かめてください。</div>';
  h += '<header><div class="hd"><div class="brand"><div class="l1">' + esc(s['英字見出し'] || s['団体名（短）'] || 'ATTENDANCE').toUpperCase() + '</div><div class="l2">ADMIN</div></div>' +
       '<div class="org">' + esc(s['団体名'] || '') + ((s['年度'] && String(s['団体名']||'').indexOf(s['年度']) < 0) ? '　' + esc(s['年度']) : '') + '　出欠管理 管理ページ</div>' +
       '<div class="me">' + esc(u.name || u.email) + '<b class="' + (D.isAdmin ? '' : 'staff') + '">' + esc(u.master ? 'マスター' : u.role) + '</b> <button class="btn s" id="lgout" style="margin-left:8px">ログアウト</button></div></div>' +
       '<nav>' + navGroups().map(function(g){ return '<div class="grp ' + g.cls + '"><div class="gl">' + g.label + '</div><div class="gb">' + g.tabs.map(function(t){ return '<button data-t="' + t[0] + '" class="' + (TAB===t[0]?'on':'') + '">' + t[1] + '</button>'; }).join('') + '</div></div>'; }).join('') + '</nav>' +
       /* スマホ用：タブは1行のプルダウンに（画面の上半分をタブで使わない） */
       '<div class="navm"><button type="button" id="navBtn"><span class="ic">☰</span><span class="cur"><small>メニュー（いまのページ）</small><b>' + esc((navTabs().filter(function(t){ return t[0]===TAB; })[0]||['',''])[1]) + '</b></span><span class="sw">ほかのページへ ▾</span></button>' +
       '<div class="navsheet" id="navSheet"><div class="nsin"><div class="nsh"><b>ページを選ぶ</b><button type="button" id="navClose">閉じる</button></div><div class="muted" style="font-size:12px;margin-bottom:4px">使い方が分からないときは「ガイド」で検索（各画面の見出し横の「？」でも）</div>' + navGroups().map(function(g){ return '<div class="nsg ' + g.cls + '"><div class="gl">' + g.label + '</div>' + g.tabs.map(function(t){ return '<button type="button" data-nt="' + t[0] + '" class="' + (TAB===t[0]?'on':'') + '">' + t[1] + (TAB===t[0] ? '<small>表示中</small>' : '') + '</button>'; }).join('') + '</div>'; }).join('') + '</div></div></div></header>';
  h += '<div class="wrap">';
  h += '<div class="tab ' + (TAB==='meetings'?'on':'') + '" id="t-meetings">' + viewMeetings() + '</div>';
  if(D.pollTab) h += '<div class="tab ' + (TAB==='polls'?'on':'') + '" id="t-polls">' + viewPolls() + '</div>';
  if((D.isAdmin || D.isStaff) && D.projectTab) h += '<div class="tab ' + (TAB==='projects'?'on':'') + '" id="t-projects">' + viewProjects() + '</div>';
  h += '<div class="tab ' + (TAB==='members'?'on':'') + '" id="t-members">' + viewMembers() + '</div>';
  h += '<div class="tab ' + (TAB==='types'?'on':'') + '" id="t-types">' + viewTypes() + '</div>';
  h += '<div class="tab ' + (TAB==='links'?'on':'') + '" id="t-links">' + viewLinks() + '</div>';
  h += '<div class="tab ' + (TAB==='guide'?'on':'') + '" id="t-guide">' + viewGuide() + '</div>';
  h += '<div class="tab ' + (TAB==='notice'?'on':'') + '" id="t-notice">' + viewNotice() + '</div>';
  h += '<div class="tab ' + (TAB==='reception'?'on':'') + '" id="t-reception">' + viewReception() + '</div>';
  if(D.budgetTab) h += '<div class="tab ' + (TAB==='budget'?'on':'') + '" id="t-budget">' + viewBudget() + '</div>';
  if(D.isAdmin) h += '<div class="tab ' + (TAB==='settings'?'on':'') + '" id="t-settings">' + viewSettings() + '</div>';
  h += '<div class="tab ' + (TAB==='matrix'?'on':'') + '" id="t-matrix">' + viewMatrix() + '</div>';
  h += '<div class="tab ' + (TAB==='rollcall'?'on':'') + '" id="t-rollcall">' + viewRollCall() + '</div>';
  if(D.isAdmin || D.isStaff) h += '<div class="tab ' + (TAB==='minutes'?'on':'') + '" id="t-minutes">' + viewMinutes() + '</div>';
  if(D.isAdmin || D.isStaff) h += '<div class="tab ' + (TAB==='venues'?'on':'') + '" id="t-venues">' + viewVenues() + '</div>';
  if(D.isAdmin || D.isStaff) h += '<div class="tab ' + (TAB==='feedback'?'on':'') + '" id="t-feedback">' + viewFeedback() + '</div>';
  if(D.user && D.user.master) h += '<div class="tab ' + (TAB==='master'?'on':'') + '" id="t-master">' + viewMaster() + '</div>';
  h += '</div>';
  document.getElementById('app').innerHTML = h;
  Array.prototype.forEach.call(document.querySelectorAll('nav button'), function(b){ b.onclick = function(){ TAB = b.dataset.t; render(); if(TAB === 'meetings') refreshMeetings(); }; });
  var nb = document.getElementById('navBtn'), nsh = document.getElementById('navSheet');
  if(nb && nsh){
    nb.onclick = function(){ nsh.classList.add('on'); };
    document.getElementById('navClose').onclick = function(){ nsh.classList.remove('on'); };
    nsh.onclick = function(e){ if(e.target === nsh) nsh.classList.remove('on'); };
    Array.prototype.forEach.call(nsh.querySelectorAll('[data-nt]'), function(b){ b.onclick = function(){ TAB = b.dataset.nt; render(); if(TAB === 'meetings') refreshMeetings(); window.scrollTo(0, 0); }; });
  }

  if(TAB==='budget' && !BUD) loadBudget();
  if(TAB==='matrix' && !MAT) loadMatrix();
  if(TAB==='master' && !MST) loadMaster();
  if(TAB==='venues' && !VEN) loadVenues();
  if(TAB==='polls' && !POLLS) loadPolls();
  if(TAB==='projects' && !PRJ) loadProjects();
  if(TAB==='feedback' && !FB) loadFeedback();
}
/* タブは「使う頻度と目的」で4〜5グループに分け、左ほど毎回使うもの。並びは会議の流れ順（作る→案内→当日→集計） */
function navGroups(){
  var st = D.isAdmin || D.isStaff, ad = D.isAdmin;
  var g = [];
  var run = [['meetings','会議']];
  if(D.pollTab) run.push(['polls','日程調整']);
  if(st && D.projectTab) run.push(['projects','プロジェクト']);

  if(st) run.push(['reception','受付・集金']);   // スタッフも受付シートの作成・更新と当日受付ができる（確定・リセットは管理者だけ）
  run.push(['matrix','出席状況']);

  if(D.isMaster || (D.user && D.user.master)) g.push({ cls:'master', label:'マスター', tabs: [['master','★マスター']] });
  return g;
}
function navTabs(){ return navGroups().reduce(function(a, g){ return a.concat(g.tabs); }, []); }

/* ---------- 会議 ---------- */
// 保存直後は進行状況なしの一覧が返るので、前の進行状況を引き継いで表示し、裏で取り直す
function mergeProg(list){ var old = {}; (D.meetings || []).forEach(function(m){ old[m['会議ID']] = m._prog; }); (list || []).forEach(function(m){ if(m._prog === undefined && old[m['会議ID']]) m._prog = old[m['会議ID']]; }); return list; }
function refreshMeetings(){ api().withSuccessHandler(function(r){ if(r && r.meetings){ D.meetings = r.meetings; if(TAB === 'meetings') rerender('meetings', viewMeetings); } }).withFailureHandler(function(){}).adminMeetingsRefresh(TOKEN); }

function openMeeting(row, pre){
  if(!EXTRAS){ toast('候補データを読み込み中…'); return loadExtras(function(){ openMeeting(row, pre); }); }
  var m = row ? D.meetings.filter(function(x){ return x._row == row; })[0] : (pre || null);   // pre＝日程調整などからの初期値（新規）
  showModal(meetingForm(m));
  var cm = document.getElementById('f_キャンセル料mode'); if(cm) cm.onchange = function(){ document.getElementById('f_キャンセル料額').style.display = cm.value === '金額' ? '' : 'none'; document.getElementById('f_キャンセル期限').style.display = (cm.value && cm.value !== '未定' && cm.value !== '取らない') ? '' : 'none'; if(cm.value && cm.value !== '取らない' && document.getElementById('f_懇親会').value !== '有') toast('懇親会を「有」にしてください'); };
  // 資料：ファイルを選ぶ → 団体のドライブに置く → 「名前｜URL」を欄に足す（1つずつ順番に送る）
  var dp = document.getElementById('docPick'), df = document.getElementById('docFile');
  if(dp && df){
    dp.onclick = function(){ df.click(); };
    df.onchange = function(){
      var files = Array.prototype.slice.call(df.files || []), msg = document.getElementById('docMsg'), ta = document.getElementById('f_資料'); if(!files.length) return;
      var label = ((document.getElementById('f_開催日') || {}).value || '') + ' ' + ((document.getElementById('f_会議名') || {}).value || '');
      var done = 0, fail = [];
      var next = function(){
        var f = files.shift();
        if(!f){ dp.disabled = false; df.value = ''; msg.textContent = done + '件を追加しました' + (fail.length ? '（追加できなかったもの：' + fail.join('、') + '）' : '') + '。「保存」を押すと会議に付きます'; msg.style.color = fail.length ? 'var(--ng)' : 'var(--ok)'; return; }
        if(f.size > 15 * 1024 * 1024){ fail.push(f.name + '（15MBを超えています）'); return next(); }
        msg.style.color = ''; msg.textContent = '「' + f.name + '」をドライブに置いています…';
        var rd = new FileReader();
        rd.onload = function(){
          var b64 = String(rd.result).split(',')[1] || '';
          api().withSuccessHandler(function(r){ ta.value = (ta.value.replace(/\s+$/, '') ? ta.value.replace(/\s+$/, '') + '\n' : '') + r.name + '｜' + r.url; done++; next(); })
            .withFailureHandler(function(e){ fail.push(f.name + '（' + e.message + '）'); next(); }).adminUploadDoc(TOKEN, label.trim(), f.name, f.type, b64);
        };
        rd.onerror = function(){ fail.push(f.name); next(); };
        rd.readAsDataURL(f);
      };
      dp.disabled = true; next();
    };
  }
  var vp = document.getElementById('f_venuePick'); if(vp) vp.onclick = function(){
    var box = document.getElementById('venuePickBox'); var list = D.venueList || [];
    if(box.style.display !== 'none'){ box.style.display = 'none'; return; }
    box.innerHTML = list.length ? list.map(function(v){ return '<div data-vp="' + esc(v.name) + '" style="padding:8px 12px;border-bottom:1px solid var(--line);cursor:pointer;display:flex;gap:10px;align-items:center"><b style="flex:1 1 auto;min-width:0;word-break:keep-all;overflow-wrap:normal">' + esc(v.name) + '</b><span class="muted" style="font-size:12px;flex:0 1 auto;white-space:normal">' + esc([v.area, v.budget, v.capacity].filter(Boolean).join('・')) + '</span>' + (v.rating ? '<span style="color:#e0a100;font-size:12px">' + '★'.repeat(v.rating) + '</span>' : '') + '<span class="tag ' + (v.uses ? 'g' : 'b') + '" style="font-size:11px">' + (v.uses ? v.uses + '回・' + fmtD(v.last) : '候補') + '</span></div>'; }).join('') : '<div class="muted" style="padding:10px 12px;font-size:13px">候補がありません。「懇親会場」タブで追加してください</div>';
    box.style.display = 'block';
    Array.prototype.forEach.call(box.querySelectorAll('[data-vp]'), function(el){ el.onclick = function(){ document.getElementById('f_懇親会場').value = el.dataset.vp; box.style.display = 'none'; }; });
  };
  /* 店の詳細：店名に合う候補があれば今の内容を入れて開く。保存時に「懇親会場」タブへ上書き保存 */
  var vdKeys = ['publicUrl','area','address','tel','budget','capacity','memo'];
  var vdFill = function(){ var nm = document.getElementById('f_懇親会場').value.trim(); var v = (D.venueList || []).filter(function(x){ return x.name === nm; })[0]; vdKeys.forEach(function(k){ var el = document.getElementById('vd_' + k); if(el && !el.value) el.value = v ? (v[k] || '') : ''; }); };
  var vd = document.getElementById('f_venueDetail'); if(vd) vd.onclick = function(){ var box = document.getElementById('venueDetailBox'); if(box.style.display !== 'none'){ box.style.display = 'none'; return; } vdFill(); box.style.display = 'block'; if(!document.getElementById('f_懇親会場').value.trim()) toast('先に店名を入れてください'); };
  var vdInput = document.getElementById('f_懇親会場'); if(vdInput) vdInput.addEventListener('change', function(){ var box = document.getElementById('venueDetailBox'); if(box && box.style.display !== 'none'){ vdKeys.forEach(function(k){ var el = document.getElementById('vd_' + k); if(el) el.value = ''; }); vdFill(); } });
  /* 過去から選ぶ（場所・服装・URL） */
  var known = function(key, v){ return ((D.presets && D.presets[key]) || []).some(function(o){ return o.v === v; }); };
  var askBox = function(key){ var el = document.getElementById('f_' + key), ru = document.getElementById('ru_' + key); if(!el || !ru) return; var v = el.value.trim(); var orig = ((m && m[key]) || '').trim(); ru.style.display = (v && v !== orig && !known(key, v)) ? 'block' : 'none'; };
  Array.prototype.forEach.call(document.querySelectorAll('[data-pin]'), function(el){ el.oninput = function(){ askBox(el.dataset.pin); }; askBox(el.dataset.pin); });
  Array.prototype.forEach.call(document.querySelectorAll('[data-pick]'), function(b){ b.onclick = function(){
    var key = b.dataset.pick, box = document.getElementById('pb_' + key), list = (D.presets && D.presets[key]) || [];
    if(box.style.display !== 'none'){ box.style.display = 'none'; return; }
    box.innerHTML = list.length ? list.map(function(o){ return '<div data-pv="' + esc(o.v) + '" style="padding:7px 10px;border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:center"><span style="flex:1;cursor:pointer;word-break:break-all" data-pvs="' + esc(o.v) + '">' + esc(o.v) + '</span><span class="muted" style="font-size:11.5px;white-space:nowrap">' + (o.n ? o.n + '回' + (o.last ? '・' + fmtD(o.last) : '') : '登録済') + '</span><button type="button" class="btn s" data-prm="' + esc(o.v) + '" title="候補から外す" style="padding:2px 7px">×</button></div>'; }).join('') : '<div class="muted" style="padding:10px 12px;font-size:13px">まだありません</div>';
    box.style.display = 'block';
    Array.prototype.forEach.call(box.querySelectorAll('[data-pvs]'), function(el){ el.onclick = function(){ document.getElementById('f_' + key).value = el.dataset.pvs; askBox(key); box.style.display = 'none'; }; });
    Array.prototype.forEach.call(box.querySelectorAll('[data-prm]'), function(x){ x.onclick = function(ev){ ev.stopPropagation(); x.disabled = true; api().withSuccessHandler(function(pr){ D.presets = pr; box.style.display = 'none'; b.onclick(); toast('候補から外しました'); }).withFailureHandler(function(e){ x.disabled = false; toast('エラー：' + e.message); }).adminPresetRemove(TOKEN, key, x.dataset.prm); }; });
  }; });
  document.getElementById('mSave').onclick = function(){
    var keys = ['会議ID','会議種別','会議名','開催日','開始時刻','場所','プロジェクト','担当者','懇親会','懇親会場','会議費','懇親会費','その他費','その他費名目','カウント','回答締切','受付開始日','服装','オンラインURL','アジェンダURL','資料','議題','備考','運営メモ','集合時刻','集合の理由','集合の表記','行事','懇親会の名称','懇親会の時間','終了時刻','懇親会開始（実際）','ふりかえり'];
    var data = { _row: m ? m._row : 0, _memoOrig: m ? String(m['運営メモ'] || '') : '' };   // 開いたときの運営メモ（他の人がその間に足した分を消さないため）
    keys.forEach(function(k){ var el = document.getElementById('f_' + k); if(el) data[k] = el.value; });
    var cm = document.getElementById('f_キャンセル料mode');
    if(cm){ var cmode = cm.value; data['キャンセル料'] = cmode === '全額' ? '全額' : cmode === '未定' ? '未定' : cmode === '取らない' ? '取らない' : cmode === '金額' ? String(document.getElementById('f_キャンセル料額').value || '').trim() : '';

      if(cmode && cmode !== '取らない' && document.getElementById('f_懇親会').value !== '有') return showErr('キャンセル料は懇親会「有」のときだけ設定できます'); }

    // 店の詳細が入っていれば、会議の保存と一緒に「懇親会場」タブへも保存（同名なら上書き）

function linkify(t){ return esc(t).replace(/(https?:\/\/[^\s<]+)/g, function(u){ return '<a href="' + u + '" target="_blank" rel="noopener" style="word-break:break-all">' + u + '</a>'; }); }
// 項目の区切りは空行。1項目が複数行なら1行目を見出しにして「続きを見る」で開く
function memoLines(v){ return String(v || '').replace(/\r/g, '').split(/\n\s*\n/).map(function(x){ return x.trim(); }).filter(Boolean); }
function memoItem(t){
  var ls = t.split('\n').map(function(x){ return x.trim(); }).filter(Boolean); if(!ls.length) return '';
  var last = ls[ls.length - 1], stamp = (ls.length > 1 && /^（\d{1,2}\/\d{1,2} 追加）$/.test(last)) ? ls.pop() : '';
  var st = stamp ? ' <span class="muted" style="font-size:11.5px">' + esc(stamp) + '</span>' : '';
  if(ls.length === 1) return '<li>' + linkify(ls[0]) + st + '</li>';
  return '<li><details><summary style="cursor:pointer">' + linkify(ls[0]) + (stamp ? ' <span class="muted" style="font-size:11.5px">' + esc(stamp) + '</span>' : '') + ' <span class="muted" style="font-size:11.5px">▸ 続きを見る</span></summary><div style="margin:4px 0 6px;padding:6px 10px;background:#fff;border-radius:8px;font-size:12.5px;line-height:1.55;white-space:pre-wrap">' + ls.slice(1).map(linkify).join('\n') + '</div></details></li>';
}

/* ---------- 議題・まとめて取り込む ---------- */
// 議題の文字列（改行区切り）→ 配列。先頭の「・」「1.」「①」は外す
function agendaLines(v){ return String(v || '').split(/\r?\n/).map(function(x){ return x.replace(/^[\s　]*([・•\-－―*※]|[0-9０-９]+[.．)）、]|[①-⑳]|\([0-9０-９]+\)|（[0-9０-９]+）)?[\s　]*/, '').trim(); }).filter(Boolean); }

// Excelからコピーした表（タブ区切り）を会議の一覧にする。見出し行があれば列名で判断、無ければ「日付の列」「その右の文字の列＝会議名」「残り＝議題」と見なす
function parseBulkText(text){
  var pad = function(n){ return ('0' + n).slice(-2); };
  var z2h = function(x){ return String(x == null ? '' : x).replace(/[０-９]/g, function(c){ return String.fromCharCode(c.charCodeAt(0) - 0xFEE0); }).replace(/：/g, ':').replace(/／/g, '/').replace(/　/g, ' ').trim(); };
  var now = new Date(), floor = new Date(now.getFullYear(), now.getMonth() - 2, now.getDate());
  var parseDate = function(raw){
    var x = z2h(raw); if(!x) return null;
    var serial = x.match(/^(\d{5})(?:\.\d+)?$/);   // Excelの日付が数字（46317など）で貼られたとき
    if(serial){ var dd = new Date(Date.UTC(1899, 11, 30) + Number(serial[1]) * 86400000); return { date: dd.getUTCFullYear() + '-' + pad(dd.getUTCMonth() + 1) + '-' + pad(dd.getUTCDate()), time: '' }; }
    var m = x.match(/(?:(\d{4})\s*[\/\-年.]\s*)?(\d{1,2})\s*[\/\-月.]\s*(\d{1,2})\s*日?/);
    if(!m) return null;
    var y = m[1] ? Number(m[1]) : null, mo = Number(m[2]), d = Number(m[3]);
    if(mo < 1 || mo > 12 || d < 1 || d > 31) return null;
    if(y === null){ y = now.getFullYear(); if(new Date(y, mo - 1, d) < floor) y++; }
    var t = x.slice(m.index + m[0].length).match(/(\d{1,2})\s*(?::|時)\s*(\d{1,2})?\s*(半)?/), time = '';
    if(t){ var hh = Number(t[1]), mm = t[2] !== undefined ? Number(t[2]) : (t[3] ? 30 : 0); if(hh <= 24 && mm < 60 && !(hh === 0 && mm === 0)) time = pad(hh) + ':' + pad(mm); }
    return { date: y + '-' + pad(mo) + '-' + pad(d), time: time };
  };
  var parseTime = function(raw){ var x = z2h(raw); var t = x.match(/(\d{1,2})\s*(?::|時)\s*(\d{1,2})?\s*(半)?/); if(!t) return ''; var hh = Number(t[1]), mm = t[2] !== undefined ? Number(t[2]) : (t[3] ? 30 : 0); return (hh <= 24 && mm < 60) ? pad(hh) + ':' + pad(mm) : ''; };
  var lines = String(text || '').replace(/\r/g, '').split('\n').filter(function(l){ return l.trim(); });
  if(!lines.length) return { rows: [], note: '' };
  var sep = lines.some(function(l){ return l.indexOf('\t') >= 0; }) ? '\t' : (lines.every(function(l){ return l.split(',').length >= 2; }) ? ',' : null);
  var cells = lines.map(function(l){ return sep ? l.split(sep).map(function(c){ return c.trim(); }) : [l.trim()]; });
  var ncol = Math.max.apply(null, cells.map(function(r){ return r.length; }));
  // 見出し行
  var H = { date: /日付|開催日|日程|^日$|日時/, name: /会議名|タイトル|名称|件名|^予定$|議題名|会議/, time: /時刻|時間|開始/, place: /場所|会場/, topics: /議題|内容|議事|テーマ/, note: /備考|メモ|注意/, people: /関わる人|関係者|担当/, project: /プロジェクト|小委員会|事業/ };
  var head = cells[0], isHead = head.every(function(c){ return !parseDate(c); }) && head.some(function(c){ return H.date.test(c) || H.name.test(c) || H.topics.test(c); });
  var col = { date: -1, name: -1, time: -1, place: -1, topics: [], note: -1, people: -1, project: -1 };
  var body = cells;
  if(isHead){
    body = cells.slice(1);
    head.forEach(function(c, i){
      if(col.date < 0 && H.date.test(c) && !/時/.test(c.replace(/日時/, ''))) col.date = i;
      else if(col.time < 0 && H.time.test(c)) col.time = i;
      else if(H.topics.test(c)) col.topics.push(i);
      else if(col.name < 0 && H.name.test(c)) col.name = i;
      else if(col.place < 0 && H.place.test(c)) col.place = i;
      else if(col.note < 0 && H.note.test(c)) col.note = i;
      else if(col.people < 0 && H.people.test(c)) col.people = i;
      else if(col.project < 0 && H.project.test(c)) col.project = i;
    });
  }
  if(col.date < 0){   // 見出しが無い／日付の列名が無い：日付が一番多く入っている列
    var best = -1, bestN = 0;
    for(var i = 0; i < ncol; i++){ var n = body.filter(function(r){ return parseDate(r[i]); }).length; if(n > bestN){ best = i; bestN = n; } }
    col.date = best;
  }
  if(col.date < 0) return { rows: [], note: '日付の列が見つかりません。Excelで「日付」と「会議名」の列を含めて範囲を選び、コピーして貼ってください' };
  if(!isHead || col.name < 0){   // 会議名：日付の右で、文字が一番よく入っている列（日付・時刻・議題に使った列は除く）
    var cand = [];
    for(var j = 0; j < ncol; j++){ if(j === col.date || j === col.time || col.topics.indexOf(j) >= 0) continue; var n2 = body.filter(function(r){ var v = r[j]; return v && !parseDate(v) && !/^\d+$/.test(v); }).length; if(n2) cand.push({ i: j, n: n2 }); }
    cand.sort(function(a, b){ return (b.n - a.n) || (a.i - b.i); });
    if(cand.length){ col.name = cand[0].i; if(!isHead) col.topics = cand.slice(1).map(function(c){ return c.i; }).sort(function(a, b){ return a - b; }); }
  }
  var rows = [];
  body.forEach(function(r, idx){
    var dt = parseDate(r[col.date]); if(!dt) return;
    var name = col.name >= 0 ? z2h(r[col.name]) : '';
    if(!name) return;
    var topics = []; col.topics.forEach(function(i){ agendaLines(r[i]).forEach(function(t){ topics.push(t); }); });
    var note = col.note >= 0 ? String(r[col.note] || '').trim() : '';
    var people = col.people >= 0 ? String(r[col.people] || '').trim() : '';
    if(people) note = (note ? note + '\n' : '') + '関わる人：' + people;
    var time = col.time >= 0 ? parseTime(r[col.time]) : dt.time;
    rows.push({ line: idx + (isHead ? 2 : 1), date: dt.date, time: time, name: name, topics: topics, note: note, place: col.place >= 0 ? String(r[col.place] || '').trim() : '', project: col.project >= 0 ? String(r[col.project] || '').trim() : '' });
  });
  rows.sort(function(a, b){ return a.date.localeCompare(b.date) || a.time.localeCompare(b.time); });
  var found = [];
  if(isHead){ found.push('見出し行あり'); } else { found.push('見出し行なし（' + (col.date + 1) + '列目＝日付、' + (col.name + 1) + '列目＝会議名' + (col.topics.length ? '、残り＝議題' : '') + ' と見なしました）'); }
  return { rows: rows, note: found.join('。'), skippedLines: body.length - rows.length };
}

function openBulkMeetings(){

        '<td style="white-space:nowrap">' + esc(fmtD(r.date)) + '<div class="muted" style="font-size:11px">' + r.date.slice(0, 4) + '</div></td>' +
        '<td>' + esc(r.time || '') + '</td>' +
        '<td><input class="bk_name" data-i="' + i + '" value="' + esc(r.name) + '" style="width:100%;min-width:140px">' + (dup ? '<div style="font-size:11px;color:var(--warn);font-weight:700">同じ日・同じ名前が登録済み（取り込まない）</div>' : '') + '</td>' +

    Array.prototype.forEach.call(box.querySelectorAll('.bk_chk'), function(c){ c.onchange = upd; });
    Array.prototype.forEach.call(box.querySelectorAll('.bk_name'), function(inp){ inp.oninput = function(){ PARSED[+inp.dataset.i].name = inp.value; }; });

  document.getElementById('bk_parse').onclick = function(){
    var res = parseBulkText(document.getElementById('bk_text').value);
    PARSED = res.rows;
    var info = document.getElementById('bk_info');

    if(sel.some(function(r){ return !String(r.name || '').trim(); })) return showErr('会議名が空の行があります');
    var rows = sel.map(function(r, i){
      var open = '';
      if(chain && i > 0){ var pd = new Date(sel[i - 1].date + 'T00:00:00'); pd.setDate(pd.getDate() + 1); open = pd.getFullYear() + '-' + ('0' + (pd.getMonth() + 1)).slice(-2) + '-' + ('0' + pd.getDate()).slice(-2); if(open >= r.date) open = ''; }
      return { type: type, name: String(r.name).trim(), date: r.date, time: r.time, place: r.place, topics: D.agendaOn ? r.topics.join('\n') : '', note: r.note, party: party, project: project, open: open };
    });
    confirmBox(rows.length + '件の会議を追加しますか？', '会議種別「' + type + '」' + (party ? '・懇親会 有' : '') + (project ? '・プロジェクト名「' + project + '」' : '') + (chain ? '・受付開始日を順番に設定' : '') + '。会議IDは自動（例：M' + rows[0].date.slice(2).replace(/-/g, '') + '）。場所・時刻・会費は後から各会議の「編集」で入れられます。', function(){
      busy(true);
      api().withSuccessHandler(function(r){
        busy(false); D.meetings = mergeProg(r.meetings); if(r.noProgress) refreshMeetings();
        var msg = r.added.length + '件を追加しました' + (r.skipped.length ? '（登録済みのため' + r.skipped.length + '件は飛ばしました）' : '');
        if(r.errors && r.errors.length){ render(); showErr(msg + '。取り込めなかった行：' + r.errors.join('／')); return; }
        closeModal(true); render(); toast(msg);
      }).withFailureHandler(function(e){ busy(false); showErr(e.message); }).adminBulkMeetings(TOKEN, rows);
    });
  };
}

/* ---------- 名簿 ---------- */
function viewMembers(){

  var typeCols = D.types.map(function(t){ return t.name; });
  var h = '<div class="bar"><h2>名簿（' + D.members.length + '）</h2><input type="search" id="mq" placeholder="氏名・LOM・役職で探す" value="' + esc(q) + '">' + ((D.isAdmin || D.isStaff) ? '<button class="btn p" id="addP">＋ 人を追加</button>' : '<span class="muted">閲覧のみ</span>') + '</div>';
  if(D.isAdmin) h += '<div class="card" style="padding:10px 16px;margin-bottom:10px;font-size:12.5px;color:var(--sub);border-left:4px solid var(--warn)"><b style="color:var(--ink)">権限を付けるとき</b>：メール欄に、その人が受け取れるアドレスを入れてから権限を選ぶ（メールが空だと保存できない）。ログイン時にこのアドレスへ6桁コードが届く。複数アドレスはカンマ区切り。入れない人は「登録されていません」と出るので綴りを確認。</div>';
  // お試し会員の期限チェック
  var today = new Date(); today.setHours(0,0,0,0);
  var trialInfo = function(p){
    if(String(p['会員区分']||'').trim() !== 'お試し') return null;
    if(!p._trialEnd) return { cls:'y', txt:'お試し（期限未設定）', days:null };
    var e = new Date(p._trialEnd + 'T00:00:00'); var days = Math.round((e - today)/86400000);
    if(days < 0) return { cls:'r', txt:'お試し 期限切れ（' + fmtD(p._trialEnd) + '）', days:days };
    if(days <= 14) return { cls:'y', txt:'お試し あと' + days + '日（' + fmtD(p._trialEnd) + 'まで）', days:days };
    return { cls:'b', txt:'お試し（' + fmtD(p._trialEnd) + 'まで）', days:days };
  };
  var alerts = D.members.map(function(p){ var t = trialInfo(p); return t && t.cls !== 'b' ? esc(p['氏名']) + '：' + esc(t.txt) : ''; }).filter(Boolean);
  if(alerts.length) h += '<div class="card" style="padding:10px 16px;margin-bottom:10px;font-size:12.5px;border-left:4px solid var(--ng)"><b style="color:var(--ng)">お試し会員の期限</b>　' + alerts.join('　／　') + '　<span class="muted">→ 正会員になったら「会員区分：正会員」＋「入会日」を入れる</span></div>';
  h += '<div class="card tbl"><table><thead><tr><th>順</th><th>氏名</th><th>権限</th><th></th><th>区分</th><th>所属</th><th>役職</th><th>対象</th><th>会員</th><th>議決</th><th>メール</th></tr></thead><tbody>';
  if(!ps.length) h += '<tr><td colspan="11" class="empty">該当なし</td></tr>';
  ps.forEach(function(p){
    var on = typeCols.filter(function(c){ return String(p[c]||'').trim(); });
    var excluded = !on.length;
    var mail = String(p['メール']||'').split(/[,、;\s]+/).filter(Boolean);
    var ti = trialInfo(p);
    var memberCell = ti ? '<span class="tag ' + ti.cls + '">' + esc(ti.txt) + '</span>' : (p['会員区分'] ? esc(p['会員区分']) + (p['入会日'] ? '<div class="muted" style="font-size:11px">入会 ' + esc(fmtD(p['入会日'])) + '</div>' : '') : '<span class="muted">—</span>');
    h += '<tr class="' + (excluded?'ro':'') + '"><td class="muted">' + esc(p['表示順']) + '</td>' +
      '<td class="name">' + esc(p['氏名']) + (excluded ? ' <span class="tag r">対象外</span>' : '') + '<div class="muted" style="font-size:11.5px;font-weight:400">' + esc(p['ふりがな']) + '</div></td>' +
      '<td>' + (p['権限'] ? '<span class="tag ' + (p['権限']==='管理者'?'b':p['権限']==='スタッフ'?'g':'y') + '">' + esc(p['権限']) + '</span>' : '<span class="muted">—</span>') + '</td>' +
      '<td>' + ((D.isAdmin || D.isStaff) ? '<button class="btn s" data-edit-p="' + p._row + '">編集</button>' : '') + '</td>' +
      '<td>' + esc(p['区分']) + '</td><td>' + esc(p['所属LOM']) + '</td><td>' + esc(p['役職']) + '</td>' +
      '<td style="white-space:normal;font-size:12px">' + (on.length === typeCols.length ? '全部' : on.map(esc).join('・') || '<span class="muted">—</span>') + '</td>' +
      '<td style="white-space:normal;font-size:12px">' + memberCell + '</td>' +
      '<td style="text-align:center">' + (String(p['議決権']||'').trim() ? '○' : '') + '</td>' +
      '<td class="muted" style="font-size:11.5px;white-space:normal;max-width:220px">' + (mail.length ? esc(mail[0]) + (mail.length > 1 ? ' <span class="tag b">+' + (mail.length-1) + '</span>' : '') : (p._hasMail ? '<span class="tag b" title="管理者だけに表示">登録済</span>' : '')) + '</td></tr>';
  });
  return h + '</tbody></table></div>';
}

function openMember(row){
  var p = row ? D.members.filter(function(x){ return x._row == row; })[0] : null;
  showModal(memberForm(p));
  document.getElementById('mSave').onclick = function(){
    var data = { _row: p ? p._row : 0 };
    ['氏名','ふりがな','区分','所属LOM','役職','読み上げ役職','メール','表示順','議決権','権限','備考','会員区分','入会日','お試し開始日','お試し終了日'].forEach(function(k){ var el = document.getElementById('p_' + k); if(el) data[k] = el.value; });
    Array.prototype.forEach.call(document.querySelectorAll('[data-type]'), function(c){ data[c.dataset.type] = c.checked ? '○' : ''; });
    if(p) Object.keys(p).forEach(function(k){ if(!(k in data) && k.charAt(0) !== '_') data[k] = p[k]; });
    busy(true);
    google.script.run.withSuccessHandler(function(r){ busy(false); D.members = r.members; closeModal(true); render(); toast('保存しました'); })
      .withFailureHandler(function(e){ busy(false); showErr(e.message); }).adminSaveMember(TOKEN, data);
  };
  if(p){
    document.getElementById('pExclude').onclick = function(){
      confirmBox(p['氏名'] + ' を対象から外しますか？', '全ての会議の○を消します。行と過去の記録は残ります。元に戻すには編集で○を付け直してください。', function(){
        busy(true);
        google.script.run.withSuccessHandler(function(r){ busy(false); D.members = r.members; closeModal(true); render(); toast('対象から外しました'); }).withFailureHandler(function(e){ busy(false); showErr(e.message); }).adminExcludeMember(TOKEN, p._row);
      });
    };
    if(document.getElementById('pDelete')) document.getElementById('pDelete').onclick = function(){
      confirmBox(p['氏名'] + ' を完全に削除しますか？', '名簿から行を消します。過去の回答や受付シートの記録は残りますが、出席状況の一覧からは消えます。通常は「対象から外す」を使ってください。', function(){
        busy(true);
        google.script.run.withSuccessHandler(function(r){ busy(false); D.members = r.members; closeModal(true); render(); toast('削除しました'); }).withFailureHandler(function(e){ busy(false); showErr(e.message); }).adminDeleteMember(TOKEN, p._row);
      }, true);
    };
  }
}

var GUIDE_Q = '', GUIDE_OPEN = {};
/* ガイド：検索して探す形。やりたいことを入れると、該当する項目だけ出る。見出しは折りたたみ */
var GUIDE_CHIPS = [['案内を送る','案内'],['催促したい','催促'],['印刷したい','印刷'],['日程を決める','日程調整'],['司会の台本','シナリオ'],['名簿に人を足す','名簿に人'],['懇親会場','懇親会場'],['お金・集金','集金'],['出席率','出席率'],['委員会で使う','委員会で使う'],['スマホで','スマホ'],['エラーが出た','エラー'],['ログインできない','ログイン'],['URLを知りたい','URL']];
function viewGuide(){
  var g = D.guide || [];
  var who = D.user.master ? 'マスター' : D.user.role;
  var h = '<div class="bar"><h2>運用ガイド</h2><span class="muted">' + esc(who) + ' 向けの内容だけ表示</span></div>';
  h += '<div class="card gsearch"><div class="gsin"><span class="ic">🔍</span><input type="search" id="gq" value="' + esc(GUIDE_Q) + '" placeholder="やりたいこと・困っていることを入れる（例：印刷、催促、委員会）"><button type="button" class="btn s" id="gqClear"' + (GUIDE_Q ? '' : ' style="display:none"') + '>消す</button></div>' +
       '<div class="gchips">' + GUIDE_CHIPS.map(function(c){ return '<button type="button" class="chip' + (GUIDE_Q === c[1] ? ' on' : '') + '" data-gq="' + esc(c[1]) + '">' + esc(c[0]) + '</button>'; }).join('') + '</div>' +
       '<div class="muted" style="font-size:12px;margin-top:6px">見つからなければ「要望・不具合」タブに書いてください（マスターが返します）。各画面の見出し横の「？」を押すと、その画面の説明に絞って出ます</div></div>';
  if(!g.length) return h + '<div class="card"><div class="empty">' + (EXTRAS ? '表示できる項目がありません' : '読み込み中…') + '</div></div>';
  var terms = GUIDE_Q.trim().toLowerCase().split(/[\s　]+/).filter(Boolean);
  var hit = function(r){ if(!terms.length) return true; var t = ((r.a||'') + ' ' + (r.b||'') + ' ' + (r.c||'')).toLowerCase(); return terms.every(function(x){ return t.indexOf(x) >= 0; }); };
  var mark = function(t){ t = esc(t); if(!terms.length) return t; terms.forEach(function(x){ var re = new RegExp(x.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi'); t = t.replace(re, function(m){ return '<mark>' + m + '</mark>'; }); }); return t; };
  var link = function(u){ return /^https?:/.test(u) ? '<a href="' + esc(u) + '" target="_blank" rel="noopener" style="word-break:break-all">' + esc(u) + '</a>' : mark(u); };
  // 見出しごとにまとめる
  var secs = [], cur = null;
  g.forEach(function(r){ if(r.k === 'H'){ cur = { title: r.a, rows: [] }; secs.push(cur); return; } if(cur) cur.rows.push(r); });
  var total = 0;
  secs.forEach(function(sec, si){
    var rows = sec.rows.filter(function(r){ return terms.length ? (r.k === 'S' || r.k === 'T' || r.k === 'U' || r.k === 'N') && hit(r) : true; });
    var n = rows.filter(function(r){ return r.k === 'S' || r.k === 'T' || r.k === 'U'; }).length;
    if(terms.length && !rows.length) return;
    if(!terms.length && !n && !rows.some(function(r){ return r.k === 'N' || r.k === 'G' || r.k === 'R'; })) return;   // 表紙など中身のない見出しは出さない
    total += n;
    var isOpen = terms.length ? true : !!GUIDE_OPEN[si];
    h += '<div class="gsec"><button type="button" class="gsh" data-gs="' + si + '"><span>' + esc(sec.title) + '</span><small>' + n + '件</small><em>' + (isOpen ? '▲' : '▼') + '</em></button>';
    if(isOpen){
      h += '<div class="gbody">';
      rows.forEach(function(r){
        if(r.k === 'G') h += '<div class="gnote ok">' + esc(r.a) + '</div>';
        else if(r.k === 'R') h += '<div class="gnote ng">' + esc(r.a) + '</div>';
        else if(r.k === 'N') h += '<div class="gnote">' + mark(r.b || r.a) + '</div>';
        else if(r.k === 'U') h += '<div class="gitem"><b>' + mark(r.a) + '</b><div class="gurl">' + link(r.b) + ' <button type="button" class="btn s" data-copy="' + esc(r.b) + '">コピー</button></div>' + (r.c ? '<div class="gc">' + mark(r.c) + '</div>' : '') + '</div>';
        else if(r.k === 'S' || r.k === 'T') h += '<div class="gitem"><b>' + mark(r.a) + '</b><div class="gb">' + mark(r.b) + '</div>' + (r.c ? '<div class="gc">' + mark(r.c) + '</div>' : '') + '</div>';
        else if(r.b || r.a) h += '<div class="gnote plain">' + mark(r.b || r.a) + '</div>';
      });
      h += '</div>';
    }
    h += '</div>';
  });
  if(terms.length && !total) h += '<div class="card"><div class="empty">「' + esc(GUIDE_Q) + '」に当たる項目がありません。別の言葉で（例：印刷／催促／名簿）、または「要望・不具合」タブへ</div></div>';
  return h;
}

var NOTICE_ID = '';
function upcoming(){ var t = new Date(); t.setHours(0,0,0,0); return D.meetings.filter(function(m){ return m['開催日'] && new Date(m['開催日']) >= t; }).sort(function(a,b){ return (a['開催日']||'').localeCompare(b['開催日']||''); }); }
function meetingSelect(id, sel){ var ms = D.meetings.slice().sort(function(a,b){ return (b['開催日']||'').localeCompare(a['開催日']||''); }); return '<select id="' + id + '" style="padding:8px 12px;border:1.5px solid var(--line);border-radius:8px;font-weight:700;min-width:260px">' + ms.map(function(m){ return '<option value="' + esc(m['会議ID']) + '"' + (m['会議ID']===sel?' selected':'') + '>' + esc(m['会議名']) + '　' + esc(fmtD(m['開催日'])) + '</option>'; }).join('') + '</select>'; }
function viewNotice(){
  var up = upcoming(); if(!NOTICE_ID) NOTICE_ID = up.length ? up[0]['会議ID'] : (D.meetings[0] ? D.meetings[0]['会議ID'] : '');
  var h = '<div class="bar"><h2>案内・メール</h2>' + meetingSelect('nSel', NOTICE_ID) + '</div>';
  h += '<div class="cols">' +
    '<div class="card" style="padding:16px 18px"><h3 style="margin:0 0 8px">案内文（LINE用）</h3><p class="muted" style="margin:0 0 8px;font-size:13px">コピーして LINE に貼る。回答ページのURL入り</p><div class="chk" style="margin-bottom:10px"><label><input type="checkbox" id="nOptAgenda" checked> アジェンダURL</label><label title="回答ページに、この会議だけを出す（ほかの会議は並べない）。対象の人がちがう会議を、別々に案内するときに"><input type="checkbox" id="nOptOnly"> この会議だけの回答ページ</label><label><input type="checkbox" id="nOptOnline" checked> オンライン参加URL</label><label><input type="checkbox" id="nOptCal" checked> カレンダー登録リンク</label></div><button class="btn p" id="nGen">案内文をつくる</button><textarea id="nText" style="width:100%;min-height:260px;margin-top:10px;padding:10px;border:1.5px solid var(--line);border-radius:8px;font-size:13px;line-height:1.6" placeholder="ここに表示されます"></textarea><div style="margin-top:8px;text-align:right"><button class="btn" id="nCopy">コピー</button></div>' +
    '<hr style="border:0;border-top:1px dashed var(--line);margin:16px 0 12px"><h3 style="margin:0 0 6px">出欠状況の共有文（会議の2〜3日前に）</h3><p class="muted" style="margin:0 0 8px;font-size:13px">出席・欠席・未回答の人数と未回答の人、懇親会の人数連絡の期限が入る。コピーして LINE に貼る</p><button class="btn" id="nShare">出欠状況の共有文をつくる</button><textarea id="nShareText" style="width:100%;min-height:200px;margin-top:10px;padding:10px;border:1.5px solid var(--line);border-radius:8px;font-size:13px;line-height:1.6;display:none"></textarea><div style="margin-top:8px;text-align:right"><button class="btn" id="nShareCopy" style="display:none">コピー</button></div></div>' +
    '<div class="card" style="padding:16px 18px"><h3 style="margin:0 0 8px">メールで送る</h3><p class="muted" style="margin:0 0 10px;font-size:13px">宛先を選び、件名・本文を直してから送信。差出人は団体のGmail。送信履歴が残る</p><button class="btn p" id="nMail">メール送信画面を開く</button><div id="nMailBox" style="margin-top:12px"></div></div>' +
    '</div>';
  return h;
}
function bindNotice(){
  var sel = document.getElementById('nSel'); if(sel) sel.onchange = function(){ NOTICE_ID = sel.value; document.getElementById('nText').value=''; document.getElementById('nMailBox').innerHTML=''; var st = document.getElementById('nShareText'); if(st){ st.value=''; st.style.display='none'; document.getElementById('nShareCopy').style.display='none'; } };
  var g = document.getElementById('nGen'); if(g) g.onclick = function(){ g.disabled=true; api().withSuccessHandler(function(r){ g.disabled=false; document.getElementById('nText').value = r.text; }).withFailureHandler(function(e){ g.disabled=false; toast('エラー：'+e.message); }).adminNotice(TOKEN, NOTICE_ID, { agenda: document.getElementById('nOptAgenda').checked, online: document.getElementById('nOptOnline').checked, calendar: document.getElementById('nOptCal').checked, only: !!(document.getElementById('nOptOnly') || {}).checked }); };
  var c = document.getElementById('nCopy'); if(c) c.onclick = function(){ var t = document.getElementById('nText'); t.select(); if(navigator.clipboard) navigator.clipboard.writeText(t.value).then(function(){ toast('コピーしました'); }); };
  var sg = document.getElementById('nShare'); if(sg) sg.onclick = function(){ sg.disabled=true; api().withSuccessHandler(function(r){ sg.disabled=false; var t = document.getElementById('nShareText'); t.style.display=''; t.value = r.text; document.getElementById('nShareCopy').style.display=''; }).withFailureHandler(function(e){ sg.disabled=false; toast('エラー：'+e.message); }).adminShareText(TOKEN, NOTICE_ID); };
  var sc = document.getElementById('nShareCopy'); if(sc) sc.onclick = function(){ var t = document.getElementById('nShareText'); t.select(); if(navigator.clipboard) navigator.clipboard.writeText(t.value).then(function(){ toast('コピーしました'); }); };
  var m = document.getElementById('nMail'); if(m) m.onclick = function(){ m.disabled=true; api().withSuccessHandler(function(d){ m.disabled=false; mailBox(d); }).withFailureHandler(function(e){ m.disabled=false; toast('エラー：'+e.message); }).adminMailData(TOKEN, NOTICE_ID); };
}
function mailBox(d){
  var ppl = d.people || d.targets || [];
  var h = '<div class="f"><label>件名</label><input id="mSub" value="' + esc(d.subject||'') + '"></div>' +
    '<div class="f" style="margin-top:8px"><label>本文（{宛名} は各人の宛名に置き換わる）</label><textarea id="mBody" style="min-height:220px;font-size:13px">' + esc(d.body||'') + '</textarea></div>' +
    '<div style="margin:10px 0 6px;display:flex;gap:6px;flex-wrap:wrap"><button class="btn s" data-q="all">全員</button><button class="btn s" data-q="none">解除</button><button class="btn s" data-q="unsent">未送信</button><button class="btn s" data-q="noreply">未回答</button></div>' +
    '<div style="max-height:260px;overflow:auto;border:1px solid var(--line);border-radius:8px">' + ppl.map(function(p,i){ return '<label style="display:flex;gap:8px;align-items:center;padding:6px 10px;border-bottom:1px solid var(--line);font-size:13px"><input type="checkbox" class="mTo" data-i="' + i + '"' + (p.email?'':' disabled') + '> <b>' + esc(p.name) + '</b> <span class="muted">' + esc(p.email||'（メールなし）') + '</span>' + (p.lastSent ? '<span class="tag g" style="margin-left:auto">送信済 ' + esc(p.lastSent) + '</span>' : (p.attend ? '<span class="tag b" style="margin-left:auto">' + esc(p.attend) + '</span>' : '<span class="tag y" style="margin-left:auto">未回答</span>')) + '</label>'; }).join('') + '</div>' +
    '<div style="margin-top:10px;text-align:right"><button class="btn p" id="mSend">選択した人に送信</button></div>';
  var box = document.getElementById('nMailBox'); box.innerHTML = h;
  Array.prototype.forEach.call(box.querySelectorAll('[data-q]'), function(b){ b.onclick = function(){ var q = b.dataset.q; Array.prototype.forEach.call(box.querySelectorAll('.mTo'), function(c){ var p = ppl[c.dataset.i]; if(c.disabled) return; c.checked = q==='all' ? true : q==='none' ? false : q==='unsent' ? !p.lastSent : !p.attend; }); }; });
  document.getElementById('mSend').onclick = function(){
    var to = Array.prototype.filter.call(box.querySelectorAll('.mTo'), function(c){ return c.checked; }).map(function(c){ return ppl[c.dataset.i]; });
    if(!to.length) return toast('宛先を選んでください');
    confirmBox(to.length + ' 名にメールを送信しますか？', '件名：' + document.getElementById('mSub').value, function(){
      busy(true);
      api().withSuccessHandler(function(r){ busy(false); closeModal(true); toast((r && r.sent != null ? r.sent : to.length) + ' 件送信しました'); document.getElementById('nMail').click(); })
        .withFailureHandler(function(e){ busy(false); showErr(e.message); })
        .adminMailSend(TOKEN, { meetingId: NOTICE_ID, subject: document.getElementById('mSub').value, body: document.getElementById('mBody').value, to: to });
    });
  };
}

/* ---------- 受付・集金 ---------- */
var REC = null;
function loadReception(){ api().withSuccessHandler(function(l){ REC = l; rerender('reception', viewReception); }).withFailureHandler(function(e){ toast('エラー：'+e.message); }).adminReceptionList(TOKEN); }
/** 当日受付ページのURL：設定の「受付ページURL（外部）」→ このページが GitHub に置いてあれば同じ場所の reception.html → Apps Script のURL */
function recPageUrl(){
  var u = D.receptionPage || D.webappUrl;
  if((!D.receptionPage || D.receptionPage === D.webappUrl) && /github\.io$/.test(location.hostname)) u = location.href.replace(/[?#].*$/, '').replace(/[^\/]*$/, '') + 'reception.html';
  return u;
}
/** 確定前の会議で、受付したのにまだ受け取っていないお金（ある会議だけ出す） */
function unpaidBox(r){
  var L = r.unpaidList || []; if(!L.length) return '';
  var tot = 0; L.forEach(function(p){ p.it.forEach(function(x){ tot += x.v; }); });
  return '<tr class="lv-row"><td colspan="8"><div class="up-b"><div class="up-h">⚠ 未収があります：' + L.length + '名・' + yen(tot) + '</div><div class="lv-cs">' +
    L.map(function(p){ return '<span class="lv-c ng">' + esc(p.n) + '<small>' + esc((p.l ? p.l + '　' : '') + p.it.map(function(x){ return x.k + ' ' + yen(x.v); }).join('・')) + '</small></span>'; }).join('') +
    '</div><div class="muted" style="font-size:11.5px;margin-top:6px">受付をした人のうち、受け取りのチェックがないもの。受け取ったら当日受付ページでチェックを付けてください</div></div></td></tr>';
}
function viewReception(){
  var h = '<div class="bar"><h2>受付・集金</h2><span style="flex:1"></span><button type="button" class="btn s" id="recRefresh">最新にする</button> <a class="btn p" href="' + esc(recPageUrl()) + '" target="_blank" rel="noopener" style="text-decoration:none">当日受付ページを開く</a></div>';
  if(!REC) return h + '<div class="card"><div class="empty">読み込み中…</div></div>';
  h += '<div class="card tbl"><table><thead><tr><th>会議</th><th>開催日</th><th>受付シート</th><th>出席</th><th>集金</th><th>未収</th><th>領収書</th><th></th></tr></thead><tbody>';
  var t0 = new Date(); t0.setHours(0,0,0,0);
  REC.slice().sort(function(a,b){ return (b.date||'').localeCompare(a.date||''); }).forEach(function(r){
    var st = r.stats, past = r.date && new Date(r.date) < t0;   // 終わった会議：作り直し（更新・リセット）は出さず、確定を促す
    h += '<tr><td class="name">' + esc(r.label) + '<div class="muted" style="font-size:11.5px;font-weight:400">' + esc(r.id) + '</div></td><td>' + esc(fmtD(r.date)) + '</td>' +
      '<td>' + (r.locked ? '<span class="tag y">確定済</span>' : r.has ? '<span class="tag g">作成済</span>' : '<span class="tag r">未作成</span><div class="muted" style="font-size:11.5px;font-weight:400">会議の前日までに「受付シートを作成」を押す</div>') + '</td>' +
      '<td>' + (st ? st.checkedIn + ' / ' + st.expected : '—') + '</td>' +
      '<td>' + (st ? yen(st.cash) + ' <span class="muted">/ ' + yen(st.cashExp) + '</span>' : '—') + '</td>' +
      '<td>' + (st && st.unpaid ? '<span class="tag r">' + st.unpaid + '名</span>' : (st ? '0' : '—')) + '</td>' +
      '<td class="muted">' + (st ? (st.receipts || 0) + ' / ' + st.checkedIn : '—') + '</td>' +
      '<td style="white-space:nowrap">' +
        (r.locked ? (D.isAdmin ? '<button class="btn s" data-unlock="' + esc(r.id) + '">確定を解除</button>' : '<span class="muted" style="font-size:12px">確定済（解除は管理者）</span>') :
          (r.has ? (past ? '' : '<button class="btn s" data-sync="' + esc(r.id) + '">更新（チェック保持）</button> ') : '<button class="btn p" data-sync="' + esc(r.id) + '" style="font-size:14px;padding:9px 16px">受付シートを作成</button> ') +
          (r.has && D.isAdmin ? (past ? '<button class="btn p" data-lock="' + esc(r.id) + '">確定する</button> ' : '<button class="btn s" data-lock="' + esc(r.id) + '">確定</button> <button class="btn s d" data-reset="' + esc(r.id) + '">リセット</button> ') : '')) +
        (r.has ? ' <button class="btn s" data-people="' + esc(r.id) + '">参加者を見る</button>' : '') +
        (r.has && past && !r.locked ? '<div class="muted" style="font-size:11.5px;margin-top:4px;white-space:normal">会議は終わりました。受付の付け忘れがなければ「確定する」</div>' : '') +
      '</td></tr>';
    if(!r.locked) h += unpaidBox(r);
  });
  return h + '</tbody></table></div><p class="muted" style="font-size:12.5px;margin-top:8px">参加者を見る＝その会議に来た人・来なかった人・懇親会に出た人を一覧で見る（文字でコピーもできる）。更新＝最新の回答で作り直し（受付チェックは残る。会議の前だけ出ます）。リセット＝チェックも消して作り直し。確定＝編集保護・自動更新の対象外。</p>' +
    '<p class="muted" style="font-size:12.5px;margin-top:4px"><b>会議が終わったら：</b>受付の付け忘れ・当日変更を直す → 「確定」 → 出席状況タブで「最新に更新」。出席状況は受付チェックを正にするので、確定前に受付漏れがないか確認してください。</p>';
}
function bindReception(){
  var rf = document.getElementById('recRefresh'); if(rf) rf.onclick = function(){ rf.disabled = true; rf.textContent = '読み込み中…'; loadReception(); };
  var run = function(fn, id, msg){ busy(true); api().withSuccessHandler(function(r){ busy(false); closeModal(true); REC = r.list; rerender('reception', viewReception); toast(msg); }).withFailureHandler(function(e){ busy(false); showErr(e.message); toast('エラー：'+e.message); })[fn](TOKEN, id); };
  var isPast = function(id){ var m = D.meetings.filter(function(x){ return x['会議ID'] === id; })[0]; if(!m || !m['開催日']) return false; var t = new Date(); t.setHours(0,0,0,0); return new Date(m['開催日']) < t; };
  Array.prototype.forEach.call(document.querySelectorAll('[data-sync]'), function(b){ b.onclick = function(){
    var id = b.dataset.sync, has = b.textContent.indexOf('更新') >= 0;
    if(!has) return confirmBox('受付_' + id + ' を作成しますか？', '現在の名簿と回答から当日受付用のシートを作ります。作成後は受付ページで選べるようになります。回答が増えたら「更新」で取り込めます。', function(){ run('adminReceptionSync', id, '作成しました'); });
    confirmBox('受付シートを最新の回答で作り直しますか？', (isPast(id) ? '【この会議は終了しています】通常は更新不要です。' : '') + '受付・会議費・懇親会費・領収書のチェックと当日変更は引き継がれます。名簿や回答を直したあとに使うものです。', function(){ run('adminReceptionSync', id, '更新しました'); }, isPast(id));
  }; });
  Array.prototype.forEach.call(document.querySelectorAll('[data-reset]'), function(b){ b.onclick = function(){ confirmBox((isPast(b.dataset.reset) ? '【終了した会議】' : '') + '受付_' + b.dataset.reset + ' をリセットしますか？', '受付・会議費・懇親会費・領収書のチェックと当日変更が全部消えます。回答を取り込み直すだけなら「更新」を使ってください。消えたチェックは戻せません。', function(){ run('adminReceptionReset', b.dataset.reset, 'リセットしました'); }, true); }; });
  Array.prototype.forEach.call(document.querySelectorAll('[data-lock]'), function(b){ b.onclick = function(){ confirmBox('受付_' + b.dataset.lock + ' を確定しますか？', '編集保護がかかり、受付ページ・自動更新からも変更できなくなります。', function(){ busy(true); api().withSuccessHandler(function(r){ busy(false); closeModal(true); REC = r.list; rerender('reception', viewReception); toast('確定しました'); }).withFailureHandler(function(e){ busy(false); showErr(e.message); }).adminReceptionLock(TOKEN, b.dataset.lock, true); }); }; });
  Array.prototype.forEach.call(document.querySelectorAll('[data-unlock]'), function(b){ b.onclick = function(){ confirmBox('受付_' + b.dataset.unlock + ' の確定を解除しますか？', '編集保護が外れ、受付ページや自動更新から変更できる状態に戻ります。直し終わったら再度「確定」してください。', function(){ busy(true); api().withSuccessHandler(function(r){ busy(false); closeModal(true); REC = r.list; rerender('reception', viewReception); toast('解除しました'); }).withFailureHandler(function(e){ busy(false); showErr(e.message); }).adminReceptionLock(TOKEN, b.dataset.unlock, false); }); }; });
  Array.prototype.forEach.call(document.querySelectorAll('[data-people]'), function(b){ b.onclick = function(){ openPeople(b.dataset.people); }; });
}

/** 参加者を見る：受付シートから、来た人・来なかった人・懇親会に出た人を一覧にする（あとから振り返る用） */
function openPeople(id){
  showModal('<div class="mh"><h3>参加者</h3><button class="btn s" id="mClose">閉じる</button></div><div class="err" id="mErr"></div><div class="mb" style="display:block"><div id="pplBody" class="muted">読み込み中…</div></div><div class="mf"><button class="btn" id="pplCopy" disabled>文字でコピー</button><button class="btn" id="mCancel">閉じる</button></div>');
  api().withSuccessHandler(function(P){
    var box = document.getElementById('pplBody'); if(!box) return;
    var R = P.rows || [], isZ = function(x){ return /ZOOM|オンライン/i.test(x.att); };
    var came = R.filter(function(x){ return x.inn; }), zoom = R.filter(function(x){ return !x.inn && isZ(x); });
    var miss = R.filter(function(x){ return !x.inn && !isZ(x) && /出席|遅参|代理/.test(x.att); });
    var abs = R.filter(function(x){ return !x.inn && !isZ(x) && !/出席|遅参|代理/.test(x.att); });
    var party = R.filter(function(x){ return x.party; });
    var who = function(x){ return [x.l, x.y].filter(Boolean).join('　'); };
    var sec = function(title, list, cls, note){
      return '<div class="pp-s"><div class="pp-h"><b>' + title + '</b><span>' + list.length + '名</span></div>' + (note ? '<div class="muted" style="font-size:11.5px;margin:-2px 0 6px">' + note + '</div>' : '') +
        (list.length ? '<div class="lv-cs">' + list.map(function(x){ return '<span class="lv-c ' + cls + '">' + esc(x.n) + '<small>' + esc(who(x)) + (x.chg ? '　当日：' + esc(x.chg) : '') + '</small></span>'; }).join('') + '</div>' : '<div class="muted" style="font-size:13px">いません</div>') + '</div>';
    };
    var h = '<div style="display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;margin-bottom:10px"><b style="font-size:15px">' + esc(P.label) + '</b><span class="muted">' + esc(fmtD(P.date)) + '</span>' + (P.locked ? '<span class="tag y">確定済</span>' : '<span class="tag g">確定前</span>') + '</div>' +
      sec('会議に来た人', came, 'ok', '受付をした人') +
      (zoom.length ? sec('ZOOMで参加', zoom, '') : '') +
      sec('来なかった人', miss, 'ng', '出席と答えていたが、受付をしていない人' + (P.locked ? '' : '（受付の付け忘れがないか確かめてから「確定」してください）')) +
      sec('欠席', abs, '') +
      sec(esc(P.partyName || '懇親会') + 'に出た人', party, 'ok', '懇親会に出席と答えて受付をした人と、懇親会費を受け取った人') +
      (P.sheetUrl ? '<div style="margin-top:10px"><a href="' + esc(P.sheetUrl) + '" target="_blank" rel="noopener" style="font-size:13px">スプレッドシートの受付シートを開く ↗</a></div>' : '');
    box.innerHTML = h; box.className = '';
    var cp = document.getElementById('pplCopy');
    if(cp){ cp.disabled = false; cp.onclick = function(){
      var line = function(t, l){ return '■' + t + '（' + l.length + '名）\n' + (l.length ? l.map(function(x){ return '・' + x.n + (who(x) ? '（' + who(x) + '）' : ''); }).join('\n') : '・なし'); };
      var txt = [P.label + '　' + fmtD(P.date), line('会議に来た人', came)].concat(zoom.length ? [line('ZOOMで参加', zoom)] : []).concat([line('来なかった人', miss), line('欠席', abs), line((P.partyName || '懇親会') + 'に出た人', party)]).join('\n\n');
      var fb = function(){ var ta = document.createElement('textarea'); ta.value = txt; ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta); ta.select(); var ok = false; try { ok = document.execCommand('copy'); } catch(e){} ta.remove(); toast(ok ? 'コピーしました' : 'コピーできませんでした'); };
      if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(function(){ toast('コピーしました'); }, fb); else fb();
    }; }
    MODAL_SNAP = modalSnap();
  }).withFailureHandler(function(e){ showErr(e.message); }).adminReceptionPeople(TOKEN, id);
}

/* ---------- 予算 ---------- */
var BUD = null;
function loadBudget(){ api().withSuccessHandler(function(b){ BUD = b; rerender('budget', viewBudget); }).withFailureHandler(function(e){ toast('エラー：'+e.message); }).adminBudget(TOKEN); }
var BUD_VIEW = 'flow';   // 'flow'＝収支（いつもの予算）／'cash'＝現金・銀行
function viewBudget(){
