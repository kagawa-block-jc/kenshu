<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>会員研修委員会 管理ページ</title>
<link rel="preconnect" href="https://script.google.com">
<link rel="preconnect" href="https://script.googleusercontent.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Noto+Sans+JP:wght@400;500;700;900&display=swap">
<style>
  :root{--blue:#1a56c4;--blue-dk:#123c8a;--blue-soft:#e6eefb;--ink:#1b2430;--sub:#5b6675;--line:#dfe5ee;--bg:#f4f6fa;--card:#fff;
    --ok:#188038;--ok-soft:#e3f3e8;--ng:#c62828;--ng-soft:#fde8e8;--warn:#b7791f;--warn-soft:#fff3d6}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink)}
  body{font-family:"Noto Sans JP",system-ui,sans-serif;font-size:14px;line-height:1.55;padding-bottom:130px}
  button,input,select,textarea{font-family:inherit;font-size:14px}
  button{cursor:pointer}
  a{color:var(--blue)}

  header{position:sticky;top:0;z-index:20;background:#fff;border-bottom:3px solid var(--blue)}
  .hd{max-width:1180px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
  .brand{font-family:Anton,Impact,sans-serif;line-height:.92}
  .brand .l1{font-size:20px}.brand .l2{font-size:20px;color:var(--blue)}
  .org{font-size:12px;color:var(--sub);flex:1;min-width:200px}
  .me{font-size:12px;color:var(--sub);text-align:right}
  .me b{display:inline-block;padding:2px 9px;border-radius:999px;background:var(--blue-soft);color:var(--blue);font-size:11.5px;margin-left:6px}
  .me b.staff{background:var(--ok-soft);color:var(--ok)}
  nav{max-width:1180px;margin:0 auto;padding:6px 16px 8px;display:flex;gap:8px;flex-wrap:wrap;align-items:flex-start}
  nav .grp{display:flex;flex-direction:column;border-radius:10px;padding:4px 6px 5px;background:var(--g-bg)}
  nav .grp .gl{font-size:10.5px;font-weight:700;color:var(--g-fg);letter-spacing:.04em;padding:0 6px 2px;opacity:.85}
  nav .grp .gb{display:flex;gap:2px;flex-wrap:wrap}
  nav button{border:0;background:none;padding:6px 11px;font-weight:700;color:var(--sub);border-radius:7px;white-space:nowrap;font-size:13.5px}
  nav button:hover{background:rgba(255,255,255,.7)}
  nav button.on{color:#fff;background:var(--g-fg)}
  nav .grp.run{--g-bg:#e8f0fd;--g-fg:#1a56db}      /* 会議の運営（毎回） */
  nav .grp.data{--g-bg:#e6f5ea;--g-fg:#1e7a3a}     /* 基礎データ（たまに） */
  nav .grp.money{--g-bg:#fdf1e0;--g-fg:#b4600c}    /* お金・記録 */
  nav .grp.sys{--g-bg:#efeff2;--g-fg:#55556b}      /* システム・ヘルプ */
  nav .grp.master{--g-bg:#f6e8f3;--g-fg:#8a2c6e}   /* マスター */

  .wrap{max-width:1180px;margin:0 auto;padding:16px}
  .tab{display:none}.tab.on{display:block}
  .bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
  .bar h2{margin:0;font-size:18px;font-weight:900;flex:1}
  .bar input[type=search]{padding:8px 12px;border:1.5px solid var(--line);border-radius:999px;min-width:220px}
  .btn{padding:8px 16px;border-radius:8px;border:1.5px solid var(--line);background:#fff;font-weight:700;color:var(--ink)}
  a.btn{display:inline-block;text-decoration:none;line-height:normal}
  .btn.p{background:var(--blue);border-color:var(--blue);color:#fff}
  .btn.d{border-color:var(--ng);color:var(--ng)}
  .btn.s{padding:5px 10px;font-size:12.5px}
  .btn:disabled{opacity:.45;cursor:default}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
  /* 横スクロールは原則なし：列は折り返す。年間の出席状況だけ .wide で横スクロール（氏名列は固定） */
  .tbl{overflow-x:visible}
  .tbl.wide{overflow-x:auto}
  .tbl.wide th:nth-child(1),.tbl.wide td:nth-child(1){position:sticky;left:0;background:var(--card);z-index:2;box-shadow:2px 0 0 var(--line)}
  .tbl.wide th:nth-child(1){z-index:3;background:var(--bg)}
  table{width:100%;border-collapse:collapse;font-size:13.5px}
  th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle;white-space:normal;overflow-wrap:anywhere}
  td .btn{white-space:nowrap}
  th{font-size:11.5px;color:var(--sub);letter-spacing:.04em;background:var(--bg);position:sticky;top:0}
  tr:hover td{background:#fafbfd}
  td.name{font-weight:700;font-size:14.5px}
  .tag{display:inline-block;padding:1px 8px;border-radius:4px;font-size:11.5px;font-weight:700}
  .tag.b{background:var(--blue-soft);color:var(--blue)}.tag.g{background:var(--ok-soft);color:var(--ok)}.tag.r{background:var(--ng-soft);color:var(--ng)}.tag.y{background:var(--warn-soft);color:var(--warn)}
  .muted{color:var(--sub)}
  .lock{color:var(--sub);font-size:12px}
  .empty{padding:40px;text-align:center;color:var(--sub)}
  .ro{opacity:.6}

  /* modal */
  .mask{position:fixed;inset:0;background:rgba(27,36,48,.45);display:none;z-index:50;align-items:flex-start;justify-content:center;padding:30px 12px;overflow:auto}
  .mask.on{display:flex}
  .modal{background:#fff;border-radius:14px;width:100%;max-width:760px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
  .modal .mh{display:flex;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--line)}
  .modal .mh h3{margin:0;font-size:17px;flex:1}
  .modal .mb{padding:16px 20px;display:grid;grid-template-columns:1fr 1fr;gap:12px 16px}
  .modal .mf{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
  .f{display:flex;flex-direction:column;gap:4px}
  .f.wide{grid-column:1/-1}
  .f label{font-size:12px;color:var(--sub);font-weight:700}
  .f input,.f select,.f textarea{padding:9px 11px;border:1.5px solid var(--line);border-radius:8px;width:100%}
  .f textarea{min-height:70px;resize:vertical}
  .f .hint{font-size:11.5px;color:var(--sub)}
  .chk{display:flex;flex-wrap:wrap;gap:8px 16px}
  .chk label{display:flex;gap:6px;align-items:center;font-size:13.5px;color:var(--ink);font-weight:500;white-space:nowrap}
  .err{background:var(--ng-soft);color:var(--ng);padding:10px 14px;border-radius:8px;margin:0 20px 10px;font-size:13px;display:none}
  .err.on{display:block}
  @media (max-width:640px){.modal .mb{grid-template-columns:1fr}}
  /* スマホ：表は1行＝1枚のカードに組み替える（見出しは各セルの左に小さく出す）。年間の出席状況(.wide)だけ横スクロールのまま */
  .navm{display:none}
  @media (max-width:700px){
    nav{display:none}
    .navm{display:block;padding:6px 12px 10px}
    /* スマホのメニュー：押せるボタンに見せる（「ほかのページへ」）。押すと下からページ一覧 */
    .navm #navBtn{width:100%;display:flex;align-items:center;gap:10px;padding:9px 12px;border:2px solid var(--blue);border-radius:10px;background:var(--blue);color:#fff;font:inherit;text-align:left;cursor:pointer}
    .navm #navBtn .ic{font-size:20px;line-height:1}
    .navm #navBtn .cur{flex:1;min-width:0;line-height:1.2}
    .navm #navBtn .cur small{display:block;font-size:10.5px;opacity:.85}
    .navm #navBtn .cur b{display:block;font-size:16px}
    .navm #navBtn .sw{font-size:12px;font-weight:700;background:#fff;color:var(--blue);padding:6px 9px;border-radius:999px;white-space:nowrap}
    .navsheet{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:60}
    .navsheet.on{display:block}
    .navsheet .nsin{position:absolute;left:0;right:0;bottom:0;max-height:88vh;overflow:auto;background:#fff;border-radius:16px 16px 0 0;padding:12px 14px 24px}
    .navsheet .nsh{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
    .navsheet .nsh b{font-size:16px}
    .navsheet .nsh button{font:inherit;font-size:13px;padding:6px 12px;border:1.5px solid var(--line);border-radius:999px;background:#fff}
    .navsheet .nsg{margin-top:10px;padding:8px 10px 10px;border-radius:10px}
    .navsheet .nsg .gl{font-size:11px;font-weight:700;margin-bottom:6px}
    .navsheet .nsg button{display:flex;justify-content:space-between;align-items:center;width:100%;padding:12px 14px;margin-bottom:6px;border:1.5px solid rgba(0,0,0,.08);border-radius:10px;background:#fff;font:inherit;font-size:15px;font-weight:700;text-align:left}
    .navsheet .nsg button.on{border-color:var(--blue);color:var(--blue);background:#eef3fc}
    .navsheet .nsg button small{font-size:11px;font-weight:700;color:var(--blue)}
    .navsheet .nsg.run{background:#eef3fc} .navsheet .nsg.data{background:#eaf6ee} .navsheet .nsg.money{background:#fff6e3} .navsheet .nsg.sys{background:#f1f1f3} .navsheet .nsg.master{background:#f6e9f7}
    .hd{padding:8px 12px;gap:8px}
    .brand .l1,.brand .l2{font-size:15px}
    .org{display:none}
    .me{flex:1;text-align:right}
    .wrap{padding:10px 10px}
    .bar{flex-wrap:wrap;gap:8px}
    .bar h2{font-size:17px}
    .card{border-radius:10px}
    .tbl:not(.wide) thead{display:none}
    .tbl:not(.wide) table,.tbl:not(.wide) tbody,.tbl:not(.wide) tr{display:block;width:100%}
    .tbl:not(.wide) tr{padding:8px 0;border-bottom:6px solid var(--bg)}
    .tbl:not(.wide) tr:last-child{border-bottom:0}
    .tbl:not(.wide) td{display:block;position:relative;border:0;padding:3px 14px 3px calc(5.5em + 22px);font-size:13.5px;line-height:1.55}
    .tbl:not(.wide) td[data-label]::before{content:attr(data-label);position:absolute;left:14px;top:5px;width:5.5em;color:var(--sub);font-size:11.5px}
    .tbl:not(.wide) td:not([data-label]){padding-left:14px}
    .tbl:not(.wide) td > *{margin-right:6px}
    .bar h2{flex:0 0 100%;margin-bottom:2px}
    .bar select,.bar input[type=search]{flex:1 1 200px;min-width:0}
    .tbl:not(.wide) td.name,.tbl:not(.wide) td:first-child b{font-size:15px}
    .tbl:not(.wide) td.empty-cell{display:none}
    /* 読み上げ名簿は1人1行のまま詰める */
    /* 読み上げ順どおり 1行目：No 役職 ／ 2行目：氏名（ふりがな）／ 3行目：LOM 回答 受付 */
    .tbl.compact tr{display:grid;grid-template-columns:26px auto 1fr auto;column-gap:8px;row-gap:2px;padding:8px 12px;align-items:baseline}
    .tbl.compact td{display:block;padding:0;font-size:13px;position:static}
    .tbl.compact td[data-label]::before{content:none;position:static}
    .tbl.compact td:nth-child(1){grid-column:1;grid-row:2;color:var(--sub);text-align:right}
    .tbl.compact td:nth-child(3){grid-column:2;grid-row:2;font-size:15.5px;font-weight:900;white-space:nowrap}
    .tbl.compact td:nth-child(4){grid-column:3 / 5;grid-row:2;font-size:11.5px;color:var(--sub)}
    .tbl.compact td:nth-child(4):not(:empty)::before{content:'（'}
    .tbl.compact td:nth-child(4):not(:empty)::after{content:'）'}
    .tbl.compact td:nth-child(2){grid-column:2 / 5;grid-row:1;color:var(--ink);font-size:12.5px}
    .tbl.compact td:nth-child(5){grid-column:2;grid-row:3;color:var(--sub)}
    .tbl.compact td:nth-child(6){grid-column:3;grid-row:3}
    .tbl.compact td:nth-child(6)::before{content:'回答：';color:var(--sub);font-size:11.5px}
    .tbl.compact td:nth-child(7){grid-column:4;grid-row:3}
    .tbl.compact td:nth-child(7):not(:empty)::before{content:'受付';color:var(--ok);font-size:11.5px;margin-right:2px}
    #types .row.hdr{display:none}
    #types .row{grid-template-columns:1fr 1fr;gap:6px;padding:10px;border:1px solid var(--line);border-radius:10px}
    #types .row .tn{grid-column:1 / 3;font-weight:700}
    #types .row .tr{grid-column:1 / 3}
    #types .row button{justify-self:end}
    .mcard > div{flex-wrap:wrap}
    .mcard > div > div:first-child{min-width:70px;align-self:flex-start;border-radius:12px 0 12px 0 !important;border-right:0 !important}
    .mcard > div > div:last-child{flex-direction:row !important;width:100%;padding:0 12px 12px !important;justify-content:flex-end}
  }

  .toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 18px;border-radius:999px;font-size:13px;display:none;z-index:60}
  .toast.on{display:block}
  .gate{max-width:520px;margin:60px auto;background:#fff;border:1px solid var(--line);border-radius:14px;padding:28px;text-align:center}
  .gate h2{margin:0 0 8px}
  .gate p{color:var(--sub);margin:0 0 6px}

  .types{display:grid;gap:8px}
  .types .row{display:grid;grid-template-columns:1fr 100px 1fr 130px 40px;gap:8px;align-items:center}
  .types .row input{padding:8px 10px;border:1.5px solid var(--line);border-radius:8px;width:100%}
  .types .row select{padding:8px 10px;border:1.5px solid var(--line);border-radius:8px}
  .types .hdr{font-size:11.5px;color:var(--sub);font-weight:700}

  /* 会議シナリオ：本文の編集行（PCは4列、スマホは縦積み） */
  .schead{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
  .schead b{flex:1}
  .schead .muted{flex-basis:100%;font-size:12px}
  .scrow{display:grid;grid-template-columns:150px 1fr 170px auto;gap:8px;align-items:start;padding:8px 0;border-top:1px solid var(--line)}
  .scrow .sct{font-weight:700}
  .scrow .scx{min-height:70px;line-height:1.6;font-size:13px}
  .scrow .scn{min-height:70px;font-size:12px}
  .scrow .scops{display:flex;flex-direction:column;gap:3px}
  .scrow .scops .btn{padding:2px 8px;white-space:nowrap}
  @media(max-width:700px){
    .scrow{grid-template-columns:1fr;gap:6px;padding:12px 0}
    .scrow .scx{min-height:110px}
    .scrow .scn{min-height:44px}
    .scrow .scops{flex-direction:row;justify-content:flex-end}
  }

  /* 日程調整の集計 */
  .plist .prow{display:grid;grid-template-columns:150px 1fr auto;grid-template-areas:"l bar n" "l who who" "l act act";gap:4px 12px;align-items:center;padding:9px 10px;border-top:1px solid var(--line)}
  .plist .prow.top{background:#f3f8f1}
  .plist .prow.fixed{background:#eef3fc}
  .plist .pl{grid-area:l;font-size:14px}
  .plist .pbar{grid-area:bar;height:12px;background:#eef1f5;border-radius:999px;overflow:hidden;display:flex}
  .plist .pbar .o{display:block;height:100%;background:var(--ok)}
  .plist .pbar .d{display:block;height:100%;background:#e6a700}
  .plist .pn{grid-area:n;display:flex;gap:10px;font-size:12.5px;font-weight:700;white-space:nowrap}
  .plist .pn .o{color:var(--ok)} .plist .pn .d{color:#b8860b} .plist .pn .x{color:var(--ng)}
  .plist .pw{grid-area:who;font-size:12px;color:var(--sub);display:flex;gap:14px;flex-wrap:wrap}
  .plist .pw em{font-style:normal;font-weight:700;margin-right:4px}
  .plist .pact{grid-area:act}
  @media(max-width:700px){
    .plist .prow{grid-template-columns:1fr;grid-template-areas:"l" "bar" "n" "who" "act";gap:5px}
  }

  /* 会議シナリオ「読む（表示のみ）」：画面全体に読みやすく表示。印刷時はこれだけ印刷 */
  #scOverlay{display:none}
  body.scview #scOverlay{display:block;position:fixed;inset:0;background:#fff;z-index:70;overflow:auto;-webkit-overflow-scrolling:touch}
  body.scview #app{display:none}
  .scv{max-width:820px;margin:0 auto;padding:0 0 60px}
  .scvbar{position:sticky;top:0;display:flex;gap:8px;align-items:center;justify-content:space-between;padding:10px 14px;background:#fff;border-bottom:1px solid var(--line);z-index:1}
  .scvdoc{padding:18px 16px;font-size:15px;line-height:1.8;color:#111}
  .scvdoc .org{font-size:12px;color:#555}
  .scvdoc h1{font-size:20px;margin:2px 0 4px;font-weight:900}
  .scvdoc .when{font-size:13px;color:#333;margin-bottom:14px}
  .scvdoc section{padding:12px 0;border-top:1px solid #ccc}
  .scvdoc h2{font-size:15px;margin:0 0 6px;font-weight:900;color:var(--blue)}
  .scvdoc .x{white-space:normal;word-break:break-all}
  .scvdoc .n{margin-top:6px;font-size:12.5px;color:#555;background:#f4f6f9;border-radius:6px;padding:6px 10px}
  .scvdoc .vote{background:#fff7e6}
  @media print{
    body.scview{background:#fff}
    body.scview header,body.scview .scvbar,body.scview #toast,body.scview #mask{display:none !important}
    body.scview #scOverlay{position:static;overflow:visible}
    .scvdoc{font-size:10.5pt;line-height:1.6;padding:0}
    .scvdoc section{page-break-inside:avoid}
  }

  /* 出席確認名簿／会議シナリオ の切り替え */
  .modesw{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 0 12px}
  .modesw button{padding:10px 12px;border:2px solid var(--line);border-radius:12px;background:#fff;font:inherit;font-size:15px;font-weight:900;color:var(--sub);text-align:left;cursor:pointer}
  .modesw button small{display:block;font-size:11.5px;font-weight:500;margin-top:2px}
  .modesw button.on{border-color:var(--blue);background:var(--blue);color:#fff}
  .modesw button.on small{color:#e3ecfa}

  .chips{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 10px}
  .chip{padding:6px 12px;border:1.5px solid var(--line);border-radius:999px;background:#fff;font:inherit;font-size:12.5px;font-weight:700;color:var(--sub);cursor:pointer}
  .chip.on{background:var(--blue);border-color:var(--blue);color:#fff}

  /* ガイド：検索・折りたたみ */
  .gsearch{padding:12px 14px;margin-bottom:12px}
  .gsin{display:flex;gap:8px;align-items:center}
  .gsin .ic{font-size:18px}
  .gsin input{flex:1;padding:11px 12px;border:2px solid var(--blue);border-radius:10px;font:inherit;font-size:15px}
  .gchips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
  .gsec{margin-bottom:8px;border:1px solid var(--line);border-radius:10px;background:#fff;overflow:hidden}
  .gsh{display:flex;align-items:center;gap:10px;width:100%;padding:12px 14px;border:0;background:#f4f7fd;font:inherit;font-size:15px;font-weight:900;color:var(--blue);text-align:left;cursor:pointer}
  .gsh small{font-size:12px;font-weight:700;color:var(--sub)}
  .gsh em{margin-left:auto;font-style:normal;font-size:12px}
  .gbody{padding:4px 14px 10px}
  .gitem{padding:10px 0;border-top:1px solid var(--line)}
  .gitem b{display:block;font-size:14.5px;margin-bottom:3px}
  .gitem .gb{font-size:13.5px;line-height:1.7;white-space:normal}
  .gitem .gc{font-size:12.5px;color:var(--sub);margin-top:4px;line-height:1.6}
  .gitem .gurl{font-size:12.5px;word-break:break-all;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .gnote{margin:8px 0;padding:8px 12px;border-radius:8px;background:var(--warn-soft);font-size:13px;line-height:1.6;white-space:normal}
  .gnote.ok{background:var(--ok-soft);color:var(--ok);font-weight:700}
  .gnote.ng{background:var(--ng-soft);color:var(--ng);font-weight:700}
  .gnote.plain{background:#f4f6f9;color:var(--sub)}
  mark{background:#fff1a8;padding:0 2px;border-radius:3px}
  details.evbox > summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:10px;min-height:40px;padding:0 12px;border:1.5px dashed var(--line);border-radius:8px;font-size:13px;font-weight:700;color:var(--blue);background:#fafbfd}
  details.evbox > summary::-webkit-details-marker{display:none}
  details.evbox[open] > summary{border-style:solid;margin-bottom:4px}
  details.evbox .evn{background:var(--blue);color:#fff;border-radius:999px;padding:1px 9px;font-size:11.5px}
  details.evbox .evn0{color:var(--sub);font-weight:400;font-size:12px}

       '<div class="me">' + esc(u.name || u.email) + '<b class="' + (D.isAdmin ? '' : 'staff') + '">' + esc(u.master ? 'マスター' : u.role) + '</b> <button class="btn s" id="lgout" style="margin-left:8px">ログアウト</button></div></div>' +

        .withFailureHandler(function(e){ busy(false); showErr('店の詳細を保存できませんでした：' + e.message); }).adminVenueSave(TOKEN, vdata);

/* ---------- 議題・まとめて取り込む ---------- */
// 議題の文字列（改行区切り）→ 配列。先頭の「・」「1.」「①」は外す
function agendaLines(v){ return String(v || '').split(/\r?\n/).map(function(x){ return x.replace(/^[\s　]*([・•\-－―*※]|[0-9０-９]+[.．)）、]|[①-⑳]|\([0-9０-９]+\)|（[0-9０-９]+）)?[\s　]*/, '').trim(); }).filter(Boolean); }

// Excelからコピーした表（タブ区切り）を会議の一覧にする。見出し行があれば列名で判断、無ければ「日付の列」「その右の文字の列＝会議名」「残り＝議題」と見なす
function parseBulkText(text){
  var pad = function(n){ return ('0' + n).slice(-2); };
  var z2h = function(x){ return String(x == null ? '' : x).replace(/[０-９]/g, function(c){ return String.fromCharCode(c.charCodeAt(0) - 0xFEE0); }).replace(/：/g, ':').replace(/／/g, '/').replace(/　/g, ' ').trim(); };
  var now = new Date(), floor = new Date(now.getFullYear(), now.getMonth() - 2, now.getDate());
  var parseDate = function(raw){
    var x = z2h(raw); if(!x) return null;
    var serial = x.match(/^(\d{5})(?:\.\d+)?$/);   // Excelの日付が数字（46317など）で貼られたとき
    if(serial){ var dd = new Date(Date.UTC(1899, 11, 30) + Number(serial[1]) * 86400000); return { date: dd.getUTCFullYear() + '-' + pad(dd.getUTCMonth() + 1) + '-' + pad(dd.getUTCDate()), time: '' }; }
    var m = x.match(/(?:(\d{4})\s*[\/\-年.]\s*)?(\d{1,2})\s*[\/\-月.]\s*(\d{1,2})\s*日?/);
    if(!m) return null;
    var y = m[1] ? Number(m[1]) : null, mo = Number(m[2]), d = Number(m[3]);
    if(mo < 1 || mo > 12 || d < 1 || d > 31) return null;
    if(y === null){ y = now.getFullYear(); if(new Date(y, mo - 1, d) < floor) y++; }
    var t = x.slice(m.index + m[0].length).match(/(\d{1,2})\s*(?::|時)\s*(\d{1,2})?\s*(半)?/), time = '';
    if(t){ var hh = Number(t[1]), mm = t[2] !== undefined ? Number(t[2]) : (t[3] ? 30 : 0); if(hh <= 24 && mm < 60 && !(hh === 0 && mm === 0)) time = pad(hh) + ':' + pad(mm); }
    return { date: y + '-' + pad(mo) + '-' + pad(d), time: time };
  };
  var parseTime = function(raw){ var x = z2h(raw); var t = x.match(/(\d{1,2})\s*(?::|時)\s*(\d{1,2})?\s*(半)?/); if(!t) return ''; var hh = Number(t[1]), mm = t[2] !== undefined ? Number(t[2]) : (t[3] ? 30 : 0); return (hh <= 24 && mm < 60) ? pad(hh) + ':' + pad(mm) : ''; };
  var lines = String(text || '').replace(/\r/g, '').split('\n').filter(function(l){ return l.trim(); });
  if(!lines.length) return { rows: [], note: '' };
  var sep = lines.some(function(l){ return l.indexOf('\t') >= 0; }) ? '\t' : (lines.every(function(l){ return l.split(',').length >= 2; }) ? ',' : null);
  var cells = lines.map(function(l){ return sep ? l.split(sep).map(function(c){ return c.trim(); }) : [l.trim()]; });
  var ncol = Math.max.apply(null, cells.map(function(r){ return r.length; }));
  // 見出し行
  var H = { date: /日付|開催日|日程|^日$|日時/, name: /会議名|タイトル|名称|件名|^予定$|議題名|会議/, time: /時刻|時間|開始/, place: /場所|会場/, topics: /議題|内容|議事|テーマ/, note: /備考|メモ|注意/, people: /関わる人|関係者|担当/, project: /プロジェクト|小委員会|事業/ };
  var head = cells[0], isHead = head.every(function(c){ return !parseDate(c); }) && head.some(function(c){ return H.date.test(c) || H.name.test(c) || H.topics.test(c); });
  var col = { date: -1, name: -1, time: -1, place: -1, topics: [], note: -1, people: -1, project: -1 };
  var body = cells;
  if(isHead){
    body = cells.slice(1);
    head.forEach(function(c, i){
      if(col.date < 0 && H.date.test(c) && !/時/.test(c.replace(/日時/, ''))) col.date = i;
      else if(col.time < 0 && H.time.test(c)) col.time = i;
      else if(H.topics.test(c)) col.topics.push(i);
      else if(col.name < 0 && H.name.test(c)) col.name = i;
      else if(col.place < 0 && H.place.test(c)) col.place = i;
      else if(col.note < 0 && H.note.test(c)) col.note = i;
      else if(col.people < 0 && H.people.test(c)) col.people = i;
      else if(col.project < 0 && H.project.test(c)) col.project = i;
    });
  }
  if(col.date < 0){   // 見出しが無い／日付の列名が無い：日付が一番多く入っている列
    var best = -1, bestN = 0;
    for(var i = 0; i < ncol; i++){ var n = body.filter(function(r){ return parseDate(r[i]); }).length; if(n > bestN){ best = i; bestN = n; } }
    col.date = best;
  }
  if(col.date < 0) return { rows: [], note: '日付の列が見つかりません。Excelで「日付」と「会議名」の列を含めて範囲を選び、コピーして貼ってください' };
  if(!isHead || col.name < 0){   // 会議名：日付の右で、文字が一番よく入っている列（日付・時刻・議題に使った列は除く）
    var cand = [];
    for(var j = 0; j < ncol; j++){ if(j === col.date || j === col.time || col.topics.indexOf(j) >= 0) continue; var n2 = body.filter(function(r){ var v = r[j]; return v && !parseDate(v) && !/^\d+$/.test(v); }).length; if(n2) cand.push({ i: j, n: n2 }); }
    cand.sort(function(a, b){ return (b.n - a.n) || (a.i - b.i); });
    if(cand.length){ col.name = cand[0].i; if(!isHead) col.topics = cand.slice(1).map(function(c){ return c.i; }).sort(function(a, b){ return a - b; }); }
  }
  var rows = [];
  body.forEach(function(r, idx){
    var dt = parseDate(r[col.date]); if(!dt) return;
    var name = col.name >= 0 ? z2h(r[col.name]) : '';
    if(!name) return;
    var topics = []; col.topics.forEach(function(i){ agendaLines(r[i]).forEach(function(t){ topics.push(t); }); });
    var note = col.note >= 0 ? String(r[col.note] || '').trim() : '';
    var people = col.people >= 0 ? String(r[col.people] || '').trim() : '';
    if(people) note = (note ? note + '\n' : '') + '関わる人：' + people;
    var time = col.time >= 0 ? parseTime(r[col.time]) : dt.time;
    rows.push({ line: idx + (isHead ? 2 : 1), date: dt.date, time: time, name: name, topics: topics, note: note, place: col.place >= 0 ? String(r[col.place] || '').trim() : '', project: col.project >= 0 ? String(r[col.project] || '').trim() : '' });
  });
  rows.sort(function(a, b){ return a.date.localeCompare(b.date) || a.time.localeCompare(b.time); });
  var found = [];
  if(isHead){ found.push('見出し行あり'); } else { found.push('見出し行なし（' + (col.date + 1) + '列目＝日付、' + (col.name + 1) + '列目＝会議名' + (col.topics.length ? '、残り＝議題' : '') + ' と見なしました）'); }
  return { rows: rows, note: found.join('。'), skippedLines: body.length - rows.length };
}

/* ---------- ガイド ---------- */
var GUIDE_Q = '', GUIDE_OPEN = {};
/* ガイド：検索して探す形。やりたいことを入れると、該当する項目だけ出る。見出しは折りたたみ */
var GUIDE_CHIPS = [['案内を送る','案内'],['催促したい','催促'],['印刷したい','印刷'],['日程を決める','日程調整'],['司会の台本','シナリオ'],['名簿に人を足す','名簿に人'],['懇親会場','懇親会場'],['お金・集金','集金'],['出席率','出席率'],['委員会で使う','委員会で使う'],['スマホで','スマホ'],['エラーが出た','エラー'],['ログインできない','ログイン'],['URLを知りたい','URL']];
function viewGuide(){
  var g = D.guide || [];
  var who = D.user.master ? 'マスター' : D.user.role;
  var h = '<div class="bar"><h2>運用ガイド</h2><span class="muted">' + esc(who) + ' 向けの内容だけ表示</span></div>';
  h += '<div class="card gsearch"><div class="gsin"><span class="ic">🔍</span><input type="search" id="gq" value="' + esc(GUIDE_Q) + '" placeholder="やりたいこと・困っていることを入れる（例：印刷、催促、委員会）"><button type="button" class="btn s" id="gqClear"' + (GUIDE_Q ? '' : ' style="display:none"') + '>消す</button></div>' +
       '<div class="gchips">' + GUIDE_CHIPS.map(function(c){ return '<button type="button" class="chip' + (GUIDE_Q === c[1] ? ' on' : '') + '" data-gq="' + esc(c[1]) + '">' + esc(c[0]) + '</button>'; }).join('') + '</div>' +
       '<div class="muted" style="font-size:12px;margin-top:6px">見つからなければ「要望・不具合」タブに書いてください（マスターが返します）。各画面の見出し横の「？」を押すと、その画面の説明に絞って出ます</div></div>';
  if(!g.length) return h + '<div class="card"><div class="empty">' + (EXTRAS ? '表示できる項目がありません' : '読み込み中…') + '</div></div>';
  var terms = GUIDE_Q.trim().toLowerCase().split(/[\s　]+/).filter(Boolean);
  var hit = function(r){ if(!terms.length) return true; var t = ((r.a||'') + ' ' + (r.b||'') + ' ' + (r.c||'')).toLowerCase(); return terms.every(function(x){ return t.indexOf(x) >= 0; }); };
  var mark = function(t){ t = esc(t); if(!terms.length) return t; terms.forEach(function(x){ var re = new RegExp(x.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi'); t = t.replace(re, function(m){ return '<mark>' + m + '</mark>'; }); }); return t; };
  var link = function(u){ return /^https?:/.test(u) ? '<a href="' + esc(u) + '" target="_blank" rel="noopener" style="word-break:break-all">' + esc(u) + '</a>' : mark(u); };
  // 見出しごとにまとめる
  var secs = [], cur = null;
  g.forEach(function(r){ if(r.k === 'H'){ cur = { title: r.a, rows: [] }; secs.push(cur); return; } if(cur) cur.rows.push(r); });
  var total = 0;
  secs.forEach(function(sec, si){
    var rows = sec.rows.filter(function(r){ return terms.length ? (r.k === 'S' || r.k === 'T' || r.k === 'U' || r.k === 'N') && hit(r) : true; });
    var n = rows.filter(function(r){ return r.k === 'S' || r.k === 'T' || r.k === 'U'; }).length;
    if(terms.length && !rows.length) return;
    if(!terms.length && !n && !rows.some(function(r){ return r.k === 'N' || r.k === 'G' || r.k === 'R'; })) return;   // 表紙など中身のない見出しは出さない
    total += n;
    var isOpen = terms.length ? true : !!GUIDE_OPEN[si];
    h += '<div class="gsec"><button type="button" class="gsh" data-gs="' + si + '"><span>' + esc(sec.title) + '</span><small>' + n + '件</small><em>' + (isOpen ? '▲' : '▼') + '</em></button>';
    if(isOpen){
      h += '<div class="gbody">';
      rows.forEach(function(r){
        if(r.k === 'G') h += '<div class="gnote ok">' + esc(r.a) + '</div>';
        else if(r.k === 'R') h += '<div class="gnote ng">' + esc(r.a) + '</div>';
        else if(r.k === 'N') h += '<div class="gnote">' + mark(r.b || r.a) + '</div>';
        else if(r.k === 'U') h += '<div class="gitem"><b>' + mark(r.a) + '</b><div class="gurl">' + link(r.b) + ' <button type="button" class="btn s" data-copy="' + esc(r.b) + '">コピー</button></div>' + (r.c ? '<div class="gc">' + mark(r.c) + '</div>' : '') + '</div>';
        else if(r.k === 'S' || r.k === 'T') h += '<div class="gitem"><b>' + mark(r.a) + '</b><div class="gb">' + mark(r.b) + '</div>' + (r.c ? '<div class="gc">' + mark(r.c) + '</div>' : '') + '</div>';
        else if(r.b || r.a) h += '<div class="gnote plain">' + mark(r.b || r.a) + '</div>';
      });
      h += '</div>';
    }
    h += '</div>';
  });

/** 当日受付ページのURL：設定の「受付ページURL（外部）」→ このページが GitHub に置いてあれば同じ場所の reception.html → Apps Script のURL */
/** 発言記録ページのURL：このページが GitHub に置いてあれば同じ場所の speak.html、Apps Script なら ?speak=1 */
function spkPageUrl(id){
  var q = id ? 'id=' + encodeURIComponent(id) : '';
  if(/github\.io$/.test(location.hostname)) return location.href.replace(/[?#].*$/, '').replace(/[^\/]*$/, '') + 'speak.html' + (q ? '?' + q : '');
  return (D.webappUrl || '') + '?speak=1' + (q ? '&' + q : '');
}

function scenarioRead(){

  var KAN = ['〇','一','二','三','四','五','六','七','八','九','十','十一','十二','十三','十四','十五','十六','十七','十八','十九','二十','二十一','二十二','二十三','二十四','二十五'];
  var secs = Array.prototype.map.call(document.querySelectorAll('#scSecs .scrow'), function(r, i){

function openPrint(html){
  try {
    var url = URL.createObjectURL(new Blob([html], { type: 'text/html' }));
    var w = window.open(url, '_blank');
    if(!w){ var a = document.createElement('a'); a.href = url; a.target = '_blank'; a.rel = 'noopener'; document.body.appendChild(a); a.click(); a.remove(); }
    setTimeout(function(){ URL.revokeObjectURL(url); }, 60000);
  } catch(e){ toast('印刷ページを開けませんでした：' + e.message); }
}

    var s = z2h(line);
    var m = s.match(/(?:(\d{4})\s*[\/\-年.]\s*)?(\d{1,2})\s*[\/\-月.]\s*(\d{1,2})\s*日?/);

    if(y === null){ y = now.getFullYear(); if(new Date(y, mo - 1, d) < floor) y++; }

  });

function viewVenues(){
  var h = '<div class="bar"><h2>懇親会場（候補・利用履歴）</h2><input type="search" id="vq" placeholder="店名・エリア・メモで探す" value="' + esc(VEN_Q) + '"><select id="vSort" style="padding:8px 10px;border:1.5px solid var(--line);border-radius:8px"><option value="uses"' + (VEN_SORT==='uses'?' selected':'') + '>利用回数順</option><option value="last"' + (VEN_SORT==='last'?' selected':'') + '>最近使った順</option><option value="rating"' + (VEN_SORT==='rating'?' selected':'') + '>評価順</option><option value="name"' + (VEN_SORT==='name'?' selected':'') + '>店名順</option></select><button class="btn" id="vBulk">まとめて追加</button><button class="btn p" id="vAdd">＋ 候補を追加</button></div>';
  if(!VEN) return h + '<div class="card"><div class="empty">読み込み中…</div></div>';
  if(VEN.unlisted && VEN.unlisted.length) h += '<div class="card" style="padding:10px 16px;margin-bottom:10px;font-size:12.5px;border-left:4px solid var(--warn)"><b>会議マスタにあるがまだ候補に無い店：</b>' + VEN.unlisted.map(function(u){ return esc(u.name) + '（' + u.usage.length + '回）'; }).join('、') + '　<button class="btn s" id="vImport">候補に取り込む</button></div>';
  var q = VEN_Q.trim();
  var rows = VEN.venues.filter(function(v){ return !q || (v.name + v.area + v.memo + v.address).indexOf(q) >= 0; });
  rows.sort(function(a,b){ if(VEN_SORT==='uses') return b.uses - a.uses || (b.last||'').localeCompare(a.last||''); if(VEN_SORT==='last') return (b.last||'').localeCompare(a.last||''); if(VEN_SORT==='rating') return b.rating - a.rating; return a.name.localeCompare(b.name,'ja'); });
  h += '<p class="muted" style="font-size:12.5px;margin:0 0 10px">利用履歴は会議マスタの「懇親会場」に入れた店名から自動で拾います（店名は候補と同じ表記で）。会議の追加画面では、ここの店名が候補として出ます。</p>' +
    '<div style="background:#fff7e6;border-left:4px solid #e6a700;border-radius:8px;padding:8px 12px;margin:0 0 12px;font-size:12.5px;line-height:1.6"><b>URLの入れ方</b>：「URL（管理用）」はコース・金額が載ったページで構いません（管理ページでしか使いません）。閲覧ページの「お店のサイト」ボタンは、「公開URL」が空欄なら管理用URLから店のトップページを自動で出します（食べログ・ホットペッパー・ぐるなび・Rettyは店ページまで、ほかはサイトのトップ）。閲覧ページで押して変なところに飛ぶ店だけ、公開URLに店ページを入れてください。</div>';
  h += '<div class="card tbl"><table><thead><tr><th>店名</th><th>エリア</th><th>予算／人数／個室</th><th>評価</th><th>利用</th><th>メモ・感想／引継ぎ</th><th></th></tr></thead><tbody>';
  if(!rows.length) h += '<tr><td colspan="7" class="empty">候補がありません。「＋ 候補を追加」か「候補に取り込む」から</td></tr>';
  rows.forEach(function(v){
    h += '<tr><td class="name">' + esc(v.name) + (v.url ? ' <a href="' + esc(v.url) + '" target="_blank" rel="noopener" style="font-size:11.5px;font-weight:400">サイト</a>' : '') + (v.tel ? '<div class="muted" style="font-size:11.5px;font-weight:400">' + esc(v.tel) + '</div>' : '') + (v.address ? '<div class="muted" style="font-size:11.5px;font-weight:400;white-space:normal">' + esc(v.address) + '</div>' : '') + '</td>' +
      '<td>' + esc(v.area) + '</td>' +
      '<td style="font-size:12.5px">' + [v.budget, v.capacity, v.room ? '個室' + v.room : ''].filter(Boolean).map(esc).join('<br>') + '</td>' +
      '<td style="white-space:nowrap;color:#e0a100">' + stars(v.rating) + '</td>' +
      '<td style="font-size:12px;white-space:normal;min-width:140px">' + (v.uses ? '<b>' + v.uses + '回</b><div class="muted">' + v.usage.slice(0,3).map(function(u){ return esc(fmtD(u.date)) + ' ' + esc(u.meeting); }).join('<br>') + (v.usage.length > 3 ? '<br>…' : '') + '</div>' : '<span class="muted">未利用（候補）</span>') + '</td>' +
      '<td style="white-space:normal;max-width:320px;font-size:12.5px">' + esc(v.memo).replace(/\n/g,'<br>') + (v.handover ? '<div style="margin-top:4px;padding:4px 8px;background:var(--warn-soft);border-radius:6px"><b>引継ぎ：</b>' + esc(v.handover).replace(/\n/g,'<br>') + '</div>' : '') + '</td>' +
      '<td style="white-space:nowrap"><button class="btn s" data-vedit="' + v._row + '">編集</button> <button class="btn s d" data-vdel="' + v._row + '">削除</button></td></tr>';
  });
  return h + '</tbody></table></div>';
}
function venueForm(v){
  v = v || {};
  var f = function(label, key, extra){ return '<div class="f' + (extra&&extra.wide?' wide':'') + '"><label>' + label + '</label><input id="v_' + key + '" value="' + esc(v[key]||'') + '"' + (extra&&extra.ph?' placeholder="'+esc(extra.ph)+'"':'') + '></div>'; };
  showModal('<div class="mh"><h3>' + (v._row ? '候補を編集' : '候補を追加') + '</h3><button class="btn s" id="mClose">閉じる</button></div><div class="err" id="mErr"></div><div class="mb">' +
    f('店名', 'name', {ph:'例：創作焼肉 牛の匠', wide:true}) +
    f('エリア', 'area', {ph:'例：高松・瓦町'}) + f('電話', 'tel') +
    f('住所', 'address', {wide:true}) + f('URL（管理用：コース・金額のページ可）', 'url', {wide:true}) + f('公開URL（閲覧ページの「お店のサイト」に使う。空欄なら管理用URLから店のトップページを自動で出す）', 'publicUrl', {wide:true, ph:'例：https://tabelog.com/kagawa/.../12345678/（金額の出ないページ）'}) +
    f('予算目安', 'budget', {ph:'例：5,000円／人'}) + f('人数目安', 'capacity', {ph:'例：20〜40名'}) +
    '<div class="f"><label>個室</label><select id="v_room"><option value="">不明</option><option' + (v.room==='有'?' selected':'') + '>有</option><option' + (v.room==='無'?' selected':'') + '>無</option></select></div>' +
    '<div class="f"><label>評価</label><select id="v_rating"><option value="">—</option>' + [1,2,3,4,5].map(function(n){ return '<option value="' + n + '"' + (v.rating==n?' selected':'') + '>' + '★'.repeat(n) + '</option>'; }).join('') + '</select></div>' +
    '<div class="f wide"><label>メモ・感想（料理、雰囲気、注意点など）</label><textarea id="v_memo" style="min-height:80px">' + esc(v.memo||'') + '</textarea></div>' +
    '<div class="f wide"><label>引継ぎ（次年度へ：予約の取り方、担当者、値段交渉、良かった点・困った点）</label><textarea id="v_handover" style="min-height:80px">' + esc(v.handover||'') + '</textarea></div></div>' +

  document.getElementById('mSave').onclick = function(){
    busy(true);

    api().withSuccessHandler(function(r){ busy(false); VEN = r; D.venues = r.venues.map(function(x){ return x.name; }); D.venueList = r.venues.map(function(x){ return { name: x.name, area: x.area, address: x.address, tel: x.tel, url: x.url, publicUrl: x.publicUrl, budget: x.budget, capacity: x.capacity, rating: x.rating, memo: x.memo, uses: x.uses, last: x.last }; }); closeModal(true); rerender('venues', viewVenues); toast('保存しました'); }).withFailureHandler(function(e){ busy(false); showErr(e.message); }).adminVenueSave(TOKEN, data);
  };
}
function venueBulkForm(){

      .withFailureHandler(function(e){ busy(false); showErr(e.message); })
      .adminVenueBulk(TOKEN, document.getElementById('vb_text').value, { area: document.getElementById('vb_area').value, budget: document.getElementById('vb_budget').value, memo: document.getElementById('vb_memo').value, handover: document.getElementById('vb_handover').value });
  };

function bindVenues(){
  var vb = document.getElementById('vBulk'); if(vb) vb.onclick = venueBulkForm;
  var q = document.getElementById('vq'); if(q) q.oninput = function(){ VEN_Q = q.value; rerender('venues', viewVenues); var q2 = document.getElementById('vq'); q2.focus(); q2.setSelectionRange(q2.value.length, q2.value.length); };
  var so = document.getElementById('vSort'); if(so) so.onchange = function(){ VEN_SORT = so.value; rerender('venues', viewVenues); };
  var a = document.getElementById('vAdd'); if(a) a.onclick = function(){ venueForm(null); };
  var im = document.getElementById('vImport'); if(im) im.onclick = function(){ im.disabled = true; api().withSuccessHandler(function(r){ VEN = r; D.venues = r.venues.map(function(x){ return x.name; }); D.venueList = r.venues.map(function(x){ return { name: x.name, area: x.area, address: x.address, tel: x.tel, url: x.url, publicUrl: x.publicUrl, budget: x.budget, capacity: x.capacity, rating: x.rating, memo: x.memo, uses: x.uses, last: x.last }; }); rerender('venues', viewVenues); toast('取り込みました'); }).withFailureHandler(function(e){ im.disabled = false; toast('エラー：' + e.message); }).adminVenueImport(TOKEN); };
  Array.prototype.forEach.call(document.querySelectorAll('[data-vedit]'), function(b){ b.onclick = function(){ venueForm(VEN.venues.filter(function(x){ return x._row == b.dataset.vedit; })[0]); }; });
  Array.prototype.forEach.call(document.querySelectorAll('[data-vdel]'), function(b){ b.onclick = function(){ confirmBox('この候補を削除しますか？', '候補リストから消すだけで、会議マスタの記録は残ります。', function(){ busy(true); api().withSuccessHandler(function(r){ busy(false); closeModal(true); VEN = r; D.venues = r.venues.map(function(x){ return x.name; }); D.venueList = r.venues.map(function(x){ return { name: x.name, area: x.area, address: x.address, tel: x.tel, url: x.url, publicUrl: x.publicUrl, budget: x.budget, capacity: x.capacity, rating: x.rating, memo: x.memo, uses: x.uses, last: x.last }; }); rerender('venues', viewVenues); }).withFailureHandler(function(e){ busy(false); showErr(e.message); }).adminVenueDelete(TOKEN, b.dataset.vdel); }, true); }; });
}

/* ---------- プロジェクト（小委員会・事業ごとの専用ページ） ---------- */
var PRJ = null, PRJ_DONE = false;
function projectNames(){ var reg = (D.projects || []).filter(function(p){ return p.state !== '終了'; }).map(function(p){ return p.name; }); var used = (D.meetings || []).map(function(x){ return String(x['プロジェクト']||'').trim(); }); return reg.concat(used).filter(function(v,i,a){ return v && a.indexOf(v)===i; }); }
function loadProjects(){ api().withSuccessHandler(function(r){ PRJ = r; D.projects = r.projects.map(function(p){ return { name: p.name, leader: p.leader, state: p.state }; }); rerender('projects', viewProjects); }).withFailureHandler(function(e){ toast('エラー：' + e.message); }).adminProjects(TOKEN); }
function viewProjects(){
  var h = '<div class="bar"><h2>プロジェクト <span class="helpq" data-hq="プロジェクト">?</span></h2><button class="btn p" id="pjAdd">＋ プロジェクトを追加</button></div>' +
    '<div class="muted" style="font-size:13px;margin:-4px 0 12px">小委員会や事業（例：○○小委員会）ごとに、会議と日程調整をまとめて見られるようにします。<br>登録すると、その小委員会専用のページURLができます（いつもの出欠ページと同じものが、その小委員会の予定を上にして開きます）。メンバーにはそのURLを送るだけ。会議や日程調整を作るときは、同じプロジェクト名を選んでください。</div>';
  if(!PRJ) return h + '<div class="card"><div class="empty">読み込み中…</div></div>';
  var list = PRJ.projects.filter(function(p){ return PRJ_DONE ? true : p.state !== '終了'; });
  var doneN = PRJ.projects.filter(function(p){ return p.state === '終了'; }).length;
  h += '<div class="card tbl"><table><thead><tr><th>プロジェクト</th><th>リーダー</th><th>予定</th><th>専用のページURL</th><th></th></tr></thead><tbody>' +
    (list.length ? list.map(function(p){
      return '<tr' + (p.state === '終了' ? ' style="opacity:.6"' : '') + '><td class="name">📁 ' + esc(p.name) + (p.state === '終了' ? ' <span class="tag">終了' + (p.end ? ' ' + esc(fmtD(p.end)) : '') + '</span>' : ' <span class="tag g">進行中</span>') + (p.memo ? '<div class="muted" style="font-size:12px;font-weight:400;white-space:normal">' + esc(p.memo) + '</div>' : '') + '</td>' +
        '<td>' + esc(p.leader || '—') + '</td>' +
        '<td style="white-space:nowrap">会議 ' + p.meetings + '（今後 ' + p.upcoming + '）<br><span class="muted" style="font-size:12px">日程調整 ' + p.polls + '</span></td>' +
        '<td><input readonly value="' + esc(p.url) + '" style="width:100%;min-width:160px;padding:6px 8px;border:1px solid var(--line);border-radius:6px;font-size:11.5px;font-family:monospace" onclick="this.select()"></td>' +
        '<td style="white-space:nowrap"><a class="btn s" href="' + esc(p.url) + '" target="_blank" rel="noopener">開く ↗</a> <button class="btn s" data-copy="' + esc(p.url) + '">コピー</button> <button class="btn s" data-pjedit="' + p._row + '">編集</button></td></tr>';
    }).join('') : '<tr><td colspan="5" class="empty">まだありません。「＋ プロジェクトを追加」から</td></tr>') +
    '</tbody></table></div>';
  if(doneN) h += '<div style="margin-top:8px"><button class="btn s" id="pjDone">' + (PRJ_DONE ? '終了したものを隠す' : '終了したものも表示（' + doneN + '）') + '</button></div>';
  if(PRJ.unlisted && PRJ.unlisted.length) h += '<div class="card" style="margin-top:12px;border-color:#efd88a;background:#fff8e5"><b style="font-size:13px">会議・日程調整に書かれているが未登録のプロジェクト名</b><div class="muted" style="font-size:12.5px;margin:4px 0 8px">登録すると専用のページURLができ、出欠ページで切り替えられるようになります（名前はそのまま使えます）</div>' + PRJ.unlisted.map(function(n){ return '<button class="btn s" data-pjnew="' + esc(n) + '" style="margin:0 6px 6px 0">＋ ' + esc(n) + ' を登録</button>'; }).join('') + '</div>';
  return h;
}
function projectForm(p){
  p = p || {};
  showModal('<div class="mh"><h3>' + (p._row ? 'プロジェクトを編集' : 'プロジェクトを追加') + '</h3><button class="btn s" id="mClose">閉じる</button></div><div class="err" id="mErr"></div><div class="mb">' +
    '<div class="f wide"><label>プロジェクト名</label><input id="pj_name" value="' + esc(p.name || '') + '" placeholder="例：ASPAC小委員会／シニア合同例会"><div class="hint">会議・日程調整の「プロジェクト名」と同じ名前でつながります。短く分かりやすく（& = ? # / は使えません）</div></div>' +
    '<div class="f"><label>リーダー</label><input id="pj_leader" list="pjLeaderList" value="' + esc(p.leader || '') + '" placeholder="名簿の氏名"><datalist id="pjLeaderList">' + (D.members||[]).map(function(m){ return '<option value="' + esc(m['氏名']) + '">'; }).join('') + '</datalist><div class="hint">出欠ページの上に「リーダー：○○」と出ます</div></div>' +
    '<div class="f"><label>状態</label><div class="seg" id="pj_state">' + ['進行中','終了'].map(function(v){ return '<button type="button" data-v="' + v + '" aria-pressed="' + ((p.state || '進行中') === v) + '">' + v + '</button>'; }).join('') + '</div><div class="hint">終了にすると一覧や出欠ページから消えます（記録は残ります）</div></div>' +

    '<div class="f wide"><label>振り返り（次年度への引継ぎ）</label><textarea id="pj_review" style="min-height:70px" placeholder="うまくいった点・困った点・来年やるなら">' + esc(p.review || '') + '</textarea></div>' +
    '</div><div class="mf">' + (p._row ? '<button class="btn" id="pjDel" style="color:var(--ng);margin-right:auto">削除</button>' : '') + '<button class="btn" id="mCancel">キャンセル</button><button class="btn p" id="mSave">保存</button></div>');
  var segBtns = document.querySelectorAll('#pj_state button');
  Array.prototype.forEach.call(segBtns, function(b){ b.onclick = function(){ Array.prototype.forEach.call(segBtns, function(x){ x.setAttribute('aria-pressed', x === b ? 'true' : 'false'); }); }; });
  document.getElementById('mSave').onclick = function(){
    var st = document.querySelector('#pj_state button[aria-pressed=true]');
    var data = { _row: p._row || 0, name: document.getElementById('pj_name').value, leader: document.getElementById('pj_leader').value, state: st ? st.dataset.v : '進行中', memo: document.getElementById('pj_memo').value, review: document.getElementById('pj_review').value, end: p.end || '' };
    if(!data.name.trim()) return showErr('プロジェクト名を入れてください');
    busy(true);
    api().withSuccessHandler(function(r){ busy(false); PRJ = r; D.projects = r.projects.map(function(x){ return { name: x.name, leader: x.leader, state: x.state }; }); closeModal(true); rerender('projects', viewProjects); toast('保存しました'); }).withFailureHandler(function(e){ busy(false); showErr(e.message); }).adminProjectSave(TOKEN, data);
  };
  var del = document.getElementById('pjDel'); if(del) del.onclick = function(){ confirmBox('削除しますか？', '登録を消すだけで、会議・日程調整の記録は残ります。終わっただけなら「状態：終了」の方をおすすめします。', function(){ busy(true); api().withSuccessHandler(function(r){ busy(false); PRJ = r; D.projects = r.projects.map(function(x){ return { name: x.name, leader: x.leader, state: x.state }; }); closeModal(true); rerender('projects', viewProjects); toast('削除しました'); }).withFailureHandler(function(e){ busy(false); showErr(e.message); }).adminProjectDelete(TOKEN, p._row); }, true); };
}
function bindProjects(){
  var a = document.getElementById('pjAdd'); if(a) a.onclick = function(){ projectForm(null); };
  var dn = document.getElementById('pjDone'); if(dn) dn.onclick = function(){ PRJ_DONE = !PRJ_DONE; rerender('projects', viewProjects); };
  Array.prototype.forEach.call(document.querySelectorAll('[data-pjedit]'), function(b){ b.onclick = function(){ projectForm(PRJ.projects.filter(function(x){ return x._row == b.dataset.pjedit; })[0]); }; });
  Array.prototype.forEach.call(document.querySelectorAll('[data-pjnew]'), function(b){ b.onclick = function(){ projectForm({ name: b.dataset.pjnew }); }; });
}

/* ---------- 要望・不具合（管理者・スタッフ投稿／マスター回答） ---------- */

function viewFeedback(){
  var h = '<div class="bar"><h2>要望・不具合</h2><label style="font-size:13px;display:flex;gap:6px;align-items:center"><input type="checkbox" id="fbDone"' + (FB_SHOW_DONE?' checked':'') + '>対応済・見送りも表示</label><button class="btn p" id="fbAdd">＋ 書く</button></div>';
  h += '<div class="card" style="padding:10px 16px;margin-bottom:10px;font-size:12.5px;border-left:4px solid var(--blue)">使っていて困ったこと・直してほしいこと・質問はここに。<b>どの画面で／何が起きたか／どうしてほしいか</b>を書くと直しやすいです。マスターが状態（受付→検討中→対応済／見送り）と回答を返します。口頭やLINEだと流れてしまうので、小さなことでもここへ。</div>';
  if(!FB) return h + '<div class="card"><div class="empty">読み込み中…</div></div>';
  var tagOf = function(s){ return s==='対応済' ? 'g' : s==='検討中' ? 'y' : s==='見送り' ? '' : 'r'; };
  var rows = FB.items.filter(function(x){ return FB_SHOW_DONE || (x.state!=='対応済' && x.state!=='見送り'); });
  h += '<div class="card tbl"><table><thead><tr><th>日時</th><th>投稿者</th><th>区分</th><th>画面</th><th>内容</th><th>状態</th><th>マスター回答</th>' + (FB.isMaster ? '<th></th>' : '') + '</tr></thead><tbody>' +
    (rows.length ? rows.map(function(x){ return '<tr><td class="muted" style="font-size:12px">' + esc(x.at) + '</td><td>' + esc(x.who) + '</td><td><span class="tag b">' + esc(x.kind) + '</span></td><td class="muted">' + esc(x.screen) + '</td><td style="white-space:normal;min-width:260px">' + esc(x.body).replace(/\n/g,'<br>') + '</td><td><span class="tag ' + tagOf(x.state) + '">' + esc(x.state) + '</span></td><td style="white-space:normal;min-width:200px;font-size:13px">' + esc(x.reply).replace(/\n/g,'<br>') + (x.reply ? '<div class="muted" style="font-size:11px">' + esc(fmtD(x.updated)) + '</div>' : '') + '</td>' + (FB.isMaster ? '<td><button class="btn s" data-fbed="' + x._row + '">回答</button></td>' : '') + '</tr>'; }).join('') : '<tr><td colspan="8" class="empty">まだありません</td></tr>') + '</tbody></table></div>';
  return h;
}
function feedbackForm(){
  var opts = function(list, sel){ return list.map(function(v){ return '<option' + (v===sel?' selected':'') + '>' + esc(v) + '</option>'; }).join(''); };
  var screens = ['会議','名簿','会議種別','案内・メール','出席確認名簿','懇親会場','受付・集金','予算','出席状況','当日受付ページ','回答ページ','閲覧ページ','その他'];
  showModal('<div class="mh"><h3>要望・不具合を書く</h3><button class="btn s" id="mClose">閉じる</button></div><div class="err" id="mErr"></div><div class="mb">' +
    '<div class="f"><label>区分</label><select id="fb_kind">' + opts(FB.kinds, '要望') + '</select></div>' +
    '<div class="f"><label>画面</label><select id="fb_screen">' + opts(screens, 'その他') + '</select></div>' +
    '<div class="f wide"><label>内容（何が起きた／どうしてほしい）</label><textarea id="fb_body" style="min-height:120px" placeholder="例：当日受付で、欠席の人を出席にしたとき会議費が0のままだった。自動で金額が入ってほしい"></textarea></div></div>' +
    '<div class="mf"><button class="btn" id="mCancel">キャンセル</button><button class="btn p" id="mSave">送る</button></div>');
  document.getElementById('fb_body').focus();
  document.getElementById('mSave').onclick = function(){
    busy(true);
    api().withSuccessHandler(function(r){ busy(false); FB = r; closeModal(true); rerender('feedback', viewFeedback); toast('送りました。ありがとうございます'); }).withFailureHandler(function(e){ busy(false); showErr(e.message); })
      .adminFeedbackPost(TOKEN, { kind: document.getElementById('fb_kind').value, screen: document.getElementById('fb_screen').value, body: document.getElementById('fb_body').value });
  };
}
function feedbackReply(x){
  var opts = function(list, sel){ return list.map(function(v){ return '<option' + (v===sel?' selected':'') + '>' + esc(v) + '</option>'; }).join(''); };
  showModal('<div class="mh"><h3>回答・状態を更新</h3><button class="btn s" id="mClose">閉じる</button></div><div class="err" id="mErr"></div><div class="mb">' +
    '<div class="f wide"><label>投稿（' + esc(x.who) + '・' + esc(x.at) + '）</label><div style="padding:10px 12px;background:var(--bg);border-radius:8px;white-space:pre-wrap">' + esc(x.body) + '</div></div>' +
    '<div class="f"><label>状態</label><select id="fb_state">' + opts(FB.states, x.state || '受付') + '</select></div>' +
    '<div class="f wide"><label>マスター回答</label><textarea id="fb_reply" style="min-height:100px">' + esc(x.reply||'') + '</textarea></div></div>' +
    '<div class="mf"><button class="btn" id="mCancel">キャンセル</button><button class="btn p" id="mSave">保存</button></div>');
  document.getElementById('mSave').onclick = function(){
    busy(true);
    api().withSuccessHandler(function(r){ busy(false); FB = r; closeModal(true); rerender('feedback', viewFeedback); toast('更新しました'); }).withFailureHandler(function(e){ busy(false); showErr(e.message); })
      .adminFeedbackUpdate(TOKEN, x._row, document.getElementById('fb_state').value, document.getElementById('fb_reply').value);
  };
}
function bindFeedback(){
  var a = document.getElementById('fbAdd'); if(a) a.onclick = function(){ if(!FB) return toast('読み込み中です'); feedbackForm(); };
  var d = document.getElementById('fbDone'); if(d) d.onchange = function(){ FB_SHOW_DONE = d.checked; rerender('feedback', viewFeedback); };
  Array.prototype.forEach.call(document.querySelectorAll('[data-fbed]'), function(b){ b.onclick = function(){ feedbackReply(FB.items.filter(function(x){ return x._row == b.dataset.fbed; })[0]); }; });
}

function viewMinutes(){

  var h = '<div class="bar"><h2>議事録の作り方</h2>' + (folder ? '<a class="btn p" href="' + esc(folder) + '" target="_blank" rel="noopener" style="text-decoration:none">スキルZIP・使い方を開く（Drive）</a>' : '') + '</div>';
  h += '<p class="muted" style="margin:0 0 10px;font-size:13px">会議の録音と簡単なメモを渡すだけで、決まった書式の議事録（Word）を Claude が作ります。無料プランで使えます。' + (D.isAdmin ? '出す種類は設定「議事録の種類」で変えられます。' : '') + '</p>';
  // 種類の切り替え（ブロックのシートでは ブロック／委員会／小委員会 すべて、委員会のシートでは 委員会／小委員会）
  // 出す種類は設定「議事録の種類」（カンマ区切り：ブロック,LOM,委員会,小委員会）。空なら組織区分から
  var allow = String(D.settings['議事録の種類'] || '').split(/[,、，\s]+/).filter(Boolean);
  var kinds = Object.keys(MIN_KINDS).filter(function(k){ return allow.length ? allow.indexOf(MIN_KINDS[k].key) >= 0 : (isCom ? (k === 'committee' || k === 'sub') : k === 'block'); });
  if(!kinds.length) kinds = isCom ? ['committee','sub'] : ['block'];
  if(kinds.indexOf(MIN_KIND) < 0) MIN_KIND = kinds[0];

  // 資料をまとめる
  h += '<div class="card" style="padding:14px 18px;margin-bottom:10px"><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><b>この会議の資料をまとめる</b>' + meetingSelect('minSel', MIN_ID || (D.meetings[0] ? D.meetings[0]['会議ID'] : '')) + '<button class="btn p" id="minPack">まとめる</button></div>' +

    (MIN_PACK ? '<div style="margin-top:10px"><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:6px"><span class="tag b">' + esc(MIN_PACK.meeting) + '</span><span class="muted" style="font-size:12px">おすすめの種類：' + esc(MIN_KINDS[MIN_PACK.kind] ? MIN_KINDS[MIN_PACK.kind].label : '') + '</span><button class="btn s" data-copy="' + esc(MIN_PACK.text) + '">全文コピー</button></div><textarea readonly style="width:100%;min-height:220px;font-size:12.5px;line-height:1.6;font-family:ui-monospace,Menlo,monospace" onclick="this.select()">' + esc(MIN_PACK.text) + '</textarea></div>' : '') + '</div>';

    '<b>【要確認：…】が残っている議事録は未完成</b>。AI が聞き取れなかった・推測した箇所なので、録音を聞き直して直し、【要確認】を消す。【要確認】がなくても録音から作った部分はざっと読む（AI の議事録は下書き）。氏名・序列は名簿のものを使う。<b>ZIP に名簿が入っている場合は関係者以外に渡さない</b>。');

  return h;
}
function bindMinutes(){
  Array.prototype.forEach.call(document.querySelectorAll('[data-mk]'), function(b){ b.onclick = function(){ MIN_KIND = b.dataset.mk; rerender('minutes', viewMinutes); }; });

function viewSettings(){

  var defOf = {}; SETTING_DEFS.forEach(function(d){ defOf[d[0]] = d; });
  var field = function(d){
    var v = s[d[0]] == null ? '' : String(s[d[0]]);
    var input;
    if(d[1].indexOf('select:') === 0){
      var opts = d[1].slice(7).split(',');
      if(opts.length <= 4) input = '<div class="seg">' + opts.map(function(o){ return '<label class="' + (o===v?'on':'') + '"><input type="radio" name="sk_' + esc(d[0]) + '" value="' + esc(o) + '"' + (o===v?' checked':'') + ' data-skey="' + esc(d[0]) + '">' + esc(o) + '</label>'; }).join('') + '</div>';
      else input = '<select data-skey="' + esc(d[0]) + '">' + opts.map(function(o){ return '<option' + (o===v?' selected':'') + '>' + esc(o) + '</option>'; }).join('') + '</select>';
    } else if(d[1] === 'multi'){
      var cur = v.split(/[,、，\s]+/).filter(Boolean), opts2 = d[3] || [];
      input = '<div class="seg multi" data-mkey="' + esc(d[0]) + '">' + opts2.map(function(o){ return '<label class="' + (cur.indexOf(o)>=0?'on':'') + '"><input type="checkbox" value="' + esc(o) + '"' + (cur.indexOf(o)>=0?' checked':'') + '>' + esc(o) + '</label>'; }).join('') + '</div><input type="hidden" data-skey="' + esc(d[0]) + '" value="' + esc(v) + '">';
    } else if(d[1] === 'textarea'){ input = '<textarea data-skey="' + esc(d[0]) + '" rows="' + Math.min(12, Math.max(4, v.split('\n').length + 1)) + '" style="width:100%;font:inherit;font-size:13px;line-height:1.5">' + esc(v) + '</textarea>';
    } else input = '<input data-skey="' + esc(d[0]) + '" type="' + d[1] + '" value="' + esc(v) + '">';
    return '<div class="f sf"><label>' + esc(d[0]) + '</label>' + input + '<div class="hint">' + esc(d[2]) + '</div></div>';
  };
  var used = {};
  SET_GROUPS.forEach(function(g){
    var defs = g.keys.map(function(k){ used[k] = true; return defOf[k]; }).filter(Boolean);
    if(!defs.length) return;
    var open = SET_OPEN[g.id] != null ? SET_OPEN[g.id] : !g.closed;
    h += '<div class="sgrp' + (open ? ' open' : '') + '"><button type="button" class="sgh" data-sg="' + g.id + '"><span><b>' + esc(g.title) + '</b><small>' + esc(g.hint) + '</small></span><em>' + (open ? '▲' : '▼') + '</em></button>' +
         (open ? '<div class="sgb">' + defs.map(field).join('') + '</div>' : '<div class="sgb" style="display:none">' + defs.map(field).join('') + '</div>') + '</div>';
  });
  // 定義にあるがグループ未割当、またはシートで追加されたキー
  var rest = SETTING_DEFS.filter(function(d){ return !used[d[0]]; }).map(field).join('');
  Object.keys(s).forEach(function(k){ if(defOf[k] || k === '会議種別') return; rest += '<div class="f sf"><label>' + esc(k) + '</label><input data-skey="' + esc(k) + '" value="' + esc(s[k]) + '"><div class="hint">シートで追加された項目</div></div>'; });
  if(rest) h += '<div class="sgrp open"><div class="sgh"><span><b>その他</b></span></div><div class="sgb">' + rest + '</div></div>';
  h += '<div class="card" style="padding:12px 16px;margin-top:10px;font-size:13px">会議種別・カウント区分（出席率の枠）は「会議種別」タブで。<button class="btn s" id="sGoTypes">会議種別タブを開く</button></div>';
  h += '<div class="mf" style="padding:14px 0"><button class="btn p" id="sSave2">保存</button></div>';
  return h;
}
function bindSettings(){
  Array.prototype.forEach.call(document.querySelectorAll('[data-sg]'), function(b){ b.onclick = function(){ var g = b.dataset.sg; var grp = b.closest('.sgrp'); var open = !grp.classList.contains('open'); SET_OPEN[g] = open; grp.classList.toggle('open', open); grp.querySelector('.sgb').style.display = open ? '' : 'none'; b.querySelector('em').textContent = open ? '▲' : '▼'; }; });
  Array.prototype.forEach.call(document.querySelectorAll('.seg input[type=radio]'), function(r){ r.onchange = function(){ var seg = r.closest('.seg'); Array.prototype.forEach.call(seg.querySelectorAll('label'), function(l){ l.classList.toggle('on', l.querySelector('input').checked); }); }; });
  Array.prototype.forEach.call(document.querySelectorAll('.seg.multi input[type=checkbox]'), function(c){ c.onchange = function(){ var seg = c.closest('.seg'); Array.prototype.forEach.call(seg.querySelectorAll('label'), function(l){ l.classList.toggle('on', l.querySelector('input').checked); }); var vals = Array.prototype.filter.call(seg.querySelectorAll('input'), function(i){ return i.checked; }).map(function(i){ return i.value; }); var hid = seg.parentNode.querySelector('input[type=hidden][data-skey="' + seg.dataset.mkey + '"]'); if(hid) hid.value = vals.join(','); }; });
  var save = function(){
    var obj = {};
    Array.prototype.forEach.call(document.querySelectorAll('[data-skey]'), function(el){ if(el.type === 'radio'){ if(el.checked) obj[el.dataset.skey] = el.value; } else obj[el.dataset.skey] = el.value; });
    confirmBox('設定を保存しますか？', '団体名・案内文・自動更新などの基本設定が全ページに反映されます。WebアプリURL・フォーム編集URL を変えると受付・回答ページのリンク先が変わるので、通常は触りません。', function(){
      busy(true);
      api().withSuccessHandler(function(r){ busy(false); closeModal(true); D.settings = r.settings; toast('保存しました'); render(); }).withFailureHandler(function(e){ busy(false); showErr(e.message); }).adminSaveSettings(TOKEN, obj);
    });
  };
  var b = document.getElementById('sSave'); if(b) b.onclick = save;
  var b2 = document.getElementById('sSave2'); if(b2) b2.onclick = save;
  var g = document.getElementById('sGoTypes'); if(g) g.onclick = function(){ TAB = 'types'; render(); };
}

    '<div id="owlMiniBar"><div id="owlMiniTx"></div><button type="button" id="owlMiniNext">できた・次へ</button><button type="button" id="owlMiniNx" style="display:none;background:var(--blue);border-color:var(--blue);color:#fff;max-width:46%;white-space:normal;line-height:1.3;padding:4px 10px"></button><button type="button" id="owlMiniOff">くわしく</button><button type="button" id="owlMiniClose" style="display:none">閉じる</button></div>';
  document.body.appendChild(b); document.body.appendChild(tip); document.body.appendChild(p);
  b.onclick = function(){ tip.classList.remove('on'); var qi = b.querySelector('i'); if(qi) qi.style.animation = 'none'; if(p.classList.contains('mini')) return owlMini(false); if(p.classList.contains('on')) return owlClose(); p.classList.add('on'); document.body.classList.add('owlopen'); owlHome(); };
  document.getElementById('owlX').onclick = owlClose;
  document.getElementById('owlMiniNext').onclick = function(){ owlWalkGo(1); };
  document.getElementById('owlMiniOff').onclick = function(){ owlMini(false); };
  document.getElementById('owlMiniClose').onclick = owlClose;
  document.getElementById('owlAskBtn').onclick = owlAsk;
  document.getElementById('owlIn').onkeydown = function(e){ if(e.key === 'Enter' && !e.isComposing) owlAsk(); };
  tip.onclick = function(){ b.click(); };
  setTimeout(function(){ if(!p.classList.contains('on') && window.pageYOffset <= 120) tip.classList.add('on'); }, 1500); setTimeout(function(){ tip.classList.remove('on'); }, 12000);
  window.addEventListener('scroll', function(){ if(window.pageYOffset > 120) tip.classList.remove('on'); }, { passive: true });   // 読み進めたら、ひとことは引っ込める（下のボタンに重ならないように）
}
</script>
</body>
</html>
