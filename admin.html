  // 上段：会議を選ぶ ＋ 「出席確認名簿／会議シナリオ」の切り替え（どちらを見ているか一目で分かるように）
  var h = '<div class="bar"><h2>' + (SC_OPEN ? '会議シナリオ' : '出席確認名簿') + '</h2>' + meetingSelect('rcSel', RC_ID) + '</div>' +
    '<div class="modesw"><button type="button" class="' + (SC_OPEN ? '' : 'on') + '" id="modeRc">📋 出席確認名簿<small>読み上げ・受付用の名簿</small></button><button type="button" class="' + (SC_OPEN ? 'on' : '') + '" id="rcScenario">🎤 会議シナリオ<small>司会の台本</small></button></div>';
  var rcM = D.meetings.filter(function(x){ return x['会議ID'] === RC_ID; })[0];
  if(rcM && memoLines(rcM['運営メモ']).length) h += memoBlock(rcM, false).replace('margin-top:9px', 'margin:0 0 10px');
  if(SC_OPEN) return h + viewScenario();
  h += '<div class="card" style="padding:10px 14px;margin-bottom:10px;display:flex;gap:6px;flex-wrap:wrap;align-items:center"><b style="font-size:13px;margin-right:4px">名簿：</b><button class="btn p" id="rcLoad">名簿を表示</button><button class="btn" id="rcPrint">名簿を印刷</button>' + (D.isAdmin ? '<button class="btn" id="rcSheet">名簿をシートに作る</button>' : '') + '</div>';
  if(!RC) return h + '<div class="card"><div class="empty">会議を選んで「名簿を表示」を押してください（読み上げ・印刷用。金額は出ません）</div></div>';
  var st = RC.stats;
  h += '<div id="rcPaper" class="card" style="padding:18px 22px">' +
    '<div style="font-size:12px;color:var(--sub)">' + esc(RC.title) + '</div>' +
    '<div style="font-size:17px;font-weight:900;margin:2px 0 4px">' + esc(RC.meeting) + '　出席確認名簿' + (RC.rule ? '　<span style="font-weight:400;font-size:13px;color:var(--sub)">（' + esc(RC.rule) + '）</span>' : '') + '</div>' +
    '<div style="font-size:13px;color:var(--sub);margin-bottom:8px">' + esc(RC.date) + ' ' + esc(RC.time) + '～　' + esc(RC.place) + '</div>' +
    '<div style="font-size:13px;margin-bottom:12px;padding:8px 12px;background:var(--bg);border-radius:8px">出席者数（' + st.total + '名中　出席予定 <b>' + st.comes + '</b>名／受付済 <b>' + st.got + '</b>名）　欠席 ' + st.absent + '　未定 ' + st.pending + '　未回答 ' + st.noreply +
      (RC.showVote ? '<br>' + (RC.isKaigisho ? '出席会員会議所（' + st.lomAll + 'LOM中 <b>' + st.lomCome + '</b>LOM）　' : '') + esc(RC.voteLabel||'議決権者') + '（' + st.votersAll + '名中 <b>' + st.votersCome + '</b>名／<b>定足数 ' + st.quorum + '名</b>＝3分の2）' + (st.votersCome >= st.quorum ? ' <span class="tag g">成立見込み</span>' : ' <span class="tag r">不足</span>') : '') + '</div>' +
    '<div class="tbl compact"><table style="font-size:13px"><thead><tr><th style="width:36px">No</th><th>役職</th><th>氏名</th><th>ふりがな</th><th>LOM</th><th style="text-align:center">回答</th><th style="text-align:center">受付</th></tr></thead><tbody>' +
    RC.rows.map(function(r){ var bg = r.ans==='欠席' ? 'background:var(--ng-soft)' : r.ans==='未回答' ? 'background:var(--warn-soft)' : r.ans==='未定' ? 'background:var(--pend-soft, #e8f1fb)' : ''; return '<tr style="' + bg + '"><td style="text-align:center;color:var(--sub)">' + r.no + '</td><td style="white-space:normal">' + esc(r.role) + '</td><td style="font-weight:900;font-size:15px">' + esc(r.name) + '</td><td class="muted">' + esc(r.kana) + '</td><td>' + esc(r.lom) + '</td><td style="text-align:center;white-space:normal">' + esc(r.ans) + '</td><td style="text-align:center;font-size:16px">' + (r.got ? '✓' : '') + '</td></tr>'; }).join('') +
    '</tbody></table></div>' +
    (RC.script ? '<div style="margin-top:14px"><div style="display:flex;align-items:center;gap:10px;margin-bottom:6px;flex-wrap:wrap"><b style="white-space:nowrap">読み上げ文</b><span class="muted" style="font-size:12px;flex:1 1 200px">欠席・未定・未回答の人はグループごとに「○○君は欠席のご連絡をいただいております」と続けて読む。最後に「' + esc(RC.readerRole||'事務局長') + '」（設定で変更可）。当日の出欠に合わせて読み替える</span><button class="btn s" id="rcCopy" style="white-space:nowrap">コピー</button></div><textarea id="rcScript" readonly style="width:100%;min-height:120px;padding:10px;border:1.5px solid var(--line);border-radius:8px;font-size:13.5px;line-height:1.7">' + esc(RC.script) + '</textarea></div>' : '') +
    '</div>';
  return h;
}
/* ---------- 会議シナリオ（司会台本） ---------- */
function viewScenario(){
  if(!SC) return '<div class="card"><div class="empty">読み込み中…</div></div>';
  var o = SC.opts || {}, st = SC.stats || {};
  var ta = function(key, label, ph, h){ return '<div class="f wide"><label>' + label + '</label><textarea id="sc_' + key + '" placeholder="' + esc(ph) + '" style="min-height:' + (h||70) + 'px">' + esc(o[key]||'') + '</textarea></div>'; };
  var inp = function(key, label, ph, listId){ return '<div class="f"><label>' + label + '</label><input id="sc_' + key + '" value="' + esc(o[key]||'') + '" placeholder="' + esc(ph) + '"' + (listId ? ' list="' + listId + '"' : '') + '></div>'; };
  var dl = function(id, arr){ return '<datalist id="' + id + '">' + (arr||[]).map(function(x){ return '<option value="' + esc(x.name) + '">' + esc(x.role||'') + '</option>'; }).join('') + '</datalist>'; };
  var dlFull = function(id, arr){ return '<datalist id="' + id + '">' + (arr||[]).map(function(x){ return '<option value="' + esc((x.role ? x.role + '　' : '') + x.name) + '">'; }).join('') + '</datalist>'; };
  var h = '<div class="card" style="padding:16px 20px;margin-bottom:12px">' +
    '<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px"><div><b style="font-size:15px">' + esc(SC.meeting) + '　会議シナリオ</b><span class="muted" style="font-size:12.5px;margin-left:10px">' + esc(SC.date) + ' ' + esc(SC.time) + '～' + (SC.saved ? '　保存済み（' + esc(SC.updated) + '）' : '　未保存（テンプレから自動生成）') + '</span></div>' +
    '<div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center"><b style="font-size:13px;margin-right:4px">シナリオ：</b><button class="btn" id="scRegen">入力からテンプレを作り直す</button><button class="btn p" id="scSave">シナリオを保存</button><button class="btn p" id="scView" style="background:var(--ok);border-color:var(--ok)">シナリオを読む（スマホ向け）</button><button class="btn" id="scPrint">シナリオを印刷（PC）</button><button class="btn" id="scCopy">全文コピー</button><button class="btn" id="scDoc">Googleドキュメントに作る</button></div>' +
    '<div id="scDocDone" style="display:none;margin-top:8px;padding:8px 12px;background:#e3f3e8;border-radius:8px;font-size:13px"></div></div>' +
    '<div style="background:#fff7e6;border-left:4px solid #e6a700;border-radius:8px;padding:8px 12px;margin:10px 0;font-size:12.5px;line-height:1.6"><b>採決の数え方</b>：' + (SC.isKaigisho ? '【予算】は出席会員会議所のLOM数（現在 ' + (st.lomCome||0) + 'LOM）、' : '') + '【採決】は議長を除く出席議決権者の人数（現在 ' + (st.votersCome||0) + '名、議長を除くと ' + Math.max(0,(st.votersCome||0)-1) + '名）。当日の受付で変わるので、会議直前に「入力からテンプレを作り直す」を押すと最新の人数になります。</div>' +
    '<div class="mb" style="padding:0">' +
    '<div class="f"><label>司会（進行役）</label><input id="sc_mc" value="' + esc(o.mc||'') + '" placeholder="' + (SC.mcRole ? '空欄＝名簿の' + esc(SC.mcRole) : '名簿から選ぶ（委員長・副委員長・幹事など）') + '" list="scMcs">' + dl('scMcs', SC.mcs) + '<div class="hint">' + (SC.mcRole ? '既定は' + esc(SC.mcRole) + '。別の人がするときはここで選ぶ' : '回ごとに選ぶ。役職は名簿から自動で付く') + '</div></div>' +
    '<div class="f"><label>議長（' + esc(SC.chairRole) + '）</label><input id="sc_chair" value="' + esc(o.chair||'') + '" placeholder="空欄＝名簿の' + esc(SC.chairRole) + '" list="scChairs">' + dl('scChairs', SC.chairs) + '</div>' +
    '<div class="f"><label>監査担当役員（講評する人にチェック。複数可）</label><div style="display:flex;gap:14px;flex-wrap:wrap;padding:6px 0">' +
      ((SC.kansas||[]).length ? SC.kansas.map(function(k){ var on = Array.isArray(o.kansaList) ? o.kansaList.indexOf(k.name) >= 0 : true; return '<label style="display:flex;gap:6px;align-items:center;cursor:pointer;font-weight:400"><input type="checkbox" class="sc_kansa" value="' + esc(k.name) + '"' + (on ? ' checked' : '') + '> ' + esc(k.name) + '</label>'; }).join('') : '<span class="muted">名簿に監査担当役員がいません</span>') +
      '</div><input id="sc_kansaExtra" value="' + esc(o.kansaExtra||'') + '" placeholder="名簿にない人を入れる場合はここ（任意）" style="margin-top:4px"></div>' +
    '<div class="f wide"><label style="display:flex;gap:8px;align-items:center;cursor:pointer"><input type="checkbox" id="sc_creed"' + (o.creed === false ? '' : ' checked') + '> 唱和（クリード・ミッション／ビジョン・宣言文／綱領）を入れる</label></div>' +
    inp('creed1', 'JCIクリード唱和', '空欄＝名簿の委員長1人目', 'scPeople') + inp('creed2', 'ミッション／ビジョン唱和', '空欄＝名簿の委員長2人目', 'scPeople') + inp('creed3', '宣言文／綱領唱和', '空欄＝名簿の委員長3人目', 'scPeople') + dlFull('scPeople', SC.people) +
    inp('prev', '前回の会議名（議事録承認）', '空欄＝会議マスタから自動（直近の役員会・会員会議所会議。初回は「無し」）') + inp('next', '次回開催日・場所', '空欄＝会議マスタの次の会議') +
    ta('docs', '議題並びに資料の確認（読み上げ文）', '空欄＝「本日の次第はアジェンダシステムをご確認ください。紙資料などはございません。」', 50) +
    (SC.isKaigisho ? '' : ta('kakunin', '確認事項（役員会のみ・1行1件：資料名|担当）', '例：公益社団法人日本青年会議所2027年度基本資料|運営専務室', 60)) +
    ta('shingi', '審議事項（1行1件：議案名|上程者）', '例：2027年度 地域活性委員会 事業計画並びに予算（案）承認の件|三村委員長', 80) +
    ta('kyogi', '協議事項（1行1件：議案名|担当）', '例：◯◯事業について|副会長　◯◯', 60) +
    ta('togi', '討議事項（1行1件：議案名|担当）', '', 50) +
    ta('hokoku', '報告依頼事項（1行1件：議案名|担当）', '', 50) +
    '</div><div class="hint">担当者の欄は入力すると名簿（この会議の対象者）から「役職　氏名」で候補が出ます。協議・討議・報告の担当も「議案名|副会長　山田 太郎」のように役職付きで。入力を変えたら「入力からテンプレを作り直す」→ 下の本文が更新されます（下で手直しした内容は上書きされるので、先に入力を済ませてから手直し）。</div></div>';
  h += '<div class="card" style="padding:12px 16px"><div class="schead"><b>本文（次第ごとに手直しできます）</b><button class="btn s" id="scAdd">＋ 次第を追加</button><span class="muted">↑↓で並べ替え、×で削除。「◯番項、」の番号は保存・印刷時に並び順で振り直されます（セミナー等の特別な項目は追加して↑で先頭へ）</span></div>' +
    '<div id="scSecs">' + (SC.sections||[]).map(function(sec, i){ return scenarioRow(sec, i); }).join('') + '</div></div>';
  return h;
}
function scenarioRow(sec, i){
  return '<div class="scrow" data-i="' + i + '">' +
    '<input class="sct" value="' + esc(sec.title||'') + '" placeholder="次第名">' +
    '<textarea class="scx" placeholder="シナリオ本文">' + esc(sec.text||'') + '</textarea>' +
    '<textarea class="scn" placeholder="備考・担当">' + esc(sec.note||'') + '</textarea>' +
    '<div class="scops"><button type="button" class="btn s scup" title="上へ">↑ 上へ</button><button type="button" class="btn s scdn" title="下へ">↓ 下へ</button><button type="button" class="btn s d scdel" title="この次第を消す">× 削除</button></div></div>';
}
function scenarioRead(){
  var o = {};
  ['mc','chair','creed1','creed2','creed3','prev','next','docs','kakunin','shingi','kyogi','togi','hokoku','kansaExtra'].forEach(function(k){ var el = document.getElementById('sc_' + k); if(el) o[k] = el.value; });
  o.kansaList = Array.prototype.map.call(document.querySelectorAll('.sc_kansa:checked'), function(c){ return c.value; });
  if(o.kansaExtra && o.kansaExtra.trim()) o.kansaList = o.kansaList.concat(o.kansaExtra.split(/[、,]/).map(function(x){ return x.trim(); }).filter(Boolean));
  var c = document.getElementById('sc_creed'); o.creed = c ? c.checked : true;
  var KAN = ['〇','一','二','三','四','五','六','七','八','九','十','十一','十二','十三','十四','十五','十六','十七','十八','十九','二十','二十一','二十二','二十三','二十四','二十五'];
  var secs = Array.prototype.map.call(document.querySelectorAll('#scSecs .scrow'), function(r, i){
    // 「◯番項、」は並び順で振り直す（追加・並べ替え・削除しても番号が合う）
    var text = r.querySelector('.scx').value.replace(/^((?:.*\n)*?)([〇一二三四五六七八九十]+)(番項?、)/, function(m0, pre, n, tail){ return pre + (KAN[i+1]||String(i+1)) + tail; });
    return { title: r.querySelector('.sct').value, text: text, note: r.querySelector('.scn').value };
  });
  return { opts: o, sections: secs };
}
function bindScenario(){
  var load = function(regen, opts){ api().withSuccessHandler(function(r){ SC = r; rerender('rollcall', viewRollCall); }).withFailureHandler(function(e){ toast('エラー：' + e.message); }).adminScenarioData(TOKEN, RC_ID, !!regen, opts || null); };
  var rg = document.getElementById('scRegen'); if(rg) rg.onclick = function(){ var d = scenarioRead(); rg.disabled = true; confirmBox('入力からテンプレを作り直しますか？', '下の本文は、上の入力と今の出席状況（受付・回答）から作り直されます。本文を手直しした分は消えます。作り直したあと「保存」を押してください。', function(){ closeModal(true); load(true, d.opts); }); rg.disabled = false; };
  var sv = document.getElementById('scSave'); if(sv) sv.onclick = function(){ var d = scenarioRead(); sv.disabled = true; api().withSuccessHandler(function(){ sv.disabled = false; SC.opts = d.opts; SC.sections = d.sections; SC.saved = true; toast('保存しました'); }).withFailureHandler(function(e){ sv.disabled = false; toast('エラー：' + e.message); }).adminScenarioSave(TOKEN, RC_ID, d.opts, d.sections); };
  var ad = document.getElementById('scAdd'); if(ad) ad.onclick = function(){ var box = document.getElementById('scSecs'); var n = box.querySelectorAll('.scrow').length; box.insertAdjacentHTML('beforeend', scenarioRow({title:'', text:'', note:''}, n)); bindScenarioRows(); };
  bindScenarioRows();
  var cp = document.getElementById('scCopy'); if(cp) cp.onclick = function(){ var d = scenarioRead(); var t = d.sections.map(function(s){ return '■' + s.title + '\n' + s.text + (s.note ? '\n（' + s.note + '）' : ''); }).join('\n\n'); if(navigator.clipboard) navigator.clipboard.writeText(t).then(function(){ toast('コピーしました'); }); };
  var dc = document.getElementById('scDoc'); if(dc) dc.onclick = function(){ var d = scenarioRead(); confirmBox('Googleドキュメントに作りますか？', '今の内容を保存してから、議事録フォルダ（設定がなければマイドライブ）に「' + SC.meeting + '　会議シナリオ」を作ります。初回は権限の許可が出ることがあります。', function(){ busy(true); api().withSuccessHandler(function(){ api().withSuccessHandler(function(r){ busy(false); closeModal(true); var dn = document.getElementById('scDocDone'); if(dn){ dn.style.display = 'block'; dn.innerHTML = '✓ Googleドキュメントを作りました（議事録フォルダ、無ければマイドライブ）　<a href="' + esc(r.url) + '" target="_blank" rel="noopener" style="font-weight:700">開く →</a>'; } toast('作成しました'); }).withFailureHandler(function(e){ busy(false); showErr(e.message); }).adminScenarioDoc(TOKEN, RC_ID); }).withFailureHandler(function(e){ busy(false); showErr(e.message); }).adminScenarioSave(TOKEN, RC_ID, d.opts, d.sections); }); };
  /* 読む（表示のみ）：この画面の中にシナリオを読む形で出す。スマホでそのまま読める／ブラウザの印刷でも出せる */
  var vw = document.getElementById('scView'); if(vw) vw.onclick = function(){
    var d = scenarioRead();
    var ov = document.getElementById('scOverlay'); if(!ov){ ov = document.createElement('div'); ov.id = 'scOverlay'; document.body.appendChild(ov); }
    ov.innerHTML = '<div class="scv"><div class="scvbar"><button type="button" class="btn" id="scvClose">← 編集に戻る</button><span class="muted" style="font-size:12px">保存前の内容です</span><button type="button" class="btn" id="scvPrint">このまま印刷</button></div>' +
      '<div class="scvdoc"><div class="org">' + esc(SC.title) + '</div><h1>' + esc(SC.meeting) + '　会議シナリオ</h1><div class="when">' + esc(SC.date) + ' ' + esc(SC.time) + '～　' + esc(SC.place) + '</div>' +
      d.sections.map(function(s){ return '<section><h2>' + esc(s.title) + '</h2><div class="x">' + esc(s.text).replace(/(【予算】[^\n]*|【採決】[^\n]*)/g, '<span class="vote">$1</span>').replace(/\n/g, '<br>') + '</div>' + (s.note ? '<div class="n">' + esc(s.note).replace(/\n/g, '<br>') + '</div>' : '') + '</section>'; }).join('') + '</div></div>';
    document.body.classList.add('scview');
    document.getElementById('scvClose').onclick = function(){ document.body.classList.remove('scview'); ov.innerHTML = ''; };
    document.getElementById('scvPrint').onclick = function(){ window.print(); };
    window.scrollTo(0, 0);
  };
  var pr = document.getElementById('scPrint'); if(pr) pr.onclick = function(){
    var d = scenarioRead();
    var html = '<!DOCTYPE html><html lang="ja"><head><meta charset="utf-8"><title>会議シナリオ</title><meta name="viewport" content="width=device-width,initial-scale=1">' +
      '<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&display=swap">' +
      '<style>@page{size:A4 portrait;margin:12mm 12mm 14mm}*{box-sizing:border-box}body{font-family:"Noto Sans JP","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;color:#111;font-size:10.5pt;margin:0}' +
      '.org{font-size:9.5pt;color:#555}h1{font-size:14pt;margin:2px 0 4px;font-weight:900}.when{font-size:10pt;margin-bottom:8px}' +
      'table{width:100%;border-collapse:collapse;table-layout:fixed}th,td{border:1px solid #444;padding:4px 6px;vertical-align:top;line-height:1.55;font-size:10pt}th{background:#e8ecf3;font-weight:700;text-align:center}' +
      'td.t{width:26mm;font-weight:700}td.n{width:34mm;font-size:9pt;color:#333}td.x{white-space:pre-wrap;word-break:break-all}tr{page-break-inside:avoid}' +
      '.vote{background:#fff7e6}.pbtn{margin:14px 0;display:flex;gap:10px;align-items:center;font-size:9pt;color:#666}.pbtn button{font:inherit;font-size:11pt;font-weight:700;padding:8px 18px;border:1px solid #444;border-radius:6px;background:#fff}@media print{.pbtn{display:none}}</style></head><body>' +
      '<div class="org">' + esc(SC.title) + '</div><h1>' + esc(SC.meeting) + '　会議シナリオ</h1><div class="when">' + esc(SC.date) + ' ' + esc(SC.time) + '～　' + esc(SC.place) + '</div>' +
      '<table><thead><tr><th>次第</th><th>シナリオ</th><th>備考・担当</th></tr></thead><tbody>' +
      d.sections.map(function(s){ return '<tr><td class="t">' + esc(s.title) + '</td><td class="x">' + esc(s.text).replace(/(【予算】[^\n]*|【採決】[^\n]*)/g, '<span class="vote">$1</span>') + '</td><td class="n">' + esc(s.note||'').replace(/\n/g,'<br>') + '</td></tr>'; }).join('') +
      '</tbody></table><div class="pbtn"><button onclick="window.print()">印刷する</button><span>スマホは右上メニュー（共有）→「印刷」でも</span></div><script>window.onload=function(){ if(window.innerWidth > 800) setTimeout(function(){ window.print(); }, 400); };<\/script></body></html>';
    openPrint(html);

  var f = function(label, key, extra){ return '<div class="f' + (extra&&extra.wide?' wide':'') + '"><label>' + label + '</label><input id="v_' + key + '" value="' + esc(v[key]||'') + '"' + (extra&&extra.ph?' placeholder="'+esc(extra.ph)+'"':'') + '></div>'; };
  showModal('<div class="mh"><h3>' + (v._row ? '候補を編集' : '候補を追加') + '</h3><button class="btn s" id="mClose">閉じる</button></div><div class="err" id="mErr"></div><div class="mb">' +
    f('店名', 'name', {ph:'例：創作焼肉 牛の匠', wide:true}) +
    f('エリア', 'area', {ph:'例：高松・瓦町'}) + f('電話', 'tel') +
    f('住所', 'address', {wide:true}) + f('URL（管理用：コース・金額のページ可）', 'url', {wide:true}) + f('公開URL（閲覧ページの「お店のサイト」に使う。空欄なら管理用URLから店のトップページを自動で出す）', 'publicUrl', {wide:true, ph:'例：https://tabelog.com/kagawa/.../12345678/（金額の出ないページ）'}) +
    f('予算目安', 'budget', {ph:'例：5,000円／人'}) + f('人数目安', 'capacity', {ph:'例：20〜40名'}) +
    '<div class="f"><label>個室</label><select id="v_room"><option value="">不明</option><option' + (v.room==='有'?' selected':'') + '>有</option><option' + (v.room==='無'?' selected':'') + '>無</option></select></div>' +
    '<div class="f"><label>評価</label><select id="v_rating"><option value="">—</option>' + [1,2,3,4,5].map(function(n){ return '<option value="' + n + '"' + (v.rating==n?' selected':'') + '>' + '★'.repeat(n) + '</option>'; }).join('') + '</select></div>' +
    '<div class="f wide"><label>メモ・感想（料理、雰囲気、注意点など）</label><textarea id="v_memo" style="min-height:80px">' + esc(v.memo||'') + '</textarea></div>' +
    '<div class="f wide"><label>引継ぎ（次年度へ：予約の取り方、担当者、値段交渉、良かった点・困った点）</label><textarea id="v_handover" style="min-height:80px">' + esc(v.handover||'') + '</textarea></div></div>' +
    '<div class="mf"><button class="btn" id="mCancel">キャンセル</button><button class="btn p" id="mSave">保存</button></div>');
  document.getElementById('mSave').onclick = function(){
    busy(true);
    var data = { _row: v._row || 0 };
    ['name','area','tel','address','url','publicUrl','budget','capacity','room','rating','memo','handover'].forEach(function(k){ var el = document.getElementById('v_' + k); if(el) data[k] = el.value; });
    api().withSuccessHandler(function(r){ busy(false); VEN = r; D.venues = r.venues.map(function(x){ return x.name; }); D.venueList = r.venues.map(function(x){ return { name: x.name, area: x.area, address: x.address, tel: x.tel, url: x.url, publicUrl: x.publicUrl, budget: x.budget, capacity: x.capacity, rating: x.rating, memo: x.memo, uses: x.uses, last: x.last }; }); closeModal(true); rerender('venues', viewVenues); toast('保存しました'); }).withFailureHandler(function(e){ busy(false); showErr(e.message); }).adminVenueSave(TOKEN, data);
  };
}

function bindVenues(){
  var vb = document.getElementById('vBulk'); if(vb) vb.onclick = venueBulkForm;
  var q = document.getElementById('vq'); if(q) q.oninput = function(){ VEN_Q = q.value; rerender('venues', viewVenues); var q2 = document.getElementById('vq'); q2.focus(); q2.setSelectionRange(q2.value.length, q2.value.length); };
  var so = document.getElementById('vSort'); if(so) so.onchange = function(){ VEN_SORT = so.value; rerender('venues', viewVenues); };

  var im = document.getElementById('vImport'); if(im) im.onclick = function(){ im.disabled = true; api().withSuccessHandler(function(r){ VEN = r; D.venues = r.venues.map(function(x){ return x.name; }); D.venueList = r.venues.map(function(x){ return { name: x.name, area: x.area, address: x.address, tel: x.tel, url: x.url, publicUrl: x.publicUrl, budget: x.budget, capacity: x.capacity, rating: x.rating, memo: x.memo, uses: x.uses, last: x.last }; }); rerender('venues', viewVenues); toast('取り込みました'); }).withFailureHandler(function(e){ im.disabled = false; toast('エラー：' + e.message); }).adminVenueImport(TOKEN); };

/* ---------- プロジェクト（小委員会・事業ごとの専用ページ） ---------- */
var PRJ = null, PRJ_DONE = false;
function projectNames(){ var reg = (D.projects || []).filter(function(p){ return p.state !== '終了'; }).map(function(p){ return p.name; }); var used = (D.meetings || []).map(function(x){ return String(x['プロジェクト']||'').trim(); }); return reg.concat(used).filter(function(v,i,a){ return v && a.indexOf(v)===i; }); }
function loadProjects(){ api().withSuccessHandler(function(r){ PRJ = r; D.projects = r.projects.map(function(p){ return { name: p.name, leader: p.leader, state: p.state }; }); rerender('projects', viewProjects); }).withFailureHandler(function(e){ toast('エラー：' + e.message); }).adminProjects(TOKEN); }
function viewProjects(){
  var h = '<div class="bar"><h2>プロジェクト <span class="helpq" data-hq="プロジェクト">?</span></h2><button class="btn p" id="pjAdd">＋ プロジェクトを追加</button></div>' +
    '<div class="muted" style="font-size:13px;margin:-4px 0 12px">小委員会や事業（例：○○小委員会）ごとに、会議と日程調整をまとめて見られるようにします。<br>登録すると、その小委員会専用のページURLができます（いつもの出欠ページと同じものが、その小委員会の予定を上にして開きます）。メンバーにはそのURLを送るだけ。会議や日程調整を作るときは、同じプロジェクト名を選んでください。</div>';
  if(!PRJ) return h + '<div class="card"><div class="empty">読み込み中…</div></div>';
  var list = PRJ.projects.filter(function(p){ return PRJ_DONE ? true : p.state !== '終了'; });
  var doneN = PRJ.projects.filter(function(p){ return p.state === '終了'; }).length;
  h += '<div class="card tbl"><table><thead><tr><th>プロジェクト</th><th>リーダー</th><th>予定</th><th>専用のページURL</th><th></th></tr></thead><tbody>' +
    (list.length ? list.map(function(p){
      return '<tr' + (p.state === '終了' ? ' style="opacity:.6"' : '') + '><td class="name">📁 ' + esc(p.name) + (p.state === '終了' ? ' <span class="tag">終了' + (p.end ? ' ' + esc(fmtD(p.end)) : '') + '</span>' : ' <span class="tag g">進行中</span>') + (p.memo ? '<div class="muted" style="font-size:12px;font-weight:400;white-space:normal">' + esc(p.memo) + '</div>' : '') + '</td>' +
        '<td>' + esc(p.leader || '—') + '</td>' +
        '<td style="white-space:nowrap">会議 ' + p.meetings + '（今後 ' + p.upcoming + '）<br><span class="muted" style="font-size:12px">日程調整 ' + p.polls + '</span></td>' +
        '<td><input readonly value="' + esc(p.url) + '" style="width:100%;min-width:160px;padding:6px 8px;border:1px solid var(--line);border-radius:6px;font-size:11.5px;font-family:monospace" onclick="this.select()"></td>' +
        '<td style="white-space:nowrap"><a class="btn s" href="' + esc(p.url) + '" target="_blank" rel="noopener">開く ↗</a> <button class="btn s" data-copy="' + esc(p.url) + '">コピー</button> <button class="btn s" data-pjedit="' + p._row + '">編集</button></td></tr>';
    }).join('') : '<tr><td colspan="5" class="empty">まだありません。「＋ プロジェクトを追加」から</td></tr>') +
    '</tbody></table></div>';
  if(doneN) h += '<div style="margin-top:8px"><button class="btn s" id="pjDone">' + (PRJ_DONE ? '終了したものを隠す' : '終了したものも表示（' + doneN + '）') + '</button></div>';
  if(PRJ.unlisted && PRJ.unlisted.length) h += '<div class="card" style="margin-top:12px;border-color:#efd88a;background:#fff8e5"><b style="font-size:13px">会議・日程調整に書かれているが未登録のプロジェクト名</b><div class="muted" style="font-size:12.5px;margin:4px 0 8px">登録すると専用のページURLができ、出欠ページで切り替えられるようになります（名前はそのまま使えます）</div>' + PRJ.unlisted.map(function(n){ return '<button class="btn s" data-pjnew="' + esc(n) + '" style="margin:0 6px 6px 0">＋ ' + esc(n) + ' を登録</button>'; }).join('') + '</div>';
  return h;
}
function projectForm(p){
  p = p || {};
  showModal('<div class="mh"><h3>' + (p._row ? 'プロジェクトを編集' : 'プロジェクトを追加') + '</h3><button class="btn s" id="mClose">閉じる</button></div><div class="err" id="mErr"></div><div class="mb">' +
    '<div class="f wide"><label>プロジェクト名</label><input id="pj_name" value="' + esc(p.name || '') + '" placeholder="例：ASPAC小委員会／シニア合同例会"><div class="hint">会議・日程調整の「プロジェクト名」と同じ名前でつながります。短く分かりやすく（& = ? # / は使えません）</div></div>' +
    '<div class="f"><label>リーダー</label><input id="pj_leader" list="pjLeaderList" value="' + esc(p.leader || '') + '" placeholder="名簿の氏名"><datalist id="pjLeaderList">' + (D.members||[]).map(function(m){ return '<option value="' + esc(m['氏名']) + '">'; }).join('') + '</datalist><div class="hint">出欠ページの上に「リーダー：○○」と出ます</div></div>' +
    '<div class="f"><label>状態</label><div class="seg" id="pj_state">' + ['進行中','終了'].map(function(v){ return '<button type="button" data-v="' + v + '" aria-pressed="' + ((p.state || '進行中') === v) + '">' + v + '</button>'; }).join('') + '</div><div class="hint">終了にすると一覧や出欠ページから消えます（記録は残ります）</div></div>' +
    '<div class="f wide"><label>メモ（目的・期間など）</label><input id="pj_memo" value="' + esc(p.memo || '') + '" placeholder="例：2027/5 開催。準備会議は隔週"></div>' +
    '<div class="f wide"><label>振り返り（次年度への引継ぎ）</label><textarea id="pj_review" style="min-height:70px" placeholder="うまくいった点・困った点・来年やるなら">' + esc(p.review || '') + '</textarea></div>' +
    '</div><div class="mf">' + (p._row ? '<button class="btn" id="pjDel" style="color:var(--ng);margin-right:auto">削除</button>' : '') + '<button class="btn" id="mCancel">キャンセル</button><button class="btn p" id="mSave">保存</button></div>');
  var segBtns = document.querySelectorAll('#pj_state button');
  Array.prototype.forEach.call(segBtns, function(b){ b.onclick = function(){ Array.prototype.forEach.call(segBtns, function(x){ x.setAttribute('aria-pressed', x === b ? 'true' : 'false'); }); }; });
  document.getElementById('mSave').onclick = function(){
    var st = document.querySelector('#pj_state button[aria-pressed=true]');
    var data = { _row: p._row || 0, name: document.getElementById('pj_name').value, leader: document.getElementById('pj_leader').value, state: st ? st.dataset.v : '進行中', memo: document.getElementById('pj_memo').value, review: document.getElementById('pj_review').value, end: p.end || '' };
    if(!data.name.trim()) return showErr('プロジェクト名を入れてください');
    busy(true);
    api().withSuccessHandler(function(r){ busy(false); PRJ = r; D.projects = r.projects.map(function(x){ return { name: x.name, leader: x.leader, state: x.state }; }); closeModal(true); rerender('projects', viewProjects); toast('保存しました'); }).withFailureHandler(function(e){ busy(false); showErr(e.message); }).adminProjectSave(TOKEN, data);
  };
  var del = document.getElementById('pjDel'); if(del) del.onclick = function(){ confirmBox('削除しますか？', '登録を消すだけで、会議・日程調整の記録は残ります。終わっただけなら「状態：終了」の方をおすすめします。', function(){ busy(true); api().withSuccessHandler(function(r){ busy(false); PRJ = r; D.projects = r.projects.map(function(x){ return { name: x.name, leader: x.leader, state: x.state }; }); closeModal(true); rerender('projects', viewProjects); toast('削除しました'); }).withFailureHandler(function(e){ busy(false); showErr(e.message); }).adminProjectDelete(TOKEN, p._row); }, true); };
}
function bindProjects(){
  var a = document.getElementById('pjAdd'); if(a) a.onclick = function(){ projectForm(null); };
  var dn = document.getElementById('pjDone'); if(dn) dn.onclick = function(){ PRJ_DONE = !PRJ_DONE; rerender('projects', viewProjects); };
  Array.prototype.forEach.call(document.querySelectorAll('[data-pjedit]'), function(b){ b.onclick = function(){ projectForm(PRJ.projects.filter(function(x){ return x._row == b.dataset.pjedit; })[0]); }; });
  Array.prototype.forEach.call(document.querySelectorAll('[data-pjnew]'), function(b){ b.onclick = function(){ projectForm({ name: b.dataset.pjnew }); }; });
}

/* ---------- 要望・不具合（管理者・スタッフ投稿／マスター回答） ---------- */
var FB = null, FB_SHOW_DONE = false;
function loadFeedback(){ api().withSuccessHandler(function(r){ FB = r; rerender('feedback', viewFeedback); }).withFailureHandler(function(e){ toast('エラー：'+e.message); }).adminFeedback(TOKEN); }
function viewFeedback(){
  var h = '<div class="bar"><h2>要望・不具合</h2><label style="font-size:13px;display:flex;gap:6px;align-items:center"><input type="checkbox" id="fbDone"' + (FB_SHOW_DONE?' checked':'') + '>対応済・見送りも表示</label><button class="btn p" id="fbAdd">＋ 書く</button></div>';
  h += '<div class="card" style="padding:10px 16px;margin-bottom:10px;font-size:12.5px;border-left:4px solid var(--blue)">使っていて困ったこと・直してほしいこと・質問はここに。<b>どの画面で／何が起きたか／どうしてほしいか</b>を書くと直しやすいです。マスターが状態（受付→検討中→対応済／見送り）と回答を返します。口頭やLINEだと流れてしまうので、小さなことでもここへ。</div>';
  if(!FB) return h + '<div class="card"><div class="empty">読み込み中…</div></div>';
  var tagOf = function(s){ return s==='対応済' ? 'g' : s==='検討中' ? 'y' : s==='見送り' ? '' : 'r'; };
  var rows = FB.items.filter(function(x){ return FB_SHOW_DONE || (x.state!=='対応済' && x.state!=='見送り'); });
  h += '<div class="card tbl"><table><thead><tr><th>日時</th><th>投稿者</th><th>区分</th><th>画面</th><th>内容</th><th>状態</th><th>マスター回答</th>' + (FB.isMaster ? '<th></th>' : '') + '</tr></thead><tbody>' +
    (rows.length ? rows.map(function(x){ return '<tr><td class="muted" style="font-size:12px">' + esc(x.at) + '</td><td>' + esc(x.who) + '</td><td><span class="tag b">' + esc(x.kind) + '</span></td><td class="muted">' + esc(x.screen) + '</td><td style="white-space:normal;min-width:260px">' + esc(x.body).replace(/\n/g,'<br>') + '</td><td><span class="tag ' + tagOf(x.state) + '">' + esc(x.state) + '</span></td><td style="white-space:normal;min-width:200px;font-size:13px">' + esc(x.reply).replace(/\n/g,'<br>') + (x.reply ? '<div class="muted" style="font-size:11px">' + esc(fmtD(x.updated)) + '</div>' : '') + '</td>' + (FB.isMaster ? '<td><button class="btn s" data-fbed="' + x._row + '">回答</button></td>' : '') + '</tr>'; }).join('') : '<tr><td colspan="8" class="empty">まだありません</td></tr>') + '</tbody></table></div>';
  return h;
}
function feedbackForm(){
  var opts = function(list, sel){ return list.map(function(v){ return '<option' + (v===sel?' selected':'') + '>' + esc(v) + '</option>'; }).join(''); };
  var screens = ['会議','名簿','会議種別','案内・メール','出席確認名簿','懇親会場','受付・集金','予算','出席状況','当日受付ページ','回答ページ','閲覧ページ','その他'];
  showModal('<div class="mh"><h3>要望・不具合を書く</h3><button class="btn s" id="mClose">閉じる</button></div><div class="err" id="mErr"></div><div class="mb">' +
    '<div class="f"><label>区分</label><select id="fb_kind">' + opts(FB.kinds, '要望') + '</select></div>' +
    '<div class="f"><label>画面</label><select id="fb_screen">' + opts(screens, 'その他') + '</select></div>' +
    '<div class="f wide"><label>内容（何が起きた／どうしてほしい）</label><textarea id="fb_body" style="min-height:120px" placeholder="例：当日受付で、欠席の人を出席にしたとき会議費が0のままだった。自動で金額が入ってほしい"></textarea></div></div>' +
    '<div class="mf"><button class="btn" id="mCancel">キャンセル</button><button class="btn p" id="mSave">送る</button></div>');
  document.getElementById('fb_body').focus();
  document.getElementById('mSave').onclick = function(){
    busy(true);
    api().withSuccessHandler(function(r){ busy(false); FB = r; closeModal(true); rerender('feedback', viewFeedback); toast('送りました。ありがとうございます'); }).withFailureHandler(function(e){ busy(false); showErr(e.message); })
      .adminFeedbackPost(TOKEN, { kind: document.getElementById('fb_kind').value, screen: document.getElementById('fb_screen').value, body: document.getElementById('fb_body').value });
  };
}
function feedbackReply(x){
  var opts = function(list, sel){ return list.map(function(v){ return '<option' + (v===sel?' selected':'') + '>' + esc(v) + '</option>'; }).join(''); };
  showModal('<div class="mh"><h3>回答・状態を更新</h3><button class="btn s" id="mClose">閉じる</button></div><div class="err" id="mErr"></div><div class="mb">' +
    '<div class="f wide"><label>投稿（' + esc(x.who) + '・' + esc(x.at) + '）</label><div style="padding:10px 12px;background:var(--bg);border-radius:8px;white-space:pre-wrap">' + esc(x.body) + '</div></div>' +
    '<div class="f"><label>状態</label><select id="fb_state">' + opts(FB.states, x.state || '受付') + '</select></div>' +
    '<div class="f wide"><label>マスター回答</label><textarea id="fb_reply" style="min-height:100px">' + esc(x.reply||'') + '</textarea></div></div>' +
    '<div class="mf"><button class="btn" id="mCancel">キャンセル</button><button class="btn p" id="mSave">保存</button></div>');
  document.getElementById('mSave').onclick = function(){
    busy(true);
    api().withSuccessHandler(function(r){ busy(false); FB = r; closeModal(true); rerender('feedback', viewFeedback); toast('更新しました'); }).withFailureHandler(function(e){ busy(false); showErr(e.message); })
      .adminFeedbackUpdate(TOKEN, x._row, document.getElementById('fb_state').value, document.getElementById('fb_reply').value);
  };

function bindFeedback(){
  var a = document.getElementById('fbAdd'); if(a) a.onclick = function(){ if(!FB) return toast('読み込み中です'); feedbackForm(); };
  var d = document.getElementById('fbDone'); if(d) d.onchange = function(){ FB_SHOW_DONE = d.checked; rerender('feedback', viewFeedback); };
  Array.prototype.forEach.call(document.querySelectorAll('[data-fbed]'), function(b){ b.onclick = function(){ feedbackReply(FB.items.filter(function(x){ return x._row == b.dataset.fbed; })[0]); }; });
}

/* 会議の編集：行事の入力欄（3行）を「名前｜時間｜会費｜対象」の形にまとめ、対象になる人を下に出す */
function evSync(){
  var out = [], ty = (document.getElementById('f_会議種別') || {}).value || '', seen = {};
  var han = function(t){ return String(t || '').replace(/[０-９]/g, function(c){ return String.fromCharCode(c.charCodeAt(0) - 0xFEE0); }); };
  for(var i = 0; i < 3; i++){
    var g = function(k){ var e = document.querySelector('[data-ev="' + k + i + '"]'); return e ? String(e.value || '').replace(/[｜|\n]/g, ' ').trim() : ''; };
    var n = g('n').replace(/[／=＝]/g, '・'), pv = document.querySelector('[data-ev="p' + i + '"]');   // 「／」「=」は出欠の記録の区切りと重なるので「・」にする
    if(!n){ if(pv) pv.textContent = ''; continue; }
    if(seen[n]){ if(pv) pv.innerHTML = '<b style="color:var(--ng)">同じ名前の行事があります。名前を変えてください（この行は保存されません）</b>'; continue; }
    seen[n] = true;
    var words = g('w').replace(/[（）()「」『』【】\[\]]/g, ' ').split(/[,、，・／\/\s]+/).filter(function(x){ return x && x !== '全員' && x !== 'なし'; });   // かっこは無視する
    var fm = han(g('f')).replace(/[，,]/g, '').match(/\d+/), fee = fm ? Number(fm[0]) : 0;
    out.push([n, g('t'), fee ? String(fee) : '', words.join(',')].join('｜'));
    var hit = function(y, w){ y = String(y || '').trim(); if(/[*＊]/.test(w)){ w = w.replace(/[*＊]/g, ''); return !!w && y.indexOf(w) >= 0; } return y === w || y.split(/[\s　]+/).indexOf(w) >= 0; };   // 役職とぴったり同じ（または空白で区切った一部分と同じ）ときだけ。＊付きは「含む」
    var who = (D.members || []).filter(function(p){ return String(p[ty] || '').trim() !== '' && (!words.length || words.some(function(x){ return hit(p['役職'], x); })); });
    if(pv) pv.innerHTML = '対象：<b>' + who.length + '名</b>' + (words.length ? '' : '（この会議の対象者全員）') + '　' + (fee ? '会費 <b>¥' + fee.toLocaleString('ja-JP') + '</b>（出席の人の受付に入る）' : '会費なし（集金しない）') +
      (who.length ? (words.length ? '<div style="margin-top:2px">' + who.map(function(p){ return esc(p['氏名']) + '<span style="color:var(--sub)">（' + esc(p['役職'] || '') + '）</span>'; }).join('、') + '</div>' : '') : '<div style="color:var(--ng);font-weight:700">当てはまる人がいません。名簿の役職と同じ書き方か確かめてください（「含む」にするなら ＊専務 のように ＊ を付ける）</div>');
  }
  var ta = document.getElementById('f_行事'); if(ta) ta.value = out.join('\n');
}

/* 重要な操作の前に必ず1回出す注意書き。msg は「。」や改行で区切ると箇条書きになる。danger=元に戻せない操作（赤・「確認しました」にチェックしないと進めない） */
function confirmBox(title, msg, onYes, danger){
  var lines = []; String(msg || '').split('\n').forEach(function(l){ l.split('。').forEach(function(x, i, arr){ x = x.trim(); if(x) lines.push(x + (i < arr.length - 1 ? '。' : '')); }); });
  var body = lines.length ? '<ul style="margin:8px 0 0;padding-left:20px;line-height:1.7">' + lines.map(function(x){ return '<li>' + esc(x) + '</li>'; }).join('') + '</ul>' : '';
  showModal('<div class="mh"><h3>' + esc(title) + '</h3></div><div class="err" id="mErr"></div>' +
    '<div style="padding:14px 20px"><div style="background:' + (danger ? 'var(--ng-soft)' : '#fff7e6') + ';border-left:4px solid ' + (danger ? 'var(--ng)' : '#e6a700') + ';border-radius:8px;padding:12px 14px;font-size:13.5px;color:var(--ink)"><b>' + (danger ? '⚠ 元に戻せない操作です' : '確認してください') + '</b>' + body + '</div>' +
    (danger ? '<label style="display:flex;gap:8px;align-items:center;margin-top:12px;font-size:13.5px;cursor:pointer"><input type="checkbox" id="cAck"> 内容を確認しました</label>' : '') + '</div>' +
    '<div class="mf"><button class="btn" id="mCancel">やめる</button><button class="btn ' + (danger?'d':'p') + '" id="cYes"' + (danger ? ' disabled' : '') + '>OK（進む）</button></div>');
  var y = document.getElementById('cYes'), a = document.getElementById('cAck');
  if(a) a.onchange = function(){ y.disabled = !a.checked; };
  y.onclick = onYes;
}

function owlCan(tab){ return navTabs().some(function(t){ return t[0] === tab; }); }
function owlKb(){ return (D.kb || []).filter(function(x){ return !x.tab || owlCan(x.tab); }); }
function owlT(id){ return owlKb().filter(function(x){ return x.id === id; })[0]; }
function owlTabFromQuery(q){ var best = '', len = 0; Object.keys(OWL_KEYS).forEach(function(k){ if(!owlCan(k)) return; OWL_KEYS[k].forEach(function(w){ if(String(q).indexOf(w) >= 0 && w.length > len){ len = w.length; best = k; } }); }); return best; }
function owlClose(){ owlWalkStop(); var p = document.getElementById('owlPanel'); if(p) p.classList.remove('on'); document.body.classList.remove('owlopen'); }
function owlFace(k){ var i = document.getElementById('owlFace'); if(i) i.src = OWL_IMG[k]; }
function owlNorm(s){ return String(s || '').toLowerCase().replace(/[\s　、。・「」（）()？?！!：:／\/→＋+]/g, ''); }
function owlBigrams(q){ var n = owlNorm(q), bg = []; for(var i = 0; i < n.length - 1; i++){ var b = n.substr(i, 2); if(bg.indexOf(b) < 0) bg.push(b); } var strong = bg.filter(function(b){ return !/^[ぁ-ん]{2}$/.test(b); }); return strong.length ? strong : bg; }
/* 質問に近い「やりたいこと」を点数順に返す（題に当たれば高く、探す言葉に当たればさらに高く） */
function owlFind(q){
  var nq = owlNorm(q), bg = owlBigrams(q), qt = owlTabFromQuery(q);
  if(!nq) return [];
  return owlKb().map(function(x){
    var nt = owlNorm(x.t), body = owlNorm((x.s || []).join('') + (x.n || []).join('') + (x.w || '')), sc = 0, bodyHit = 0;
    bg.forEach(function(b){ if(nt.indexOf(b) >= 0) sc += 4; else if(body.indexOf(b) >= 0) bodyHit++; });
    sc += Math.min(bodyHit, 6);
    var kw = 0; String(x.k || '').split(' ').forEach(function(w){ var nw = owlNorm(w); if(nw && nq.indexOf(nw) >= 0){ sc += 3 + nw.length; kw++; } });
    if(qt && x.tab === qt) sc += 3;
    return { x: x, sc: sc, kw: kw };
  }).filter(function(o){ return o.sc > 0; }).sort(function(a, b){ return b.sc - a.sc; });
}
function owlGuideHits(q){
  var bg = owlBigrams(q); if(!bg.length) return [];
  return (D.guide || []).filter(function(r){ return r.k === 'S' || r.k === 'T'; }).map(function(r){ var a = owlNorm(r.a), bc = owlNorm((r.b || '') + (r.c || '')), sc = 0; bg.forEach(function(b){ if(a.indexOf(b) >= 0) sc += 3; else if(bc.indexOf(b) >= 0) sc += 1; }); return { r: r, sc: sc }; })

  if(hits.length){ owlFace('smile'); return owlShow(OWL_BACK + '<div class="owlq">ガイドの中で近い説明です</div>' + hits.map(function(r){ var t = owlTabOf((r.b || '') + (r.a || '')); return '<div class="owlhit"><b>' + esc(r.a) + '</b><div>' + esc(r.b || '') + '</div>' + (r.c ? '<div class="muted" style="font-size:12px;margin-top:3px">' + esc(r.c) + '</div>' : '') + (t ? '<button type="button" class="btn owlgo" data-owlgo="' + t + '">「' + esc(OWL_TABS[t]) + '」のページを開く →</button>' : '') + '</div>'; }).join('') + owlSendBox(q)); }
  // 言葉が拾えなかったとき：行き止まりにしない。場面から選んでもらい、同時にマスターへ送れるようにする
  owlFace('hi');
  var kb = owlKb();
  owlShow(OWL_BACK + '<div class="owlq">どの場面のことか、教えてください</div><div class="muted" style="font-size:12.5px;margin-bottom:6px">近いものを押すと、やり方とページをご案内します</div>' +
    OWL_CATS.map(function(c){ var ls2 = kb.filter(function(x){ return x.c === c[0]; }); if(!ls2.length) return ''; return '<details class="owlcat"' + (c[0] === 'help' ? ' open' : '') + '><summary><b>' + c[1] + '</b><small>' + c[2] + '</small></summary>' + ls2.map(function(x){ return owlBtnTopic(x); }).join('') + '</details>'; }).join('') + owlSendBox(q));
}

  api().withSuccessHandler(function(r){
    if(!r || !r.ok) return owlAnswer(q);

    var x = r.topic ? owlT(r.topic) : null, tab = r.tab || (x && x.tab) || owlTabOf(r.answer);
    owlShow(OWL_BACK + '<div class="owlans">' + esc(r.answer).replace(/\n/g, '<br>') + '</div>' +
      (x ? '<button type="button" class="btn p owlgo" data-owlt="' + esc(x.id) + '">' + (x.tab && x.tab !== TAB ? '「' + esc(OWL_TABS[x.tab]) + '」のページを開いて進める →' : '手順を1つずつ見る →') + '</button>' : (tab && owlCan(tab) && tab !== TAB ? '<button type="button" class="btn p owlgo" data-owlgo="' + tab + '">「' + esc(OWL_TABS[tab]) + '」のページを開く →</button>' : '')) + owlSendBox(q));

}
